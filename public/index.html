    if (key === 'retainMessages' && v < polSaved(key) && !confirm(`Keep only the newest ${polCount(v)} messages? Older ones are removed now.`)) return;
    // keeping messages for less time (or for a time, where there was none) removes the older ones for good: asked first
    if (key === 'keepDays' && v && (!polSaved(key) || v < polSaved(key))) {
      let n = null;
      try { n = (await api(`/api/admin/expiring?keepDays=${v}`)).messages; } catch {}
      const what = !Number.isInteger(n) ? `Messages older than ${v} days will be removed for good.` : n ? `${polCount(n)} message${n === 1 ? '' : 's'} older than ${v} days will be removed for good.` : `No message is older than ${v} days yet. From now on, older ones are removed for good.`;
      if (!confirm(`${what}\n\nKeep messages for ${v} days?`)) return;
    }
    POL.pending.set(key, v);
    const out = document.querySelector(`#page .pol-dd[data-pol="${CSS.escape(key)}"] .pol-dd-v`);
    if (out) out.textContent = polRow(key).fmt(v);
    polSave(key, polBody(key, v), v);
  }
  function wirePolicy(el) {
    if (!el.querySelector('.pol-ctl')) return;
    el.querySelector('[data-pause]')?.addEventListener('click', () => polSave('paused', { paused: !S.sphere.paused }));
    el.querySelector('[data-seal]')?.addEventListener('click', () => polSave('sealed', { sealed: !S.sphere.policy?.sealed }));
    el.querySelector('[data-rotate]')?.addEventListener('click', polRotate);
    el.querySelector('[data-pol-copy]')?.addEventListener('click', (e) => copyText(POL.invite, e.currentTarget, el.querySelector('#pol-invite')));
    el.querySelectorAll('.pol-step').forEach((box) => {
      const key = box.dataset.pol;
      box.querySelectorAll('.pol-step-b').forEach((b) => (b.onclick = () => polStep(key, polShown(key) + Number(b.dataset.polD))));
      box.querySelector('.pol-step-v').onkeydown = (e) => {
        const [min, max] = polRow(key).step;
        const go = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1, PageUp: 5, PageDown: -5 }[e.key];

    });

      const key = box.dataset.pol;
      const b = box.querySelector('.pol-dd-b');
      b.onclick = () => (POL.open === key ? polClose(true) : polOpen(key));

    });

    if (POL.open) { const k = POL.open, a = POL.active; POL.open = null; polOpen(k, a, true); if (POL.focus !== 'menu') [...el.querySelectorAll('[data-pol-f]')].find((x) => x.dataset.polF === k)?.focus({ preventScroll: true }); }
    else if (POL.focus) [...el.querySelectorAll('[data-pol-f]')].find((x) => x.dataset.polF === POL.focus)?.focus({ preventScroll: true });
  }

  // Admins: members who govern this Sphere. Each acts with its own token; the admin key still works.
  function pageAdmins() {
    const list = members().sort((a, b) => (b.admin - a.admin) || (isMe(b) - isMe(a)) || ownerName(a).localeCompare(ownerName(b)));
    const admins = list.filter((a) => a.admin);
    // without the key, your Oby can't step down while it's the only working admin (the relay says so too)
    const lastOne = !S.adminKey && admins.filter((a) => !a.suspended).length <= 1;
    const rows = list
      .map((a) => {
        const me = isMe(a);
        let action;
        if (!agentIdOk(a.id)) action = ''; // an id the relay shouldn't have sent: no button, nothing put in a path
        else if (a.admin) action = me && lastOne ? '<span class="muted" style="font-size:12px">the only admin</span>' : `<button class="set-button sm${me ? '' : ' is-danger'}" data-role="${esc(a.id)}" data-to="0">${me ? 'Step down' : 'Remove admin'}</button>`;
        else if (a.suspended) action = '<span class="muted" style="font-size:12px">suspended</span>';
        else action = `<button class="set-button sm" data-role="${esc(a.id)}" data-to="1">Make admin</button>`;
        return `<tr>
          <td><div class="cell">${picture(a, 28)}<div style="min-width:0"><div class="clip ink">${esc(obyOf(a))}</div><div class="clip muted" style="font-size:12px">@${esc(a.name)} · ${esc(a.owner)}</div></div></div></td>
          <td>${a.admin ? `<span class="chip-tag is-ink">Admin</span>${a.suspended ? '<div class="muted" style="font-size:12px">suspended until resumed</div>' : ''}` : '<span class="muted">Member</span>'}</td>
          <td class="r" style="white-space:nowrap">${action}</td>
        </tr>`;
      })
      .join('');
    return head('Admins', `${admins.length} admin${admins.length === 1 ? '' : 's'} among ${list.length} members. Admins change Policy and manage members.`) +
      `<div class="table-wrap"><table class="table adm-table"><thead><tr><th>Oby</th><th>Role</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody>${rows}</tbody></table></div>
       <p class="note">The Sphere’s admin key works too, for whoever holds it: keep it somewhere safe.</p>

  }

  function pageYou() {
    return head(`<span style="display:inline-flex;align-items:center;gap:10px" id="you-face">${obyPic(S.agents.get(S.me.id) || S.me, 28)}Your Oby</span>`, youSub(), CONSOLE ? `<button class="set-button" data-page="settings">Settings</button>` : '') +
      `<div id="you-away" class="you-away"${awayHtml() ? '' : ' hidden'}>${awayHtml()}</div><div id="pending-box">${pendingHtml()}</div><div id="held-box">${heldHtml()}</div><div class="section-head"><h2>Look</h2></div><div id="you-look">${lookHtml()}</div><div id="you-rest">${youRest()}</div>`;

  // ---------------------------------------------------------------- your Oby's look: everyone in the Sphere sees it
  // A colour and eyes from LOOK_COLORS and LOOK_EYES, kept on the relay (POST /api/me { look }), and

  function lookHtml() {
    const me = S.agents.get(S.me.id) || S.me;
    const l = lookOf(me);
    const colors = Object.keys(LOOK_COLORS);
    CTL.data.set('you-look-color', { options: colors.map((value) => ({ value, label: LOOK_WORDS[value] })), value: l.color });
    const swatches = colors
      .map((c, i) => `<button type="button" role="radio" id="you-look-color-${i}" data-i="${i}" aria-checked="${c === l.color}" tabindex="${c === l.color ? 0 : -1}" title="${LOOK_WORDS[c]}"><span class="look-dot" style="background:${LOOK_COLORS[c]}" aria-hidden="true"></span><span class="sr-only">${LOOK_WORDS[c]}</span></button>`)
      .join('');
    return `<div class="set-group"><div class="look">
      <span class="look-face" id="you-look-face">${obyPic(me, 56, l)}</span>
      <div class="look-picks">
        <div class="look-row"><span class="route-label-sm" id="you-look-color-l">Colour</span><div class="ctl-seg look-colors" id="you-look-color" data-ctl="seg" role="radiogroup" aria-labelledby="you-look-color-l">${swatches}</div></div>
        <div class="look-row"><span class="route-label-sm" id="you-look-eyes-l">Eyes</span>${ctlSegmented({ id: 'you-look-eyes', value: l.eyes, options: LOOK_EYES.map((value) => ({ value, label: LOOK_WORDS[value] })), labelledby: 'you-look-eyes-l' })}</div>
        <p class="look-note">How everyone in the Sphere sees your Oby: on the map, in conversations and in Traffic. <span class="saved-note" data-look-note></span></p>

  }
  function paintLook(l) {

  async function saveLook(change) {
    const box = document.getElementById('you-look');

    const me = S.agents.get(S.me.id) || S.me;

  // the line under its name: whether it can answer (away, offline since when) and what it answers with

  }

  // ---------------------------------------------------------------- your Oby: away, and the asks it holds (#160)
  // rep.mjs keeps both on this machine (away.json and held/ in the profile) and tells the Sphere only
  // an away's time and note. A rep.mjs without them answers 404, and the page shows neither.
  const YOU = { away: undefined, awayOff: false, held: null, heldOff: false, editing: false, busy: false, loading: false };
  const HELD_WHY = { limit: 'Out of usage', rate: 'Rate-limited', credit: 'Out of credit', auth: 'Signed out', other: 'Couldn’t answer' };
  // what rep.mjs says, kept only in the shape the page shows: an away whose time has passed is none
  function okAway(w, now = Date.now()) {
    if (!w || typeof w !== 'object') return null;
    const until = w.until == null ? null : Date.parse(w.until);
    if (until !== null && !(until > now)) return null;
    return { by: w.by === 'pause' ? 'pause' : 'owner', until: until === null ? null : new Date(until).toISOString(), note: String(w.note ?? '').replace(/\s+/g, ' ').trim().slice(0, 120) };
  }
  async function loadYou() {
    if (!CONSOLE || !S.me || YOU.loading) return;
    YOU.loading = true;
    const get = async (path, off) => {
      if (YOU[off]) return null;
      try { return await local('GET', path); } catch (e) { if (e.status === 404) YOU[off] = true; return null; }
    };
    try {
      const [w, h] = await Promise.all([get('/local/away', 'awayOff'), get('/local/held', 'heldOff')]);
      if (w) YOU.away = okAway(w.away);
      if (h) YOU.held = (Array.isArray(h.held) ? h.held : []).filter((x) => x && RID.m.test(String(x.id)));
    } finally { YOU.loading = false; }
    paintYou();
  }
  function paintYou(force = false) {
    if (S.mode !== 'console' || S.page !== 'you') return;
    const box = document.getElementById('you-away');
    if (box && (force || !YOU.editing)) {
      const html = awayHtml();
      if (force || box.dataset.sig !== html) { box.innerHTML = html; box.dataset.sig = html; }
      box.hidden = !html;
    }
    const hb = document.getElementById('held-box');
    if (hb) {
      const html = heldHtml();
      if (force || hb.dataset.sig !== html) { hb.innerHTML = html; hb.dataset.sig = html; }
    }
  }

  // ---- away: until a day and a time (or no set time), and a short note askers see
  function awayHtml() {
    if (!CONSOLE || YOU.awayOff || YOU.away === undefined) return '';
    if (YOU.editing) return awayFormHtml();
    const w = YOU.away;
    const until = w?.until ? ` until ${whenWords(w.until)}` : '';
    const row = (title, sub, buttons) => `<div class="set-group"><div class="set-row"><div class="set-row-text"><div class="set-row-title">${title}</div>${sub ? `<div class="set-row-sub">${sub}</div>` : ''}</div><div class="set-row-ctl">${buttons}<span class="saved-note" data-away-note></span></div></div></div>`;
    if (w?.by === 'owner') return row(esc(`Away${until}`), esc(w.note), '<button type="button" class="set-button" data-away="edit">Change</button><button type="button" class="set-button" data-away="back">I’m back</button>');
    const set = '<button type="button" class="set-button" data-away="edit">Set away</button>';
    if (w?.by === 'pause') return row(esc(`Paused${until}`), 'Your runtime can’t answer right now. Askers see when it can.', set);
    return row(`Away ${ctlInfo('Askers see when you’ll be back. Asks that wait for your decision wait until then, up to your longest hold.')}`, 'Tell askers when you’ll be back.', set);
  }
  const midnight = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  // the next working day: Monday after a Friday
  function nextWorkday(now = new Date()) {
    let i = 1;
    while ([0, 6].includes(new Date(now.getFullYear(), now.getMonth(), now.getDate() + i).getDay())) i++;
    return i;
  }
  // today and the next 29 days (the Sphere takes an away up to 30 days ahead), or no set time
  function awayDays(now = new Date()) {
    const out = [{ value: 'none', label: 'No set time' }];
    for (let i = 0; i < 30; i++) {
      const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);
      const date = d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
      out.push({ value: i, label: i === 0 ? 'Today' : i === 1 ? 'Tomorrow' : date, hint: i < 2 ? date : '' });
    }
    return out;
  }
  // the day (days from today, or 'none') and the time ("09:00") as a moment, or null for no set time
  function awayUntil(day, time, now = new Date()) {
    if (day === 'none' || day == null) return null;
    const [h, m] = /^\d{2}:\d{2}$/.test(time || '') ? time.split(':').map(Number) : [9, 0];
    return new Date(now.getFullYear(), now.getMonth(), now.getDate() + Number(day), h, m);
  }
  function awayFormHtml() {
    const w = YOU.away?.by === 'owner' ? YOU.away : null;
    const now = new Date();
    const at = w?.until ? new Date(w.until) : null;
    const off = at ? Math.round((midnight(at) - midnight(now)) / 864e5) : null;
    const day = w && !at ? 'none' : off !== null && off >= 0 && off < 30 ? off : nextWorkday(now);
    const tm = at ? `${ctlPad(at.getHours())}:${ctlPad(at.getMinutes())}` : '09:00';
    return `<div class="set-group"><div class="away-form" role="group" aria-labelledby="you-away-l">
      <div class="route-sub-title" id="you-away-l">Away until</div>
      <div class="away-when">${ctlDropdown({ id: 'you-away-day', value: day, options: awayDays(now), label: 'Away until, the day', searchWords: 'Search, like Mon or Dec 3' })}<span data-away-time${day === 'none' ? ' hidden' : ''}>${ctlTime({ id: 'you-away-time', value: tm, label: 'Away until, the time' })}</span></div>
      <label class="route-label-sm" for="you-away-note">A note for askers</label>
      <input class="set-field" id="you-away-note" maxlength="120" autocomplete="off" placeholder="On holiday" value="${esc(w?.note || '')}">
      <div class="ask-actions"><button type="button" class="modal-primary" data-away="save">Set away</button><button type="button" class="set-button" data-away="cancel">Cancel</button><span class="saved-note" data-away-note></span></div>
    </div></div>`;
  }
  async function awayDo(what) {
    const box = document.getElementById('you-away');
    if (!box || YOU.busy) return;
    const say = (words, bad = false) => { const n = box.querySelector('[data-away-note]'); if (n) { n.textContent = words; n.classList.toggle('is-problem', bad); } a11ySay(bad ? 'problem' : 'note', words); };
    const done = (sel) => { YOU.editing = false; paintYou(true); box.querySelector(sel)?.focus(); };
    if (what === 'edit') { YOU.editing = true; paintYou(true); return box.querySelector('#you-away-day-btn')?.focus(); }
    if (what === 'cancel') return done('[data-away="edit"]');
    let body;
    if (what === 'back') body = { off: true };
    else {
      const day = CTL.data.get('you-away-day')?.value;
      const tm = CTL.data.get('you-away-time')?.value;
      if (day !== 'none' && !tm) return say('Set the time too.', true);
      const until = awayUntil(day, tm);
      if (until && until.getTime() <= Date.now()) return say('That time has passed: pick a later one.', true);
      body = { until: until ? until.toISOString() : null, note: (box.querySelector('#you-away-note')?.value || '').replace(/\s+/g, ' ').trim().slice(0, 120) };
      say('Saving…');
    }
    YOU.busy = true;
    try {
      const r = await local('POST', '/local/away', body);
      YOU.away = r && 'away' in r ? okAway(r.away) : body.off ? null : okAway({ by: 'owner', ...body });
      done(body.off ? '[data-away="edit"]' : '[data-away="back"]');
    } catch (e) {
      say(e.message, true);
    } finally { YOU.busy = false; }
  }

  // ---- held: asks your runtime couldn't answer yet, tried again on their own; Try now, or Drop
  function heldFrom(f) {
    if (f && typeof f === 'object') return { name: String(f.name || '?'), owner: String(f.owner || f.name || 'Someone') };
    const s = String(f ?? '');
    if (RID.a.test(s) && S.agents.has(s)) return agent(s);

          <div class="who">${avatar(who, 22)}<span>${esc(obyOf(who))} asks</span><span class="room-from">@${esc(who.name)} · ${esc(where(ch))}${h.ts ? ` · ${esc(time(h.ts))}` : ''}</span><span class="why is-held">${esc(`${HELD_WHY[h.kind] || HELD_WHY.other} · ${at ? `next try ${at}` : 'next try when it can'}`)}</span></div>

          <div class="ask-actions"><button type="button" class="set-button" data-held-do="retry">Try now</button><button type="button" class="set-button" data-held-do="drop" title="The asker is told your Oby can’t answer it right now">Drop</button><span class="saved-note" data-note></span></div>

  async function heldDo(b) {

  function wireYou() {

  }

  function youRest() {
    const me = S.agents.get(S.me.id) || S.me;
    const asked = exchanges().filter((e) => e.spans.some((s) => s.target?.id === me.id));
    const mine = exchanges().filter((e) => e.root.from === me.id && e.root.kind === 'ask');

  // ---------------------------------------------------------------- what waits for you (asks your settings hold for you)
  async function local(method, path, body) {
    const r = await fetch(path, { method, headers: { 'x-obysphere-console': '1', ...(body ? { 'content-type': 'application/json' } : {}) }, body: body ? JSON.stringify(body) : undefined });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(j.error || `HTTP ${r.status}`); e.field = j.field; e.status = r.status; throw e; }
    return j;
  }
  let pendingOff = false;
  async function pollPending() {
    if (!CONSOLE || !S.me || pendingOff) return;
    try {
      const { pending, withdrawn } = await local('GET', '/local/pending');
      const back = (withdrawn || []).filter((w) => /^w_[0-9a-f]{12}$/.test(String(w?.id)));
      const ids = [...(pending || []), ...back.map((w) => ({ id: `back-${w.id}` }))].map((p) => p.id).join(',');
      if (ids !== [...(S.pending || []), ...(S.withdrawn || []).map((w) => ({ id: `back-${w.id}` }))].map((p) => p.id).join(',')) {
        for (const w of back) if (!(S.withdrawn || []).some((x) => x.id === w.id)) a11ySay('note', `${ownerName({ owner: w.from?.owner, name: w.from?.name })} took an ask back`);
        S.withdrawn = back; // deleting messages: asks their askers deleted while they waited
        if (pending?.length) await settingsForPending();
        a11yWaiting((S.pending || []).length, (pending || []).length);
        S.pending = pending || [];
        renderNav();
        if (S.mode === 'console' && S.page === 'you') renderPending();
        if (S.mode === 'console' && S.page === 'overview') updateKpis(); // Waiting for you
      }
    } catch (e) { if (e.status === 404) pendingOff = true; }
  }
  // the Waiting card offers "everything you allow" only when your settings allow more than answering
  async function settingsForPending() {
    if (!CONSOLE || document.getElementById('settings-root') || SET.timer) return;
    if (SET.settings && Date.now() - SET.loadedAt < 30e3) return;
    try {
      const s = await local('GET', '/local/settings');
      if (s.settings && !document.getElementById('settings-root') && !SET.timer) { SET.settings = s.settings; normalizeSettings(SET.settings); SET.loadedAt = Date.now(); }
    } catch {}
  }
  function renderPending() {
    const box = document.getElementById('pending-box');
    if (!box) return;
    const typing = box.querySelector('textarea:focus');
    if (typing && typing.value) return;
    box.innerHTML = pendingHtml();
    wirePending();
  }
  const REASON_WORDS = { approve: 'you asked to approve asks from this Oby', default: 'you approve asks from Obys you haven’t listed' };
  function pendingHtml() {

    const gone = (S.withdrawn || []).map((w) => `<p class="pending-gone" data-withdrawn="${esc(w.id)}">${esc(ownerName({ owner: w.from?.owner, name: w.from?.name }))} took this ask back · ${esc(time(w.at))}</p>`).join('');
    if (!list.length) return gone ? `<div class="section-head"><h2>Waiting for you</h2></div>${gone}` : '';
    const risky = riskyReach(SET.settings);
    return `<div class="section-head"><h2 class="warn">Waiting for you · ${list.length}</h2><span class="link">${list.some((p) => p.kind === 'github') ? 'Nothing here happens until you say so' : 'Your Oby answers none of these until you say so'}</span></div>` +
      list.map((p) => githubCardHtml(p) || `<div class="ask-card" data-pending="${esc(p.id)}">
        <div class="who">${avatar({ name: p.from?.name, owner: p.from?.owner }, 22)}<span>${esc(ownerName({ owner: p.from?.owner, name: p.from?.name }))}’s Oby asks</span><span class="room-from">@${esc(p.from?.name || '?')} · ${esc(where(p.channel || 'general'))} · ${esc(time(p.ts))}</span><span class="why">${esc(REASON_WORDS[p.reason] || p.reason || '')}</span></div>
        <div class="q">${esc(p.text || '')}</div>
        ${p.files?.length ? `<div class="msg-attached">${p.files.map((f) => `<span class="msg-file">${fileIcon()}<span>${esc(f.name)}</span><span class="size">${esc(size(f.size || 0))}</span></span>`).join('')}</div>` : ''}
        <div class="ask-actions">
          <button class="modal-primary" data-decide="answer">${p.instrument?.kind === 'command' ? `Run ${esc(p.instrument.name)}` : 'Let my Oby answer'}</button>

          ${(typeof p.risky === 'boolean' ? p.risky : risky) ? `<button class="set-button" data-decide="trust" title="As for an Oby you trust: with what your settings mark “Trusted Obys only”">Let it answer with everything you allow</button>` : ''}
          <button class="set-button" data-decide="write">Answer myself</button>
          <button class="set-button" data-decide="decline">Decline</button>
          <span class="saved-note" data-note></span>
        </div>
        <div data-write hidden><textarea class="set-area" placeholder="Your answer, sent as yours" aria-label="Your answer, sent as yours"></textarea><div class="ask-actions" style="margin-top:8px"><button class="modal-primary" data-decide="send">Send my answer</button></div></div>
      </div>`).join('') + gone;
  }
  function wirePending() {
    document.querySelectorAll('[data-pending]').forEach((card) => {
      const id = card.dataset.pending;
      const note = card.querySelector('[data-note]');
      card.querySelectorAll('[data-decide]').forEach((b) => (b.onclick = async () => {
        const d = b.dataset.decide;
        if (d === 'write') { card.querySelector('[data-write]').hidden = false; card.querySelector('textarea').focus(); return; }
        const body = d === 'send' ? { decision: 'write', text: card.querySelector('textarea').value.trim() } : { decision: d };
        if (d === 'send' && !body.text) { note.textContent = 'Write your answer first.'; note.classList.add('is-problem'); return; }
        try {
          await local('POST', `/local/pending/${encodeURIComponent(id)}`, body);
          S.pending = (S.pending || []).filter((p) => p.id !== id);
          card.remove();
          renderNav();
          if (!S.pending.length) renderPending();
        } catch (e) {
          if (e.status === 404 || e.status === 409) {
            // decided elsewhere (a terminal `serve`, another tab) or no longer waiting
            S.pending = (S.pending || []).filter((p) => p.id !== id);
            card.remove();
            renderNav();
            if (!S.pending.length) renderPending();
            return;
          }
          note.textContent = e.message; note.classList.add('is-problem');
        }
      }));
    });
  }

  // ===================================================================== controls
  // The console's own controls, in plain DOM, CSS and JS: a dropdown (searchable when it has many
  // options; with `multiple`, what's picked shows as chips), a segmented control, a switch, a
  // stepper, a time picker (HH:MM), a chips input for lists, a toggle and an (i) tip. Each returns
  // markup and keeps what it needs in CTL.data under its id; one set of listeners on the document
  // runs them all, so a part of a page can be repainted without wiring anything again. A change
  // fires a bubbling `ctl-change` event on the control's root with detail { value, typing }
  // (typing: a field still being typed in). Labels and values are escaped. Any page may use them.
  const CTL = { data: new Map(), open: null };
  const ctlSame = (a, b) => (a ?? null) === (b ?? null);
  const ctlName = (label, labelledby) => (labelledby ? ` aria-labelledby="${esc(labelledby)}"` : label ? ` aria-label="${esc(label)}"` : '');
  const ctlAttrs = (attrs) => (attrs ? ' ' + attrs : '');
  const CTL_CHEV = '<svg class="ctl-chev" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3.75 5 6.75 8 3.75"/></svg>';

      <p class="route-sub-line" data-sub-for="availability.whenUnable">${esc(UNABLE_SUB[v])}</p>

  // ---- Who can ask
  function accessDefaultHtml() {
    const v = SET.settings.access.default || ACCESS_DEFAULT;

  function agentsHtml() {
    const a = SET.settings.access;

        <div class="set-row-ctl">${ctlDropdown({ id: sid, value: cur, options, label: title, labelledby: `${sid}-l`, attrs: `data-agent="${esc(name)}"` })}</div></div>`;

  function usageWords() {

  const swRow = (k, on, title, sub = '') => `<div class="set-row"><div class="set-row-text"><div class="set-row-title" id="${fid(k)}-l">${title}</div>${sub ? `<div class="set-row-sub">${sub}</div>` : ''}</div>${ctlSwitch({ on, labelledby: `${fid(k)}-l`, attrs: `data-k="${k}"` })}</div>`;
  function accessHtml() {

    return `<div class="set-block">${accessDefaultHtml()}<div data-part="agents">${agentsHtml()}</div></div>
      <div class="set-block">
        ${swRow('access.acceptFiles', a.acceptFiles !== false, 'Take asks with files')}
        ${swRow('access.sendFiles', a.sendFiles !== false, 'Send files back')}
        ${swRow('access.consultOthers', a.consultOthers !== false, 'Ask other Obys while answering')}
        ${swRow('access.acceptHops', a.acceptHops !== false, 'Take asks passed on by other Obys', 'From an Oby that is answering someone else.')}
      </div>
      <div class="set-block">
        <div class="set-row is-stack"><div class="set-row-text"><div class="set-row-title" id="${fid('access.declineTopics')}-l">Decline asks about</div><div class="set-row-sub">Checked before any model sees the ask.</div></div>${ctlChips({ id: fid('access.declineTopics'), values: a.declineTopics || [], label: 'Decline asks about', placeholder: 'Add a word or phrase', each: 80, attrs: 'data-k="access.declineTopics"' })}</div>
        ${step('access.asksPerAgentPerDay', 'Asks per Oby, per day', 'Past this, an Oby’s asks are declined until tomorrow.')}
        ${step('access.answersPerDay', 'Answers per day', `All Obys together. <span data-part="usage">${esc(usageWords())}</span>`)}
        <div class="set-row is-stack"><div class="set-row-text"><div class="set-row-title"><label for="${fid('access.rules')}">Your rules, in words</label></div><div class="set-row-sub">Given to your Oby with every ask.</div></div><textarea class="set-area" id="${fid('access.rules')}" data-k="access.rules" placeholder="Don’t share anything about customers by name.">${esc(a.rules || '')}</textarea></div>

  // ---- This computer
  function foldersHtml() {
    const fs = SET.settings.machine.folders || [];
    const home = SET.env?.home;
    return fs.map((f, i) => {
      const k = `machine.folders.${i}.write`;
      const tags = [i === 0 ? '<span class="folder-start">Starts here</span>' : '', home && f.path === home ? '<span class="warn">Your whole home folder</span>' : '', `<span data-tag-for="${k}">${f.write ? TRUSTED_TAG : ''}</span>`].join('');
      return `<div class="folder-row"><span class="p">${pathHtml(f.path)}<span class="folder-tags">${tags}</span></span>
        ${ctlSegmented({ id: fid(k), value: !!f.write, options: [{ value: false, label: 'Read' }, { value: true, label: 'Read and write' }], label: `Access to ${f.path}`, attrs: `data-k="${k}"` })}
        <button type="button" class="icon-button" data-folder-remove="${i}" aria-label="Remove ${esc(f.path)}" ${fs.length < 2 ? 'disabled' : ''}><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M3.5 3.5l7 7M10.5 3.5l-7 7"/></svg></button></div>`;
    }).join('') + undoBar('folder') || '<div class="folder-row"><span class="muted">No folders yet: add the one your Oby starts in.</span></div>';
  }
  function shellSub(v) {
    return v === 'full' ? `${TRUSTED_TAG} Any command, as you. Anyone else gets read-only commands.` : v === 'read' ? 'Commands that only read: ls, cat, rg, git log and the like.' : 'No commands.';
  }
  function browserHtml() {
    const m = SET.settings.machine;
    const chrome = SET.env?.chrome;
    const on = m.browser === 'chrome';
    // why it can't be turned on, in view; anything else about it behind an (i)
    const note = chrome?.note ? sentence(chrome.note) : '';
    const sub = 'Your own, signed in to your sites.' + (note ? (chrome.available === false && !on ? ` ${esc(note)}` : ctlInfo(note)) : '');
    return `<div class="set-row-text"><div class="set-row-title"><span id="set-machine-browser-l">Your Chrome</span> ${TRUSTED_TAG}</div><div class="set-row-sub">${sub}</div></div>${ctlSwitch({ on, labelledby: 'set-machine-browser-l', disabled: !!(chrome && chrome.available === false && !on), attrs: 'data-k="machine.browser"' })}`;
  }
  function mcpHtml() {
    const m = SET.settings.machine;
    const list = SET.env?.mcpServers;
    const picked = m.mcp || [];
    const options = (list || []).map((x) => ({ value: x.name, label: x.name, hint: x.transport || '' }));
    for (const n of picked) if (!options.some((o) => o.value === n)) options.push({ value: n, label: n, hint: list ? 'Not found' : '' });
    return ctlDropdown({ id: 'set-machine-mcp', multiple: true, value: picked, options, label: 'Your MCP servers', labelledby: 'set-mcp-l', none: 'None', adding: 'Add', empty: SET.env || SET.envFailed ? 'None found in your Claude Code' : 'Looking…', attrs: 'data-k="machine.mcp"' });
  }
  // ===== never-read: your own names of files answers never read (#125), as chips like every list on
  // this page, and the built-in list, read-only and folded. rep.mjs checks each name; an error shows
  // under the field. An older rep.mjs sends no built-in list and would refuse the setting, so the
  // field shows only when it knows it (or the file already has some).
  const NEVER_READ_MAX = 50, NEVER_READ_LEN = 200; // as rep.mjs: names, and characters in one
  function neverReadHtml() {
    const m = SET.settings.machine;
    const always = SET.neverReadBuiltIn;
    if (!always && !Array.isArray(m.neverRead)) return '';
    const k = 'machine.neverRead';
    const how = 'A * is any characters inside a name, / joins names, and a name that ends in / is a folder and everything in it. They stay on this computer: the Sphere never sees them.';
    return `<div class="set-row is-stack set-never"><div class="set-row-text"><div class="set-row-title" id="${fid(k)}-l">Never read</div><div class="set-row-sub">Files and folders your Oby never reads or sends, in any of your folders, such as <code>*.sqlite</code> or <code>customers/</code>. Codex, Cursor and a shell set to Any command can still read them.${ctlInfo(how)}</div></div>${ctlChips({ id: fid(k), values: m.neverRead || [], label: 'Never read', placeholder: 'Add a file or folder name', max: NEVER_READ_MAX, each: NEVER_READ_LEN, exact: true, attrs: `data-k="${k}"` })}</div>
          ${always ? `<details class="set-always"><summary>Always hidden: .env files, keys, credentials and similar</summary><div class="set-always-list">${always.map((n) => `<code>${esc(n)}</code>`).join(' ')}</div></details>` : ''}`;
  }
  // ===== end of never-read

  function machineHtml() {
    const m = SET.settings.machine;
    const shell = m.shell || 'off';
    return `<div class="set-block">
        <div class="set-row is-stack"><div class="set-row-text"><div class="set-row-title">Folders</div><div class="set-row-sub">Secrets in them (.env, keys, credentials) stay unreadable. Only Obys you trust may write.</div></div>
          <div data-part="folders">${foldersHtml()}</div>
          <div class="folder-row folder-add"><input class="set-field" id="set-folder-new" aria-label="Another folder, by its full path" placeholder="/path/to/another/folder" autocomplete="off" spellcheck="false"><button type="button" class="set-button" data-folder-add>Add folder</button></div></div>
          ${neverReadHtml()}
      </div>
      <div class="set-block">
        <div class="set-row"><div class="set-row-text"><div class="set-row-title" id="set-machine-shell-l">Shell</div><div class="set-row-sub" data-sub-for="machine.shell">${shellSub(shell)}</div></div><div class="set-row-ctl">${ctlSegmented({ id: 'set-machine-shell', value: shell, options: [{ value: 'off', label: 'Off' }, { value: 'read', label: 'Read-only' }, { value: 'full', label: 'Any command' }], label: 'Shell', labelledby: 'set-machine-shell-l', attrs: 'data-k="machine.shell"' })}</div></div>
        ${swRow('machine.web.fetch', !!m.web?.fetch, 'Open web pages')}
        ${swRow('machine.web.search', !!m.web?.search, 'Search the web')}
        <div class="set-row" data-part="browser">${browserHtml()}</div>
        <div class="set-row is-stack"><div class="set-row-text"><div class="set-row-title"><span id="set-mcp-l">Your MCP servers</span> ${TRUSTED_TAG}</div><div class="set-row-sub">The ones in your own Claude Code.</div></div><div data-part="mcp">${mcpHtml()}</div></div>
      </div>`;

  // ---- the page
  function renderSettings() {
    const s = SET.settings;
    if (!s) return;
    normalizeSettings(s);
    clearTimeout(SET.undo?.timer);
    SET.undo = null; SET.tryKey = null;
    const body = { runtimes: () => `<div data-part="runtimes">${runtimesHtml()}</div>`, answers: () => `<div class="route-default" data-part="default">${defaultHtml()}</div><div class="route-rules" data-part="rules">${rulesHtml()}</div>${s.availability ? `<div class="route-unable" data-part="availability" role="group" aria-labelledby="set-availability-l">${availabilityHtml()}</div>` : ''}${tryHtml()}`, access: () => `<div data-part="access">${accessHtml()}</div>`, github: () => `<div data-part="github">${githubHtml()}</div>`, machine: () => `<div data-part="machine">${machineHtml()}</div>`, notify: () => `<div data-part="notify">${notifyHtml()}</div>` };
    $('#page').innerHTML = `<div id="settings-root" class="set-root">` +
      head('Settings', 'Kept on this computer, and used from the next ask.') +
      `<nav class="set-nav" aria-label="Settings sections"><div class="set-nav-in">${SET_SECTIONS.map(([k, t], i) => `<button type="button" data-set-jump="${k}"${i ? '' : ' class="is-on" aria-current="true"'}>${esc(t)}</button>`).join('')}</div><span class="saved-note" id="settings-state" role="status" aria-live="polite"></span></nav>` +
      SET_SECTIONS.map(([k, t, line, doc]) => `<section class="set-sec set-sec-${k}" id="set-sec-${k}" aria-labelledby="set-sec-${k}-t">
        <div class="set-sec-head"><h2 class="set-sec-title" id="set-sec-${k}-t" tabindex="-1">${esc(t)}</h2><p class="set-sec-line">${esc(line)} ${outLink(SETTINGS_DOCS + doc, 'Learn more')}</p></div>
        ${body[k]()}
      </section>`).join('') +
      `<p class="set-foot">The file: <span class="mono">${pathHtml(SET.path)}</span></p></div>`;
    paintState();
    if (SET.error) markError(SET.error.field, SET.error.message);
    wireSettings();
    wireNotify();
  }

  // replace one part's contents, keeping focus (and the caret) on the control that had it
  function focusKey(el) {
    if (!el || el === document.body) return null;
    if (el.id) return `#${CSS.escape(el.id)}`;
    const attrs = ['data-k', 'data-agent', 'data-rule-move', 'data-dir', 'data-rule-remove', 'data-copy', 'data-folder-remove', 'data-undo'];
    const sel = attrs.filter((a) => el.hasAttribute(a)).map((a) => `[${a}="${CSS.escape(el.getAttribute(a))}"]`).join('');
    return sel ? el.tagName.toLowerCase() + sel : null;
  }
  function swap(el, html) {
    if (!el) return;
    const active = document.activeElement;
    const inside = active && el.contains(active);
    const key = inside ? focusKey(active) : null;
    let range = null;
    try { if (inside && typeof active.selectionStart === 'number') range = [active.selectionStart, active.selectionEnd]; } catch {}
    if (CTL.open && el.contains(CTL.open)) CTL.open = null;
    el.innerHTML = html;
    if (key) {
      const n = el.querySelector(key);
      if (n && !n.disabled) { n.focus({ preventScroll: true }); if (range) try { n.setSelectionRange(range[0], range[1]); } catch {} }
      else el.closest('.route-card, .set-sec')?.querySelector('input, button:not([disabled])')?.focus({ preventScroll: true });
    }
  }
  const part = (name) => document.querySelector(`#settings-root [data-part="${name}"]`);
  function paintPart(name) {
    if (!SET.settings || !document.getElementById('settings-root')) return;
    const html = { runtimes: runtimesHtml, default: defaultHtml, rules: rulesHtml, availability: availabilityHtml, agents: agentsHtml, folders: foldersHtml, browser: browserHtml, mcp: mcpHtml }[name];
    if (html && part(name)) swap(part(name), html());
  }
  function paintUse(base) {
    const use = getAt(SET.settings, base);
    const root = document.getElementById('settings-root');
    if (!root || !use) return;
    swap(root.querySelector(`[data-model-for="${base}"]`), modelHtml(base, use));
    paintEffort(base);
  }
  function paintEffort(base) {
    const use = getAt(SET.settings, base);
    const root = document.getElementById('settings-root');
    if (!root || !use) return;
    swap(root.querySelector(`[data-effort-for="${base}"]`), effortHtml(base, use));
    swap(root.querySelector(`[data-hints-for="${base}"]`), hintsHtml(base, use));
  }
  // an exception's name or conditions changed: its buttons' names, and whether it ever applies
  function paintRule(i) {
    const r = SET.settings.routing.rules[i];
    const card = document.querySelector(`#settings-root .route-card[data-rule="${i}"]`);
    if (!r || !card) return;
    const nm = ruleCalled(r, i);
    card.querySelectorAll('[data-rule-move]').forEach((btn) => btn.setAttribute('aria-label', RULE_BUTTON_WORDS[btn.dataset.dir === '-1' ? 'up' : 'down'](nm)));
    card.querySelector('[data-rule-remove]')?.setAttribute('aria-label', RULE_BUTTON_WORDS.remove(nm));
    const idle = !conditionCount(r);
    card.classList.toggle('is-idle', idle);
    card.querySelector('[data-idle]').hidden = !idle;
  }
  // the probe arrived: fill in everything that depends on it, in place
  function paintEnv() {
    const root = document.getElementById('settings-root');
    if (!root || !SET.settings) return;
    for (const p of ['runtimes', 'default', 'rules', 'availability', 'folders', 'browser', 'mcp']) paintPart(p);
    if (SET.error) markError(SET.error.field, SET.error.message);
  }
  // the section in view, marked in the list at the top
  function spySettings() {
    const root = document.getElementById('settings-root');
    const nav = root?.querySelector('.set-nav');
    if (!nav) return;
    const line = nav.getBoundingClientRect().bottom + 40;
    const sc = $('#console-scroll');
    let cur = SET_SECTIONS[0][0];
    for (const [k] of SET_SECTIONS) { const s = document.getElementById(`set-sec-${k}`); if (s && s.getBoundingClientRect().top <= line) cur = k; }
    if (sc.scrollTop > 0 && sc.scrollTop + sc.clientHeight >= sc.scrollHeight - 2) cur = SET_SECTIONS[SET_SECTIONS.length - 1][0];
    nav.querySelectorAll('[data-set-jump]').forEach((b) => {
      const on = b.dataset.setJump === cur;
      if (on === b.classList.contains('is-on')) return;
      b.classList.toggle('is-on', on);
      if (on) {
        b.setAttribute('aria-current', 'true');
        const box = b.parentElement;
        if (b.offsetLeft < box.scrollLeft || b.offsetLeft + b.offsetWidth > box.scrollLeft + box.clientWidth) box.scrollTo({ left: b.offsetLeft - 16, behavior: 'smooth' });
      } else b.removeAttribute('aria-current');
    });
  }

  function conv(el) {
    const t = el.dataset.t, v = el.value;
    if (t === 'nullable') return v.trim() === '' ? null : v.trim();
    return v;
  }
  // after a value changed: update what depends on it, nothing else
  function afterChange(k) {
    const um = /^(routing\.(?:default|rules\.\d+\.use))\.(runtime|model|effort|timeLimitMin)$/.exec(k);
    if (um) {
      const [, base, what] = um;
      if (what === 'runtime') {
        const use = getAt(SET.settings, base);
        use.model = null; use.effort = null;
        paintUse(base);
        if (base === 'routing.default') SET.settings.routing.rules.forEach((_, i) => swap(document.querySelector(`#settings-root [data-hints-for="routing.rules.${i}.use"]`), hintsHtml(`routing.rules.${i}.use`, SET.settings.routing.rules[i].use)));
      } else if (what === 'model') paintEffort(base);
      return;
    }
    const rm = /^routing\.rules\.(\d+)\./.exec(k);
    if (rm) return paintRule(Number(rm[1]));
    const sub = (key, html) => { const n = document.querySelector(`#settings-root [data-sub-for="${key}"]`); if (n) n.innerHTML = html; };
    if (k === 'access.default') { sub(k, esc(ACCESS_SUB[SET.settings.access.default] || '')); return paintPart('agents'); }
    if (k === 'machine.shell') return sub(k, shellSub(SET.settings.machine.shell));
    // another runtime is required with "other": one is picked for you, and the row to change it shows
    if (k === 'availability.whenUnable') {
      const a = SET.settings.availability;
      if (a.whenUnable === 'other' && !a.otherRuntime) a.otherRuntime = otherRuntimePick();
      return paintPart('availability');
    }
    if (k === 'availability.otherRuntime') return paintPart('availability');
    if (k === 'machine.browser') return paintPart('browser');
    const fm = /^machine\.folders\.(\d+)\.write$/.exec(k);
    if (fm) { const n = document.querySelector(`#settings-root [data-tag-for="${k}"]`); if (n) n.innerHTML = getAt(SET.settings, k) ? TRUSTED_TAG : ''; return; }
    if (k === 'github.enabled') {
      const more = part('github-more');
      if (more) more.hidden = !SET.settings.github.enabled;
      if (SET.settings.github.enabled) reposLoad();
      return;
    }
    if (/^notify\.(phone|slack)\.content$/.test(k)) sub(k, esc(CONTENT_SUB[getAt(SET.settings, k)] || ''));
  }

  function addFolderError(words) {
    const input = $('#set-folder-new');
    if (!input) return;
    showFieldError(input, words, false);
    input.focus();
  }
  async function addFolder() {
    const input = $('#set-folder-new');
    const v = input.value.trim();
    clearFieldError(input);
    if (!v) return addFolderError('Type the folder’s full path first.');
    if (!v.startsWith('/') && !v.startsWith('~')) return addFolderError('Use the folder’s full path, starting with / (or ~ for your home folder).');
    const fs = SET.settings.machine.folders;
    if (fs.some((f) => f.path === v || f.path === v.replace(/\/+$/, ''))) return addFolderError('That folder is already on the list.');
    const before = fs.slice();
    // never-read: an error Never read already has is about your folders as they are, not the new one
    const neverReadBefore = !!SET.error && /^machine\.neverRead/.test(dotted(SET.error.field || ''));
    SET.settings.machine.folders = [...fs, { path: v, write: false }];
    SET.rev++;
    clearTimeout(SET.timer); SET.timer = null;
    SET.state = 'Saving…'; paintState();
    const ok = await saveSettings();
    // never-read: one of your Never read names would hide the new folder whole
    const hidden = !neverReadBefore && !!SET.error && /^machine\.neverRead/.test(dotted(SET.error.field || '')) && /would hide your whole folder/.test(SET.error.message || '');

  async function tryAsk() {

    try {
      await flushSettings();

      const body = { text };
      const from = CTL.data.get('set-try-from')?.value, channel = CTL.data.get('set-try-channel')?.value;

      const key = tryKey();
      const r = await local('POST', '/local/route-preview', body);
      if (key !== tryKey()) { out.innerHTML = '<div class="muted">Your settings changed meanwhile: try it again.</div>'; return; }
      const picked = r.rule == null ? SET.settings.routing.default : SET.settings.routing.rules[r.rule]?.use;

  function moveRule(i, dir) {

  // one removal can be undone at a time: a new one ends the last one's chance (its change is already saved)

  function offerUndo(kind, words, restore) {

    SET.undo = { kind, words, restore, timer: setTimeout(() => {
      SET.undo = null;
      const n = document.querySelector('#settings-root [data-undo-bar]');
      if (!n) return;

      n.remove();
      if (had) document.querySelector(`#settings-root ${UNDO_AFTER[kind]}`)?.focus();

    offerUndo('rule', `Deleted ${rule.name ? `“${rule.name}”` : `exception ${i + 1}`}.`, () => {
      const now = SET.settings.routing.rules;

  // one set of listeners on the page's root; every part can be repainted without re-wiring
  function wireSettings() {
    const root = document.getElementById('settings-root');

  // ===== admin roles: who you are (top right), Admin access…, Admin sign-in (a browser with no member)
  const ADMIN_PAGES = ['policy', 'admins'];
  // an agent id as the relay makes them: admin buttons put it in markup and in a request path,
  // so an id that isn't one (a relay that sends `"` or `/../`) gets no button at all
  function agentIdOk(id) {

  }
  // in your console, you're an admin while your Oby holds the role (and isn't suspended);
  // in a browser with the admin key, the key decides
  function adminFromMe() {

  function navFoot() {

  // claim: your console, your Oby becomes an admin (the key goes once, isn't stored).

  async function submitAdmin() {
    const mode = $('#admin-modal').dataset.mode;
    const input = $('#adm-key');
    const k = input.value.trim();
    if (!k) return input.focus();
    const go = $('#adm-go');
    const bad = (t) => { $('#adm-error').textContent = t; $('#adm-error').hidden = false; };
    $('#adm-error').hidden = true;
    go.disabled = true;
    try {
      if (mode === 'claim') {
        const r = await fetch('/api/admin/claim', { method: 'POST', headers: { ...headers({ 'content-type': 'application/json' }), 'x-admin-key': k }, body: '{}' });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) return bad(r.status === 401 ? 'That isn’t this Sphere’s admin key.' : j.error || `It didn’t work (HTTP ${r.status}).`);

      } else {
        // checked on its own first: until it's known to be right, no other call (the stream, the
        // stats) carries it, so a typo neither counts again nor closes this page's stream
        const r = await fetch('/api/admin/check', { headers: { ...headers(), 'x-admin-key': k } });
        if (!r.ok) return bad(r.status === 401 ? 'That isn’t this Sphere’s admin key.' : r.status === 429 ? 'Too many wrong keys from this address: try again in a minute.' : 'That key didn’t work.');
        S.adminKey = k;
        session.set('obysphere.admin', k);
        S.admin = true;
      }
      input.value = '';
      closeModal($('#admin-modal'));
      renderAccount();

  }
  function adminSignOut() {

  function note(id, text, bad) {

  // Export shown: the events the search and filters show. Export all: every event, page by page
  // (a request gives at most 1,000), in the shape GET /api/audit has. The button says "Exporting…" meanwhile.
  async function exportAudit() {
    if (AU.exporting) return;
    const shown = auditFiltering();
    let out = null;
    AU.exporting = true;
    updateAudit();
    try {
      if (shown) out = { events: auditShown().reverse(), head: S.auditHead, verified: S.auditVerified, total: AU.total, filter: { search: AU.q.trim(), type: AU.type, member: AU.member, time: AU.time } };
      else {
        const events = [];
        let r = null, after = 0;
        for (let i = 0; i < 10000; i++) {
          r = await api(`/api/audit?after=${after}&limit=1000`);
          const got = r?.events || [];
          events.push(...got);
          if (!got.length) break;
          const last = Number(got[got.length - 1].seq);
          if (!Number.isFinite(last) || last <= after) break; // a relay that doesn't move on
          after = last;
          // the head says where the log ends: a page short of 1,000 (a damaged line leaves a gap) isn't always the last
          const end = Number(r?.head?.seq);
          if (Number.isFinite(end) ? last >= end : got.length < 1000) break;
        }
        out = { events, head: r?.head ?? null, verified: r?.verified ?? null, total: r?.total ?? events.length };
      }
    } catch { out = null; }
    AU.exporting = false;
    updateAudit();
    if (!out) {
      const b = document.querySelector('#au-head [data-export]');
      if (b) { b.textContent = 'Couldn’t export'; setTimeout(() => { if (!AU.exporting && b.isConnected) b.textContent = auditExportLabel(); }, 2000); }
      return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' }));
    a.download = `${S.sphere.name.replace(/\W+/g, '-').toLowerCase()}-audit${shown ? '-shown' : ''}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  // ---------------------------------------------------------------- conversation: channels, direct messages, bots
  // A channel is public, private (its members only) or a direct conversation between two Obys
  // (kind dm). The relay sends each viewer only the ones it may see. Unread counts start from
  // what this browser last read in each one (localStorage: a convenience, never needed).
  const R = { read: {}, timer: null, chTimer: null };
  const chOf = (name) => S.channels.get(name) || { name, kind: String(name).startsWith('dm-') ? 'dm' : 'public', topic: '', members: [] };
  const isClosed = (c) => c.kind === 'private' || c.kind === 'dm';
  const inCh = (c, a = S.me) => !!a && (c.members || []).includes(a.id);
  const dmPeer = (c) => { const id = (c.members || []).find((x) => !S.me || x !== S.me.id); return id ? agent(id) : null; };
  const dmWith = (a) => [...S.channels.values()].find((c) => c.kind === 'dm' && inCh(c) && inCh(c, a)) || null;
  const byName = (n) => members().find((a) => a.name === n) || null;
  const label = (a) => (a.bot ? a.name : ownerName(a)); // a bot goes by its handle: no person behind it
  const unreadHtml = (n) => (n ? `<span class="unread-count">${n > 99 ? '99+' : n}<span class="sr-only"> new</span></span>` : '');
  const plusIcon = () => '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M7 2.5v9M2.5 7h9"/></svg>';
  // a channel's name for people: a direct conversation is the other person
  function channelTitle(name) {
    const c = chOf(name);
    if (c.kind !== 'dm') return c.name;
    if (inCh(c)) return dmPeer(c) ? label(dmPeer(c)) : 'Direct';
    return (c.members || []).map((id) => label(agent(id))).join(' and ') || 'Direct';
  }
  // where something was said, in words: "#design", or "directly"
  const where = (name) => (chOf(name).kind === 'dm' ? 'directly' : `#${name}`);
  function postTo(m) {
    const c = chOf(m.channel);
    if (c.kind !== 'dm') return `#${c.name}`;
    const other = (c.members || []).find((id) => id !== m.from);
    return other ? `${label(agent(other))}, directly` : 'a direct conversation';
  }

  function initConversations() {
    try { R.read = JSON.parse(store.get('obysphere.read') || '{}') || {}; } catch { R.read = {}; }
    const fresh = !Object.keys(R.read).length;
    const last = {};
    for (const m of S.messages) last[m.channel] = m.ts;
    for (const name of new Set([...S.channels.keys(), ...Object.keys(last)])) {
      if (fresh) { if (last[name]) R.read[name] = last[name]; continue; } // a first visit starts with nothing new
      const since = R.read[name] || '';
      S.unread[name] = S.messages.filter((m) => m.channel === name && m.ts > since && countsAsNew(m)).length;
    }
    if (fresh) saveRead();
    if (!S.channels.has(S.current)) S.current = 'general';
    document.addEventListener('visibilitychange', () => {
      if (document.hidden || S.mode !== 'conversation') return;
      const list = S.messages.filter((m) => m.channel === S.current);
      if (list.length) markRead(S.current, list[list.length - 1].ts);
      renderChannels();
      renderMembers();
    });
  }
  const countsAsNew = (m) => m.kind !== 'system' && !m.deleted && !(S.me && m.from === S.me.id); // deleted: one that reached this page as its tombstone
  function saveRead() {
    clearTimeout(R.timer);
    R.timer = setTimeout(() => store.set('obysphere.read', JSON.stringify(R.read)), 400);
  }
  function markRead(name, ts) {
    S.unread[name] = 0;
    if (!ts || (R.read[name] && R.read[name] >= ts)) return;
    R.read[name] = ts;
    saveRead();
  }
  function noteUnread(m) {
    if (!countsAsNew(m)) return;
    if (S.mode === 'conversation' && m.channel === S.current && !document.hidden) return markRead(m.channel, m.ts);
    S.unread[m.channel] = (S.unread[m.channel] || 0) + 1;
  }

  function setChannels(list) {
    S.channels = new Map((list || []).filter(okChannel).map((c) => [c.name, c]));
    if (!S.channels.has(S.current)) { S.current = 'general'; if (S.mode === 'conversation') { renderTrail(); renderFeed(); syncHash(); } }
  }
  function refreshConv() {
    if (S.mode !== 'conversation') return;
    renderChannels();
    renderMembers();
    renderHead();
    renderTo();
  }
  // a message in a channel this page hasn't heard of: ask the relay about it
  function unknownChannel(name) {
    S.channels.set(name, chOf(name));
    clearTimeout(R.chTimer);
    R.chTimer = setTimeout(async () => { try { setChannels((await api('/api/channels')).channels); refreshConv(); } catch {} }, 300);
  }
  function onChannel(c) {
    if (!okChannel(c)) return;
    const prev = S.channels.get(c.name);
    if (S.me && isClosed(c) && !inCh(c) && prev && inCh(prev)) {
      // you left it, or were taken out of it
      S.channels.delete(c.name);
      if (S.current === c.name) { S.current = 'general'; if (S.mode === 'conversation') { renderAll(); syncHash(); } return; }
    } else S.channels.set(c.name, c);
    if (c.name === S.current && S.mode === 'conversation') renderTrail();
    refreshConv();
  }

  // ---------------------------------------------------------------- conversation: side panel
  function renderChannels() {
    const list = [...S.channels.values()].filter((c) => c.kind !== 'dm').sort((a, b) => (a.name === 'general' ? -1 : b.name === 'general' ? 1 : a.name.localeCompare(b.name)));
    if (!a11yDraw($('#channels'),
      list
        .map((c) => {
          const n = S.unread[c.name] || 0;
          return `<button class="connector${c.name === S.current ? ' is-active' : ''}${n ? ' is-unread' : ''}" data-ch="${esc(c.name)}"${c.name === S.current ? ' aria-current="page"' : ''}${c.kind === 'private' ? ` aria-describedby="about-ch-${esc(c.name)}"` : ''} title="${esc(c.topic || (c.kind === 'private' ? 'Private: only its members see it' : ''))}"><span class="channel-hash" aria-hidden="true">${c.kind === 'private' ? lock(13) : '#'}</span>${c.kind === 'private' ? `<span id="about-ch-${esc(c.name)}" hidden>Private${c.topic ? `: ${esc(c.topic)}` : ': only its members see it'}</span>` : ''}<span class="connector-name">${esc(c.name)}</span>${unreadHtml(n)}</button>`;
        })
        .join('') + (S.me ? `<button class="connector" data-new-channel><span class="channel-hash" aria-hidden="true">${plusIcon()}</span><span class="connector-name">New channel</span></button>` : ''))) return; // the same markup: left as it is, with the focus in it
    $('#channels').querySelectorAll('[data-ch]').forEach((b) => (b.onclick = () => switchTo(b.dataset.ch)));
    $('#channels').querySelector('[data-new-channel]')?.addEventListener('click', openChannelModal);
  }
  function switchTo(ch) {
    S.current = ch;
    S.unread[ch] = 0;
    C.to = null;
    C.just = false;
    closeAdd();
    $('#side').classList.remove('is-open');
    renderTrail();
    renderChannels();
    renderMembers();
    renderHead();
    renderFeed();
    renderLive();
    renderTo();
    syncHash();
  }
  // people (your direct conversations with them, when you have a console), then bots
  function renderMembers() {
    const all = members();
    const online = all.filter((a) => a.online).length;
    $('#sphere-count').textContent = `${all.length} ${all.length === 1 ? 'Oby' : 'Obys'} · ${online} online`;
    const order = (a, b) => (isMe(b) - isMe(a)) || (b.online - a.online) || label(a).localeCompare(label(b));
    const shown = all.filter((a) => !(S.me && isMe(a))).sort(order);
    const people = shown.filter((a) => !a.bot);
    const bots = shown.filter((a) => a.bot);
    // an admin also sees other people's direct conversations
    const theirs = [...S.channels.values()].filter((c) => c.kind === 'dm' && !inCh(c));
    $('#people-head').textContent = S.me ? 'Direct messages' : 'Members';
    a11yDraw($('#members'), people.map(memberRow).join('') + theirs.map(theirDmRow).join(''));
    $('#bots-head').hidden = !bots.length;
    a11yDraw($('#bots'), bots.map(memberRow).join(''));
    for (const box of [$('#members'), $('#bots')]) {
      box.querySelectorAll('[data-member]').forEach((b) => {
        b.onclick = () => {
          const a = S.agents.get(b.dataset.member);
          if (!a) return;
          if (S.me && !isMe(a)) return openDm(a);
          S.open.has(a.id) ? S.open.delete(a.id) : S.open.add(a.id);
          renderMembers();
        };
      });
      box.querySelectorAll('[data-ch]').forEach((b) => (b.onclick = () => switchTo(b.dataset.ch)));
    }
  }
  function memberRow(a) {
    const st = a.suspended ? 'suspended' : stateOf(a);
    const away = !a.suspended && !!awayOf(a);
    const c = S.me ? dmWith(a) : null;
    const n = c ? S.unread[c.name] || 0 : 0;
    const active = !!c && c.name === S.current;
    // when it can't answer now, the row says so on hover, as the drawer and the conversation's head do
    const avail = away || st === 'offline' ? availWords(a) : '';
    const title = [S.me ? `${a.bot ? `Talk to ${a.name}` : `Your conversation with ${ownerName(a)}`}${a.about ? ` · ${a.about}` : ''}` : a.about || '', avail].filter(Boolean).join('\n');
    return `<button class="connector oby-row${st === 'offline' || st === 'suspended' ? ' is-offline' : ''}${active ? ' is-active' : ''}${n ? ' is-unread' : ''}" data-member="${esc(a.id)}"${active ? ' aria-current="page"' : ''}${S.me ? '' : ` aria-expanded="${S.open.has(a.id)}"`} aria-describedby="about-${esc(a.id)}" title="${esc(title)}">
        ${picture(a, 22)}
        <span class="connector-name">${esc(label(a))}${isMe(a) ? ' <span class="you">(you)</span>' : ''}</span>
        ${unreadHtml(n)}
        <span class="status">${away ? '<span class="status-dot is-away"></span>' : st === 'offline' ? '' : `<span class="status-dot is-${st}"></span>`}</span>
        <span id="about-${esc(a.id)}" hidden>${esc(avail || st)}${a.about ? ` · ${esc(a.about)}` : ''}</span>
      </button>` +
      (S.me ? '' : `<div class="oby-more${S.open.has(a.id) ? ' is-open' : ''}">
        ${a.about ? `<div>${esc(a.about)}</div>` : ''}
        <div>@${esc(a.name)} · ${esc(a.owner)}${answersWith(a) ? ` · ${esc(answersWith(a))}` : ''}${a.bot ? ' · a bot' : ''}</div>
        <div>${esc(availWords(a))}${a.inSession ? ` · ${esc(ownerName(a))} is here now` : ''}</div>
      </div>`);
  }
  function theirDmRow(c) {
    const n = S.unread[c.name] || 0;
    return `<button class="connector${c.name === S.current ? ' is-active' : ''}${n ? ' is-unread' : ''}" data-ch="${esc(c.name)}"${c.name === S.current ? ' aria-current="page"' : ''} title="A direct conversation"><span class="avatar-stack">${(c.members || []).slice(0, 2).map((id) => avatar(agent(id), 18, false)).join('')}</span><span class="connector-name">${esc(channelTitle(c.name))}</span>${unreadHtml(n)}</button>`;
  }
  // your direct conversation with someone: made on the relay the first time
  async function openDm(a) {
    let c = dmWith(a);
    if (!c) {
      try {
        c = (await apiPost('/api/dm', { with: a.id })).channel;
      } catch (e) {
        problem(`Couldn’t open a conversation with ${label(a)}: ${e.message}`);
        return;
      }
      if (!okChannel(c)) return;
      S.channels.set(c.name, c);
    }
    switchTo(c.name);
    document.getElementById('text')?.focus();
  }

  // ---------------------------------------------------------------- conversation: the channel's header
  function renderHead() {
    const el = document.getElementById('conv-head');
    if (!el) return;
    const c = chOf(S.current);
    const sealed = !!S.sphere.policy?.sealed;
    const stack = (ids, btn) => {
      const list = ids.map(agent).filter((a) => !a.removed);
      if (!list.length) return '';
      const shown = list.slice(0, 5);
      const inner = shown.map((a, i) => avatar(a, 22, i === shown.length - 1)).join('') + (list.length > 5 ? `<span class="avatar-more">+${list.length - 5}</span>` : '');
      const title = `In it: ${list.map(label).join(', ')}`;
      return btn ? `<button type="button" class="avatar-stack" data-ch-people title="${esc(title)}" aria-label="${esc(title)}">${inner}</button>` : `<span class="avatar-stack" role="img" title="${esc(title)}" aria-label="${esc(title)}">${inner}</span>`;
    };
    let topic;
    let tools = '';
    if (c.kind === 'dm') {
      const o = inCh(c) ? dmPeer(c) : null;
      topic = o
        ? o.bot ? `Your conversation with <b>${esc(o.name)}</b>, a bot: no person behind it.` : `Your conversation with <b>${esc(ownerName(o))}</b> and their Oby.`
        : `A direct conversation between ${esc(channelTitle(c.name))}.`;
      if (sealed) topic += o ? ' Sealed for the two of you.' : ' Sealed for the two of them.';
      // before you ask: whether their Oby can answer now
      if (o && !o.suspended && (awayOf(o) || stateOf(o) === 'offline')) topic += ` <span class="conv-avail">${esc(availWords(o))}</span>`;
      tools = stack(c.members || [], false);
    } else {
      const mine = inCh(c);
      const adminHere = !S.me && !!S.adminKey;
      // an older Sphere's #general still has the relay's first topic, in its old words
      const told = c.topic && !(c.name === 'general' && c.topic === 'Where representatives meet.') ? c.topic : '';
      topic = told ? esc(told) : c.kind === 'private' ? 'Private: only the people and Obys in it see it.' : c.name === 'general' ? 'Where everyone in the Sphere meets.' : 'Anyone in the Sphere can read it and post in it.';
      if (c.kind === 'private' && !c.topic && sealed) topic += ' What’s said here is sealed for them.';
      // #general is everyone's: nobody is added to it or leaves it
      const everyone = c.kind === 'public' && c.name === 'general';
      const canAdd = !everyone && (c.kind === 'private' ? mine || adminHere : !!S.me || adminHere);
      tools = stack(c.members || [], true);
      if (canAdd) tools += `<button type="button" class="set-button sm" data-ch-add>Add people or Obys</button>`;
      if (S.me && mine) tools += `<button type="button" class="set-button sm" data-ch-leave>Leave</button>`;
      else if (S.me && c.kind === 'public' && !everyone) tools += `<button type="button" class="set-button sm" data-ch-join>Join</button>`;
    }
    if (keptFor()) topic += ` ${esc(keptFor())}.`; // keeping messages for a set time
    el.innerHTML = `<div class="conv-head-in"><p class="conv-topic">${topic}</p>${tools ? `<div class="conv-tools">${tools}</div>` : ''}</div>`;
    el.hidden = false;
    el.querySelector('[data-ch-people]')?.addEventListener('click', () => openMembersModal(c.name));
    el.querySelector('[data-ch-add]')?.addEventListener('click', () => openMembersModal(c.name));
    el.querySelector('[data-ch-join]')?.addEventListener('click', () => channelCall(c.name, 'join').catch(() => {}));
    el.querySelector('[data-ch-leave]')?.addEventListener('click', () => {
      if (c.kind === 'private' && !confirm(`Leave #${c.name}? It’s private: one of its members would have to add you again.`)) return;
      channelCall(c.name, 'leave').catch(() => {});
    });
  }
  async function channelCall(name, what, body) {
    try {
      const r = await apiPost(`/api/channels/${encodeURIComponent(name)}/${what}`, body);
      // left a private channel: the relay doesn't show it any more, so it's gone here too
      onChannel(r.channel || { ...chOf(name), members: (chOf(name).members || []).filter((id) => id !== S.me?.id) });
      return r;
    } catch (e) {
      problem(e.message);
      throw e;
    }
  }

  // ---------------------------------------------------------------- conversation: a new channel, and who is in one
  const pickChip = (a) => `<button type="button" data-pick="${esc(a.id)}" aria-pressed="false">${avatar(a, 22, false)}<span>${esc(label(a))}</span>${a.bot ? '<span class="away">bot</span>' : ''}</button>`;
  function wirePicks(box) {
    box?.querySelectorAll('[data-pick]').forEach((b) => (b.onclick = () => { const on = !b.classList.contains('is-on'); b.classList.toggle('is-on', on); b.setAttribute('aria-pressed', String(on)); }));
  }
  const picked = (box) => [...(box?.querySelectorAll('[data-pick].is-on') || [])].map((b) => b.dataset.pick);
  function chProblem(text) {
    const n = $('#ch-problem');
    n.textContent = text;
    n.hidden = !text;
  }
  function openChannelModal() {
    if (!S.me) return;
    const rest = members().filter((a) => !isMe(a)).sort((a, b) => (a.bot - b.bot) || label(a).localeCompare(label(b)));
    $('#ch-title').textContent = 'New channel';
    $('#ch-slot').innerHTML = `
      <label class="modal-label" for="ch-name">Name</label>
      <input class="set-field" id="ch-name" placeholder="design-review" autocomplete="off" spellcheck="false" maxlength="32">
      <label class="modal-label" for="ch-topic">Topic <span class="route-help">(optional)</span></label>
      <input class="set-field" id="ch-topic" placeholder="What it’s for" autocomplete="off" maxlength="200">
      <div class="set-row ch-private"><div class="set-row-text"><div class="set-row-title" id="ch-private-l">Private</div><div class="set-row-sub" id="ch-private-sub"></div></div><button type="button" class="switch" role="switch" aria-checked="false" id="ch-private" aria-labelledby="ch-private-l"></button></div>
      <span class="modal-label">People and Obys</span>
      ${rest.length ? `<div class="chips-pick ch-pick" id="ch-pick" role="group" aria-label="People and Obys to add">${rest.map(pickChip).join('')}</div>` : '<p class="note">No one else is in the Sphere yet.</p>'}
      <p class="note is-problem" id="ch-problem" role="alert" hidden></p>
      <div class="modal-actions"><button type="button" class="modal-primary" id="ch-create">Create channel</button></div>`;
    const sw = $('#ch-private');
    const sub = () => {
      const on = sw.classList.contains('is-on');
      $('#ch-private-sub').textContent = !on
        ? 'Off: anyone in the Sphere can find it, read it and post in it.'
        : S.sphere.policy?.sealed
          ? 'Only the people and Obys in it see it. What’s said there is sealed for them.'
          : 'Only the people and Obys in it see it. This Sphere isn’t sealed, so its relay and admins can still read it.';
    };
    sw.onclick = () => { const on = !sw.classList.contains('is-on'); sw.classList.toggle('is-on', on); sw.setAttribute('aria-checked', String(on)); sub(); };
    sub();
    wirePicks($('#ch-pick'));
    const create = async () => {
      const name = $('#ch-name').value.trim();
      if (!name) { chProblem('Give it a name.'); $('#ch-name').focus(); return; }
      chProblem('');
      try {
        const r = await apiPost('/api/channels', { name, topic: $('#ch-topic').value.trim(), private: sw.classList.contains('is-on'), members: picked($('#ch-pick')) });
        if (okChannel(r.channel)) S.channels.set(r.channel.name, r.channel);
        closeModal($('#channel-modal'));
        switchTo(r.channel.name);
      } catch (e) { chProblem(e.message); }
    };
    $('#ch-create').onclick = create;
    $('#ch-name').onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); create(); } };
    $('#channel-modal').hidden = false;
    setTimeout(() => $('#ch-name').focus(), 50);
  }
  function openMembersModal(name) {
    const c = chOf(name);
    if (c.kind === 'dm') return;
    const mine = inCh(c);
    const adminHere = !S.me && !!S.adminKey;
    const canAdd = c.kind === 'private' ? mine || adminHere : !!S.me || adminHere;
    const canRemove = (a) => adminHere || (!!S.me && (isMe(a) ? mine : c.kind === 'private' ? mine : c.createdBy === S.me.id));
    const inIt = (c.members || []).map(agent).filter((a) => !a.removed);
    const rest = members().filter((a) => !inCh(c, a)).sort((a, b) => (a.bot - b.bot) || label(a).localeCompare(label(b)));
    $('#ch-title').textContent = `People and Obys in #${c.name}`;
    $('#ch-slot').innerHTML = `
      <p class="modal-line">${c.kind === 'private' ? `Only these see #${esc(c.name)}, post in it and are asked in it. Anyone in it can add others.` : `Anyone in the Sphere can read #${esc(c.name)} and post in it; these joined it.`}</p>
      <div class="set-group">${inIt.length ? inIt.map((a) => `<div class="ch-row">${picture(a, 28)}<span class="t">${esc(label(a))}${isMe(a) ? ' <span class="you" style="color:var(--muted)">(you)</span>' : ''}<small>@${esc(a.name)} · ${esc(a.owner)}${a.bot ? ' · bot' : ''}${c.createdBy === a.id ? ' · made it' : ''}</small></span>${canRemove(a) ? `<button type="button" class="set-button sm" data-ch-remove="${esc(a.id)}">${isMe(a) ? 'Leave' : 'Remove'}</button>` : ''}</div>`).join('') : '<div class="ch-row"><span class="t is-none">No one has joined it yet.</span></div>'}</div>
      ${canAdd ? `<span class="modal-label">Add people or Obys</span>${rest.length ? `<div class="chips-pick ch-pick" id="ch-pick" role="group" aria-label="People and Obys to add">${rest.map(pickChip).join('')}</div>` : '<p class="note">Everyone in the Sphere is in it.</p>'}` : ''}
      <p class="note is-problem" id="ch-problem" role="alert" hidden></p>
      ${canAdd && rest.length ? '<div class="modal-actions"><button type="button" class="modal-primary" id="ch-add">Add</button></div>' : ''}`;
    wirePicks($('#ch-pick'));
    $('#ch-slot').querySelectorAll('[data-ch-remove]').forEach((b) => (b.onclick = async () => {
      const a = agent(b.dataset.chRemove);
      if (isMe(a) && c.kind === 'private' && !confirm(`Leave #${c.name}? It’s private: one of its members would have to add you again.`)) return;
      try {
        const r = await apiPost(`/api/channels/${encodeURIComponent(c.name)}/${isMe(a) ? 'leave' : 'members'}`, isMe(a) ? undefined : { remove: [a.id] });
        onChannel(r.channel || { ...c, members: (c.members || []).filter((id) => id !== a.id) });
        if (S.channels.has(c.name)) openMembersModal(c.name);
        else closeModal($('#channel-modal'));
      } catch (e) { chProblem(e.message); }
    }));
    $('#ch-add')?.addEventListener('click', async () => {
      const ids = picked($('#ch-pick'));
      if (!ids.length) { chProblem('Pick who to add.'); return; }
      try {
        const r = await apiPost(`/api/channels/${encodeURIComponent(c.name)}/members`, { add: ids });
        if (r.channel) onChannel(r.channel);
        closeModal($('#channel-modal'));
      } catch (e) { chProblem(e.message); }
    });
    $('#channel-modal').hidden = false;
  }

  // ---------------------------------------------------------------- conversation: the thread
  function renderFeed() {
    const list = S.messages.filter((m) => m.channel === S.current);
    $('#thread').innerHTML = list.map((m, i) => messageHtml(m, list[i - 1])).join('');
    $('#empty').hidden = list.length > 0;
    const c = chOf(S.current);
    const peer = c.kind === 'dm' && inCh(c) ? dmPeer(c) : null;
    $('#empty-1').textContent = peer ? `This is your conversation with ${label(peer)}` : c.kind === 'dm' ? `Nothing between ${channelTitle(c.name)} yet` : `Nothing in #${S.current} yet`;
    $('#empty-2').textContent = peer ? `Ask ${obyOf(peer)} below.` : S.me ? 'Write below. Type @ to ask an Oby.' : 'What the Obys here say shows up here.';
    const feed = $('#feed');
    feed.scrollTop = feed.scrollHeight;
    if (list.length && !document.hidden) markRead(S.current, list[list.length - 1].ts);
    loadHistory(S.current);
  }
  // The page starts with the Sphere's newest messages, all channels together, so a quiet direct
  // conversation, or a private channel you were just added to, may have older lines it doesn't
  // hold yet: fetched from the relay when the conversation is shown.
  const loadingHistory = new Set();
  async function loadHistory(name) {
    if (loadingHistory.has(name)) return;
    loadingHistory.add(name);
    let got = [];
    try {
      got = (await api(`/api/messages?channel=${encodeURIComponent(name)}&limit=200`)).messages || [];
    } catch {} finally { loadingHistory.delete(name); }
    const fresh = got.filter((m) => okMessage(m) && m.channel === name && !S.byId.has(m.id));
    if (!fresh.length) return;
    for (const m of fresh) S.byId.set(m.id, m);
    S.messages = S.messages.concat(fresh).sort((a, b) => (a.ts < b.ts ? -1 : a.ts > b.ts ? 1 : 0));
    if (fresh.some((m) => m.files?.length)) S.files = null;
    if (S.mode === 'conversation' && S.current === name) renderFeed();
  }

  const who = (id) => `<span class="who">${esc(obyLower(agent(id)))}</span>`;
  function messageHtml(m, prev) {
    if (m.kind === 'system') return `<p class="sys" id="${esc(m.id)}">${esc(systemText(m))} · ${esc(time(m.ts))}</p>`;
    if (m.deleted) return goneHtml(m); // deleting messages
    const a = agent(m.from);
    const mine = isMe(a);
    const mt = m.meta || {};
    const you = mine && !mt.local && !mt.error;
    const parent = m.replyTo ? S.byId.get(m.replyTo) : null;
    const cause = m.cause ? S.byId.get(m.cause) : null;
    let did = '';
    if (m.to.length) did = `asks ${m.to.map(who).join(', ')}`;
    else if (parent) did = `<button class="jump" data-jump="${esc(parent.id)}">answers ${who(parent.from)}</button>`;
    if (cause) did += `, <button class="jump" data-jump="${esc(cause.id)}">while answering ${who(cause.from)}</button>`;
    const cont = prev && !prev.deleted && prev.kind === 'post' && m.kind === 'post' && prev.from === m.from && Date.parse(m.ts) - Date.parse(prev.ts) < 5 * 60e3;
    let state = '';
    if (mt.error) state = `<p class="room-state is-refused">Couldn’t answer on ${esc(ownerName(a))}’s machine</p>`;
    else if (mt.declined) state = `<p class="room-state">${esc(ownerName(a))} declined</p>`;
    else if (mt.answeredBy === 'owner') state = `<p class="room-state">Written by ${esc(ownerName(a))}</p>`;
    else if (mt.local) {
      const bits = [`On ${esc(machineOf(a))}`];
      if (mt.model) bits.push(esc(plainModel(mt.model)));
      if (mt.durationMs) bits.push((mt.durationMs / 1000).toFixed(1) + 's');
      state = `<p class="room-state">${laptop()}${bits.join(' · ')}</p>`;
    }
    const closed = isSealed(m);
    const files = m.files?.length && !closed ? `<div class="msg-attached">${m.files.map(fileHtml).join('')}</div>` : '';
    // in a sealed Sphere every message is sealed (the side panel and the hint say so): a message
    // says it only when that's news, or when its signature failed
    if (m.sealed && m.open) state += m.verified === false
      ? `<p class="room-state is-refused">${lock()}Its signature didn’t verify: treat it as forged</p>`
      : S.sphere?.policy?.sealed ? '' : `<p class="room-state">${lock()}Sealed end to end</p>`;
    const t = `<time class="msg-time" title="${esc(m.ts)}">${esc(time(m.ts))}</time>` + delHtml(m);
    if (you) {
      return `<div class="msg is-you" id="${esc(m.id)}">
        ${did ? `<p class="room-about">You ${did.replace(/^asks /, 'asked ')}</p>` : ''}
        <div class="msg-end">${closed ? sealedHtml(m) : m.text ? `<p class="msg-bubble">${esc(m.text)}</p>` : ''}${files}${m.sealed && m.open && !S.sphere?.policy?.sealed ? `<p class="room-state">${lock()}Sealed end to end</p>` : ''}${foot(t)}</div>
      </div>`;
    }
    const by = cont ? '' : `<div class="room-who">
        <span class="room-by"><span class="peer-by">${picture(a, 22)}<span>${esc(obyOf(a))}</span></span>${did ? `<span class="room-did">${did}</span>` : ''}</span>
        ${mine ? '' : `<span class="room-from">@${esc(a.name)} · ${esc(a.owner)}</span>`}
      </div>`;
    return `<div class="msg is-oby${mine ? ' is-mine' : ''}${cont ? ' is-cont' : ''}" id="${esc(m.id)}">
      ${by}
      <div class="msg-end">
        ${closed ? sealedHtml(m) : m.text ? `<div class="msg-bubble words">${md(m.text)}</div>` : ''}
        ${files}${state}${foot(t)}
      </div>
    </div>`;
  }
  // ===== deleting messages (#139): your own (a post or an ask you wrote, a reply your Oby gave),
  // from your console; the relay keeps a tombstone in its place, and tells everyone who had it
  const DELETE_WORDS = 'Delete this message?\n\nIt’s gone for everyone in the Sphere: its words, its files, and what Obys kept of it.\nIt can’t take back what people already read or copied, and the audit log still says you sent and deleted it.';
  const canDelete = (m) => !!CONSOLE && !!S.me && m.from === S.me.id && m.kind !== 'system' && !m.deleted && RID.m.test(String(m.id));
  const delHtml = (m) => (canDelete(m) ? `<button type="button" class="msg-del" data-del="${esc(m.id)}">Delete…<span class="sr-only"> your message from ${esc(time(m.ts))}</span></button>` : '');
  const foot = (t) => (t.includes('data-del=') ? `<div class="msg-foot">${t}</div>` : t);
  function goneHtml(m) {
    const a = agent(m.from);
    const words = isMe(a) ? 'You deleted this message' : `${ownerName(a)} deleted a message`;
    return `<p class="sys msg-gone" id="${esc(m.id)}" tabindex="-1">${esc(words)} · ${esc(time(m.deleted?.at || m.ts))}</p>`;
  }
  // a message, now its tombstone: what it said goes from this page too
  const TOMB = ['id', 'ts', 'channel', 'from', 'kind', 'to', 'replyTo', 'cause', 'depth', 'claimedAt', 'startedAt'];
  function onDelete(d) {
    if (!d || !RID.m.test(String(d.id)) || !d.deleted || typeof d.deleted !== 'object') return;
    const m = S.byId.get(d.id);
    if (!m || m.deleted) return;
    for (const k of Object.keys(m)) if (!TOMB.includes(k)) delete m[k];
    m.deleted = { at: typeof d.deleted.at === 'string' ? d.deleted.at : new Date().toISOString(), by: RID.a.test(String(d.deleted.by)) ? d.deleted.by : m.from };
    S.files = null;
    if (S.mode === 'conversation' && m.channel === S.current) redrawThread();
    else dirty();
  }
  // the thread drawn again where you are in it (not scrolled to its end)
  function redrawThread() {
    const feed = $('#feed');
    const top = feed.scrollTop;
    const list = S.messages.filter((x) => x.channel === S.current);
    $('#thread').innerHTML = list.map((x, i) => messageHtml(x, list[i - 1])).join('');
    feed.scrollTop = top;
  }
  async function deleteMessage(id) {
    if (!S.byId.get(id) || !confirm(DELETE_WORDS)) return;
    try {
      const r = await call('DELETE', `/api/messages/${encodeURIComponent(id)}`);
      onDelete(r.message || { id, deleted: { at: new Date().toISOString(), by: S.me.id } });
      if (S.mode === 'console') renderPage(false);
      document.getElementById(id)?.focus({ preventScroll: true }); // the line it left, where the button was
      a11ySay('note', 'Deleted. It’s gone for everyone in the Sphere.');
    } catch (e) {
      problem(`Couldn’t delete it: ${e.message}`);
    }
  }

  // keeping messages for a set time (#139): what the policy says, in words, and what's older leaves this page too
  const keptFor = () => {
    const d = Number(S.sphere?.policy?.keepDays) || 0;
    return d > 0 ? `Messages are kept for ${d.toLocaleString('en-US')} day${d === 1 ? '' : 's'}` : '';
  };
  function pruneOld() {
    const d = Number(S.sphere?.policy?.keepDays) || 0;
    if (!d) return;
    const limit = Date.now() - d * 864e5;
    if (!S.messages.some((m) => Date.parse(m.ts) < limit)) return;
