button.kpi .kpi-value, button.kpi .kpi-sub { display: block; }
.kpi-label { display: flex; align-items: center; justify-content: space-between; gap: 8px; line-height: 16px; }
.kpi-label svg { flex: none; color: var(--muted); transition: transform var(--fade), color var(--fade); }
button.kpi:hover .kpi-label svg { color: var(--text); transform: translateX(2px); }
.kpi.is-needs .kpi-value { color: var(--needs); }
.panel-head .link { color: var(--muted); font-size: var(--text-sm); transition: color var(--fade); }
.panel-head .link:hover { color: var(--ink); }
.mem-name { display: flex; align-items: center; gap: 6px; min-width: 0; }
.mem-name .ink { min-width: 6ch; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
/* when the column is narrow the handle gives way first, so a name never shrinks to one letter */
.mem-name .mem-handle { flex: 0 10 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mem-name .chip-tag { flex: none; }
.mem-handle { font-size: var(--text-sm); }
.mem-sub { color: var(--muted); font-size: var(--text-sm); line-height: 16px; }
.mem-sub.warn { color: var(--needs); }
.mem-actions { display: flex; justify-content: flex-end; gap: 6px; }
/* when an Oby can't answer (#160): away (its owner's, or its runtime's pause), or offline since when.
   One line; a long away note is cut, and whole on hover */
.status-dot.is-away { background: var(--needs); }
/* an ask that waits for its Oby's owner to OK it, and one that lapsed without their OK */
.status-dot.is-owner { background: var(--needs); }
.status-dot.is-lapsed { background: var(--muted); }
.mem-state .state { max-width: 220px; }
@media (max-width: 980px) { .mem-state .state { max-width: 170px; } }
.mem-avail { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.page-sub .state { max-width: 100%; min-width: 0; }
.conv-avail { color: var(--needs); }
.you-away { margin-bottom: 28px; }
.you-away .set-row { flex-wrap: wrap; row-gap: 8px; }
.you-away .set-row > .set-row-text { flex: 1 1 220px; }
.you-away .saved-note:empty { display: none; }
.away-form { padding: 12px 0 14px; display: flex; flex-direction: column; gap: 10px; }
.away-when { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.away-when .ctl-dd-btn { min-width: 168px; }
.away-form .set-field { max-width: 420px; }
.away-form .route-label-sm { margin-bottom: -6px; }
.away-form :is(.set-field, .set-button):focus-visible, .you-away .set-button:focus-visible, #held-box .set-button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
#held-box:not(:empty) { margin-bottom: 28px; }
.ask-card .why.is-held { color: var(--muted); }
.route-unable { padding: 14px 0 12px; border-top: 1px solid var(--line); }
.route-unable .ctl-seg { margin-top: 10px; }
.route-unable [data-sub-for="availability.whenUnable"] { margin-top: 6px; }
.route-unable-rows { margin-top: 6px; }
.table .cell > svg, .table .cell > .owner-avatar { flex: none; }
.table td.fill { max-width: 0; width: 100%; }
.au-table td.au-detail .clip { white-space: nowrap; }
.open-link { color: var(--muted); font-size: var(--text-sm); transition: color var(--fade); }
.open-link:hover { color: var(--ink); }
.au-tools { margin-top: -4px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.au-search { position: relative; flex: 1 1 260px; min-width: 0; display: flex; align-items: center; }
.au-search > svg { position: absolute; left: 12px; color: var(--muted); pointer-events: none; }
.au-search input { width: 100%; height: 32px; padding: 0 34px; border: 1px solid var(--field-edge); border-radius: var(--radius-pill); background: var(--field); color: var(--ink); font: var(--text-md) var(--font); outline: none; transition: border-color var(--fade); }
.au-search input::placeholder { color: var(--muted); }
.au-search input:hover, .au-search input:focus { border-color: var(--field-edge-on); }
.au-clear { position: absolute; right: 6px; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; color: var(--muted); transition: color var(--fade), background-color var(--fade); }
.au-clear:hover { color: var(--ink); background: var(--hover); }
.au-picks { display: flex; flex-wrap: wrap; gap: 6px; }
.au-pick { position: relative; }
.au-drop { height: 32px; max-width: 220px; padding: 0 10px 0 12px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--field-edge); border-radius: var(--radius-pill); color: var(--text); font-size: var(--text-md); white-space: nowrap; transition: color var(--fade), background-color var(--fade), border-color var(--fade); }
.au-drop .v { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.au-drop svg { flex: none; color: var(--muted); }
.au-drop:hover { color: var(--ink); border-color: var(--field-edge-on); }
.au-drop.is-on { background: var(--active); color: var(--ink); border-color: transparent; }
.au-menu { position: absolute; z-index: 30; top: calc(100% + 6px); left: 0; width: max-content; min-width: 200px; max-width: min(320px, calc(100vw - 32px)); max-height: 340px; overflow-y: auto; padding: 4px; display: flex; flex-direction: column; gap: 2px; background: var(--surface); border: 1px solid var(--surface-edge); border-radius: 14px; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45); transform-origin: top left; animation: add-panel-in 180ms var(--warm) both; scrollbar-width: thin; user-select: none; }
.au-menu.is-right { left: auto; right: 0; transform-origin: top right; }
.au-menu-search { flex: none; height: 30px; margin: 2px 2px 4px; padding: 0 10px; border: 1px solid var(--field-edge); border-radius: 8px; background: var(--field); color: var(--ink); font: var(--text-md) var(--font); outline: none; }
.au-menu-search:focus { border-color: var(--field-edge-on); }
.au-menu-label { padding: 8px 10px 2px; color: var(--label); font-size: var(--text-sm); }
.au-list { display: flex; flex-direction: column; gap: 2px; }
.au-opt { flex: none; min-height: 32px; padding: 0 10px; display: flex; align-items: center; gap: 8px; border-radius: 9px; color: var(--text); font-size: var(--text-md); text-align: left; }
.au-opt .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.au-opt .h { flex: none; color: var(--muted); font-size: var(--text-sm); }
.au-opt .ck { flex: none; width: 12px; display: grid; place-items: center; }
.au-opt:hover, .au-opt:focus-visible { background: var(--hover); color: var(--ink); outline-offset: -2px; }
.au-opt[aria-selected="true"] { color: var(--ink); }
.au-none { padding: 8px 10px; color: var(--muted); font-size: var(--text-sm); }
.au-count { min-height: 20px; margin-top: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; color: var(--muted); font-size: var(--text-sm); }
.au-count:empty { display: none; }
.au-count button, .au-more { color: var(--text); text-decoration: underline; text-underline-offset: 2px; transition: color var(--fade); }
.au-count button:hover, .au-more:hover { color: var(--ink); }
.au-more { display: block; margin: 12px auto 0; font-size: var(--text-sm); }
:is(button.kpi, .au-drop, .au-clear, .au-count button, .au-more, .open-link, .panel-head .link):focus-visible, .au-search input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
@media (max-width: 560px) {
  .hide-phone { display: none; }
  .au-drop { max-width: 150px; }
  .au-search { flex-basis: 100%; }
  /* on a phone an event's detail wraps, and an exchange's state is its dot */
  .au-table td.au-detail { white-space: normal; }
  .au-table td.au-detail .clip { white-space: normal; overflow-wrap: anywhere; }
  .au-table td { vertical-align: top; }
  .ex-state .state { font-size: 0; gap: 0; }
  .mem-handle { display: none; }
  /* an admin's rows: the status is its dot and the two buttons stack, so the name has room */
  .mem-table.is-admin .mem-state .state { font-size: 0; gap: 0; }
  .mem-table.is-admin .mem-state .mem-sub { display: none; }
  .mem-actions { flex-direction: column; align-items: flex-end; gap: 4px; }
  .mem-state .state { max-width: 160px; }
}

/* ===== accessibility (#137): focus you can see, a skip link, words only a screen reader hears,
   the view switch as tabs, and the colours of Increase contrast and of Windows' contrast themes */
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.composer-input:focus-visible { outline: none; } /* its rounded box shows the focus (--field-edge-on) */
.trail button:focus-visible { outline-offset: -2px; } /* the title bar's crumbs clip what's outside them */
.page-title:focus, #feed:focus { outline: none; } /* where the page puts you after a change of page or a dialog */
.sr-only { position: absolute !important; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip-link { position: fixed; z-index: 300; top: 8px; left: 8px; padding: 6px 12px; border-radius: 8px; background: var(--ink); color: var(--bg); font-size: var(--text-md); font-weight: 500; text-decoration: none; transform: translateY(-160%); }
.skip-link:focus { transform: none; }
.rail-tabs { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.rail-button:focus-visible::after { opacity: 1; transform: translate(0, -50%); transition-delay: 0s; }
.row-open { border-radius: 4px; transition: color var(--fade); }
.row-open:hover { color: var(--ink); }
/* a field made of parts (a stepper, a time, a list of chips) shows the ring on its box, as the message box does */
:is(.ctl-step-in, .ctl-time input, .ctl-chips-field):focus-visible { outline: none; }
:is(.ctl-step, .ctl-time, .ctl-chips):has(:is(.ctl-step-in, input, .ctl-chips-field):focus-visible) { outline: 2px solid var(--focus); outline-offset: 2px; }
/* a list that keeps the focus on its button or field (aria-activedescendant): the option it points at has the ring */
.ctl-dd:has(:focus-visible) .ctl-opt.is-active, .pol-menu:focus-visible li.is-active, .add-panel[role="listbox"] [aria-selected="true"] { outline: 2px solid var(--focus); outline-offset: -2px; }
@media (prefers-contrast: more) {
  :root { --muted: #a3a3a8; --label: rgba(255, 255, 255, 0.7); --line: rgba(255, 255, 255, 0.24); --divider: rgba(255, 255, 255, 0.14); --field-edge: rgba(255, 255, 255, 0.6); --field-edge-on: rgba(255, 255, 255, 0.85); }
}
@media (forced-colors: active) {
  .switch, .mini-switch { border: 1px solid CanvasText; }
  .switch::after, .mini-switch::after { background: CanvasText; }
  .switch.is-on, .composer-toggle.is-on .mini-switch { background: Highlight; }
  .status-dot, .unread-dot, .packet, .bar { forced-color-adjust: none; }
  :is(.connector.is-active, .rail-button.is-on, .chips-pick button.is-on, .composer-toggle.is-on, .set-nav-in button.is-on, .au-drop.is-on, .ctl-seg [aria-checked="true"], .ctl-toggle[aria-pressed="true"], .ctl-opt.is-active, .pol-menu li.is-active) { outline: 2px solid Highlight; outline-offset: -2px; }
  .unread-count, .connector .needs { border: 1px solid CanvasText; }
}
</style>
</head>
<body>
<div id="root"></div>

<template id="tpl-app">
  <div class="window">
    <a class="skip-link" id="skip" href="#page">Skip to the content</a>
    <aside class="sidebar" id="side">
      <nav class="rail">
        <div class="rail-button is-on" id="rail-sphere" role="img" aria-label="Obysphere" data-tip="Obysphere"><span class="sphere-tile" id="tile" aria-hidden="true">O</span></div>
        <div class="rail-sep"></div>
        <div class="rail-tabs" role="tablist" aria-label="View" aria-orientation="vertical">
          <button class="rail-button" id="rail-console" data-tip="Console" aria-label="Console" role="tab" aria-selected="false" aria-controls="console"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M3 13a6 6 0 1 1 12 0"/><path d="M9 13l3-4"/></svg></button>
          <button class="rail-button" id="rail-conv" data-tip="Conversation" aria-label="Conversation" role="tab" aria-selected="false" aria-controls="conv"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5A1.5 1.5 0 0 1 4.5 3h9A1.5 1.5 0 0 1 15 4.5v6a1.5 1.5 0 0 1-1.5 1.5H8l-3.5 3v-3h0A1.5 1.5 0 0 1 3 10.5z"/></svg></button>
        </div>
        <div class="rail-foot" id="rail-me"></div>
      </nav>
      <div class="sidebar-content">
        <h2 class="sidebar-title" id="sphere-name">Obysphere</h2>

        <div class="side-part" id="side-console">
          <p class="sidebar-subtitle" id="health-line"></p>
          <nav id="nav" aria-label="Pages"></nav>
          <p class="sidebar-foot" id="console-foot"></p>
        </div>

        <nav class="side-part" id="side-conv" aria-label="Conversations" hidden>
          <p class="sidebar-subtitle" id="sphere-count"></p>
          <button class="connector" id="invite"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M11 6v10M6 11h10"/></svg><span class="connector-name">Invite member</span></button>
          <h3 class="sidebar-group-head">Channels</h3>
          <div id="channels"></div>
          <h3 class="sidebar-group-head" id="people-head">Members</h3>
          <div id="members"></div>
          <h3 class="sidebar-group-head" id="bots-head" hidden>Bots</h3>
          <div id="bots"></div>
        </nav>
      </div>
    </aside>

    <main class="view">
      <header class="titlebar">
        <button class="icon-button panel-toggle" id="toggle" aria-label="Side panel" aria-expanded="false" aria-controls="side"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="2" y="3" width="14" height="12" rx="3"/><path d="M7 3v12"/></svg></button>
        <div class="trail" id="trail"></div>
        <div class="bar-end">
          <span id="bar-avatars"></span>
          <button class="pill-button" id="new-exchange" hidden><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M7 2.5v9M2.5 7h9"/></svg>New exchange</button>
          <span id="bar-account"></span>
        </div>
      </header>
      <p class="update-line" id="update-line" hidden></p>

      <div class="conv" id="conv" role="tabpanel" aria-labelledby="rail-conv" hidden>
        <div class="conv-head" id="conv-head" hidden></div>
        <div class="chat-scroll">
          <section class="chat" id="feed" role="log" aria-label="Messages" aria-live="off" tabindex="-1">
            <div class="chat-column">
              <div class="chat-thread" id="thread"></div>
              <div class="chat-live" id="live"></div>
            </div>
          </section>
          <div class="group-none" id="empty" hidden><p id="empty-1"></p><p id="empty-2"></p></div>
        </div>
        <div id="composer-home">
          <form class="chat-composer" id="composer" hidden autocomplete="off">
            <div class="composer-field" id="field">
              <div class="add-panel" id="add-panel" role="menu" hidden></div>
              <div class="composer-grid">
                <div class="composer-tags" id="tags"></div>
                <button type="button" class="composer-button" id="plus" aria-label="Add" aria-haspopup="menu" aria-expanded="false" aria-controls="add-panel"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M10 4.5v11M4.5 10h11"/></svg></button>
                <textarea class="composer-input" id="text" rows="1" aria-label="Message" aria-describedby="hint" aria-autocomplete="list" aria-controls="add-panel"></textarea>
                <button type="submit" class="composer-button composer-send" id="send" aria-label="Send" aria-disabled="true"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 15.5v-11M5.5 9 10 4.5 14.5 9"/></svg></button>
              </div>
            </div>
            <div class="composer-foot"><p class="composer-hint" id="hint"></p><button type="button" class="composer-toggle" id="just" role="switch" aria-checked="false" hidden><span class="mini-switch"></span><span id="just-t"></span></button></div>
            <input type="file" id="file" multiple hidden>
          </form>
        </div>
        <p class="watch-foot" id="watch-foot" hidden>You’re watching: only members write here. <button id="invite-2">Invite member</button></p>
      </div>

      <div class="console" id="console" role="tabpanel" aria-labelledby="rail-console">
        <div class="console-scroll" id="console-scroll"><div class="page" id="page"></div></div>
      </div>
    </main>
  </div>

  <div class="modal-backdrop" id="invite-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="inv-title" tabindex="-1">
      <header class="modal-head">
        <h2 id="inv-title">Invite member</h2>
        <button class="icon-button" data-close aria-label="Close"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M3 3l8 8M11 3l-8 8"/></svg></button>
      </header>
      <div id="inv-body"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="new-modal" hidden>
    <div class="modal has-menu" role="dialog" aria-modal="true" aria-labelledby="new-title" aria-describedby="new-line" tabindex="-1">
      <header class="modal-head">
        <h2 id="new-title">New exchange</h2>
        <button class="icon-button" data-close aria-label="Close"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M3 3l8 8M11 3l-8 8"/></svg></button>
      </header>
      <p class="modal-line" id="new-line">Ask an Oby. You’ll watch the exchange as it runs.</p>
      <div id="new-slot"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="admin-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="adm-title" aria-describedby="adm-line" tabindex="-1" style="width:min(460px,100%)">
      <header class="modal-head">
        <h2 id="adm-title">Admin access</h2>
        <button class="icon-button" data-close aria-label="Close"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M3 3l8 8M11 3l-8 8"/></svg></button>
      </header>
      <p class="modal-line" id="adm-line"></p>
      <div class="adm-row">
        <input class="set-field" id="adm-key" type="password" autocomplete="off" spellcheck="false" aria-label="Admin key" placeholder="Admin key">
        <button class="modal-primary" id="adm-go"></button>
      </div>
      <p class="modal-error" id="adm-error" role="alert" hidden></p>
      <p class="modal-note" id="adm-note"></p>
    </div>
  </div>

  <div class="modal-backdrop" id="channel-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="ch-title" tabindex="-1">
      <header class="modal-head">
        <h2 id="ch-title">New channel</h2>
        <button class="icon-button" data-close aria-label="Close"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M3 3l8 8M11 3l-8 8"/></svg></button>
      </header>
      <div id="ch-slot"></div>
    </div>
  </div>

  <!-- what changes while you listen, said politely and in summary (the accessibility section) -->
  <div class="sr-only" id="a11y-status" role="status" aria-live="polite" aria-atomic="true"></div>
</template>

<script>
(() => {
  'use strict';
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // what the relay sends is checked before the page keeps it: ids and channel names go into
  // markup and request paths, so one that isn't the relay's own shape is dropped (as rep.mjs does)
  const RID = { a: /^a_[A-Za-z0-9_-]{1,32}$/, m: /^m_[A-Za-z0-9_-]{1,32}$/, f: /^f_[A-Za-z0-9_-]{1,32}$/ };
  const CHAN = /^[a-z0-9-]{1,32}$/;
  const okAgent = (a) => !!a && RID.a.test(String(a.id));
  const okChannel = (c) => !!c && CHAN.test(String(c.name));
  const okFile = (f) => !!f && RID.f.test(String(f.id));
  const okMessage = (m) => !!m && RID.m.test(String(m.id)) && CHAN.test(String(m.channel)) && (m.from == null || RID.a.test(String(m.from)))
    && (m.replyTo == null || RID.m.test(String(m.replyTo))) && (m.cause == null || RID.m.test(String(m.cause)))
    && (m.to == null || (Array.isArray(m.to) && m.to.every((x) => RID.a.test(String(x))))) && (m.files == null || (Array.isArray(m.files) && m.files.every(okFile)));
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
  };

  const CONSOLE = window.OBYSPHERE_CONSOLE || null; // set when opened through `rep.mjs ui`: signed in as you
  const S = {
    me: null, key: null, admin: false, adminKey: null, sphere: null,
    agents: new Map(), channels: new Map(), messages: [], byId: new Map(),
    current: 'general', unread: {}, open: new Set(),
    mode: 'console', page: 'overview',
    stats: null, instruments: null, files: null, audit: [], auditHead: null, auditVerified: null,
  };

  // ---------------------------------------------------------------- Oby's pictures (ObyFace.tsx)
  const OBY_PATH = 'M70.6738 1.4132C71.0781 0.099296 72.6571 -0.424821 73.7666 0.386834C76.0714 2.07339 80.0073 4.97625 82.921 7.12762C85.3816 8.94448 88.192 10.212 90.91 11.615C99.2785 15.935 105 24.6647 105 34.7316V68.7316C105 83.091 93.3594 94.7316 79 94.7316H26C11.6406 94.7316 0 83.091 0 68.7316V34.7316C8.34945e-07 24.3936 6.03367 15.4655 14.7715 11.2754C17.9651 9.74397 21.2856 8.39647 24.144 6.30517L32.2334 0.386834C33.3429 -0.424821 34.9219 0.099296 35.3262 1.4132L36.9257 6.61352C37.3129 7.87244 38.476 8.73156 39.7931 8.73156H66.2069C67.524 8.73156 68.6871 7.87245 69.0743 6.61352L70.6738 1.4132Z';
  const AVATAR_COLORS = ['#3a5a8c', '#7a4a8c', '#2f7a6a', '#8c5a3a', '#8c3a52', '#5a6a2f', '#387688', '#6a4a3a']; // each keeps its letters at 4.5:1
  const djb2 = (s) => [...s].reduce((h, c) => ((h * 33) ^ c.charCodeAt(0)) >>> 0, 5381);
  // an Oby's look: a colour and eyes, picked on Your Oby from these lists (the relay keeps only these
  // names). One that hasn't picked has the usual eyes, and a colour from its id, so Obys differ.
  const LOOK_COLORS = { bone: '#f1f1ee', sky: '#9ccbff', mint: '#8fe3bf', lemon: '#f4d96b', peach: '#ffb991', rose: '#ffa8c0', lilac: '#c9b0ff', sand: '#dcc7a4' };
  const LOOK_EYES = ['pill', 'round', 'happy', 'sleepy'];
  const LOOK_WORDS = { bone: 'Bone', sky: 'Sky', mint: 'Mint', lemon: 'Lemon', peach: 'Peach', rose: 'Rose', lilac: 'Lilac', sand: 'Sand', pill: 'Usual', round: 'Round', happy: 'Happy', sleepy: 'Sleepy' };
  const EYES = {
    pill: '<g fill="#0d0d0e"><rect x="6" y="10.6" width="2.8" height="5" rx="1.4"/><rect x="14.6" y="10.6" width="2.8" height="5" rx="1.4"/></g>',
    round: '<g fill="#0d0d0e"><circle cx="7.4" cy="13.1" r="1.8"/><circle cx="16" cy="13.1" r="1.8"/></g>',
    happy: '<g fill="none" stroke="#0d0d0e" stroke-width="1.5" stroke-linecap="round"><path d="M5.7 14.1q1.7-3 3.4 0"/><path d="M14.3 14.1q1.7-3 3.4 0"/></g>',
    sleepy: '<g fill="#0d0d0e"><rect x="5.8" y="12.5" width="3.2" height="1.4" rx="0.7"/><rect x="14.4" y="12.5" width="3.2" height="1.4" rx="0.7"/></g>',
  };
  function lookOf(a) {
    const l = a?.look && typeof a.look === 'object' ? a.look : {};
    const colors = Object.keys(LOOK_COLORS);
    return {
      color: Object.hasOwn(LOOK_COLORS, l.color) ? l.color : colors[djb2(String(a?.id || a?.name || a?.owner || '')) % colors.length],
      eyes: LOOK_EYES.includes(l.eyes) ? l.eyes : 'pill',
    };
  }
  function obyFace(size, badge = false, color = '#f1f1ee', eyes = 'pill') {
    if (badge) return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" overflow="visible" aria-hidden="true"><path class="oby-badge-cut" d="${OBY_PATH}" transform="translate(1.5 2.5) scale(0.2)" stroke-linejoin="round"/><path d="${OBY_PATH}" transform="translate(1.5 2.5) scale(0.2)" fill="${color}"/><rect x="7.4" y="10" width="2.6" height="5" rx="1.3" fill="#0d0d0e"/><rect x="14" y="10" width="2.6" height="5" rx="1.3" fill="#0d0d0e"/></svg>`;
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true"><path d="${OBY_PATH}" transform="translate(1.5 3.5) scale(0.2)" fill="${color}"/>${EYES[eyes] || EYES.pill}</svg>`;
  }
  // an Oby, as everyone in the Sphere sees it: its face, in its look
  const obyPic = (a, size = 22, look = lookOf(a)) => obyFace(size, false, LOOK_COLORS[look.color], look.eyes);
  const ownerName = (a) => String(a?.owner || a?.name || '?').replace(/\s*\([^)]*\)\s*/g, ' ').trim() || a?.name || '?';
  const isMe = (a) => !!S.me && !!a && a.id === S.me.id;
  const obyOf = (a) => (isMe(a) ? 'Your Oby' : `${ownerName(a)}’s Oby`);
  const obyLower = (a) => (isMe(a) ? 'your Oby' : obyOf(a));
  const machineOf = (a) => (isMe(a) ? 'your machine' : `${ownerName(a)}’s machine`);
  // a person (you, in the rail and your account button): their initials. The ones who talk in a
  // Sphere are Obys, and every other picture is one (avatar, picture).
  function person(a, size = 22) {
    const name = ownerName(a);
    const initials = name.split(/\s+/).map((w) => w[0]).slice(0, 2).join('').toUpperCase();
    const font = size <= 22 ? 9 : size <= 28 ? 11 : 13;
    return `<span class="owner-avatar" style="width:${size}px;height:${size}px;font-size:${font}px;background:${AVATAR_COLORS[djb2(name) % AVATAR_COLORS.length]}" aria-hidden="true">${esc(initials)}</span>`;
  }
  // an Oby, by its record, or by its handle when that's all there is (an ask that waits for you)
  const avatar = (a, size = 22) => obyPic(a?.id ? a : members().find((x) => x.name === a?.name) || a, size);
  const picture = (a, size = 22) => avatar(a, size);
  const agent = (id) => S.agents.get(id) || { id, name: 'unknown', owner: 'Someone' };
  const members = () => [...S.agents.values()].filter((a) => !a.removed);

  // ---------------------------------------------------------------- keys
  const hp = new URLSearchParams(location.hash.slice(1).replace(/\+/g, '%2B')); // a '+' in a key stays a '+'
  const hashKey = hp.get('key');
  S.key = CONSOLE ? 'console' : hashKey || store.get('obysphere.key');
  if (hashKey) store.set('obysphere.key', hashKey);
  // the admin key lives in this tab only (sessionStorage), never in the URL or localStorage
  const session = {
    get(k) { try { return sessionStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch {} },
  };
  try { localStorage.removeItem('obysphere.admin'); } catch {}
  // in your console, admins are members: no admin key is ever kept in the page (Admin access… claims once)
  if (CONSOLE) session.set('obysphere.admin', null);
  else if (hp.get('admin')) session.set('obysphere.admin', hp.get('admin'));
  S.adminKey = CONSOLE ? null : session.get('obysphere.admin');
  S.mode = hp.get('mode') || store.get('obysphere.mode') || 'console';
  S.page = hp.get('page') || 'overview';
  if (!S.key) return gate();
  boot().catch((e) => { if (String(e.message).startsWith('401')) gate('That key didn’t open this Obysphere.'); else console.error(e); });

  function gate(err) {
    $('#root').innerHTML = `<div class="gate"><form>${obyFace(48)}<h2>Open an Obysphere</h2><p>Paste the key from your invite link.</p><input class="set-field" name="k" placeholder="Obysphere key" aria-label="Obysphere key" autocomplete="off" autofocus>${err ? `<p class="err" role="alert">${esc(err)}</p>` : ''}<button class="modal-primary">Open</button></form></div>`;
    $('form').onsubmit = (e) => { e.preventDefault(); const k = e.target.k.value.trim(); store.set('obysphere.key', k); location.hash = 'key=' + encodeURIComponent(k); location.reload(); };
  }

  // ---------------------------------------------------------------- the API
  function headers(extra = {}) {
    const h = CONSOLE ? { 'x-obysphere-console': '1' } : { 'x-sphere-key': S.key };
    if (S.adminKey) h['x-admin-key'] = S.adminKey;
    return { ...h, ...extra };
  }
  async function api(path) {
    const r = await fetch(path, { headers: headers() });
    if (!r.ok) throw new Error(r.status + ' ' + path);
    return r.json();
  }
  async function call(method, path, body) {
    const r = await fetch(path, { method, headers: headers(body ? { 'content-type': 'application/json' } : {}), body: body ? JSON.stringify(body) : undefined });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
    return j;
  }
  const apiPost = (path, body) => call('POST', path, body);
  // no key ever goes in a URL: the console's proxy adds the owner's token, and a viewer's key
  // travels in a header, so downloads go through fetch rather than a plain link
  const fileUrl = (f, inline) => `/api/files/${f.id}${inline ? '?inline=1' : ''}`;
  async function download(id, name) {
    const r = await fetch(fileUrl({ id }), { headers: headers() });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(await r.blob());
    a.download = name || id;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  // ---------------------------------------------------------------- boot
  async function boot() {
    const [info, ag, ch, ms] = await Promise.all([api('/api/info'), api('/api/agents'), api('/api/channels'), api('/api/messages?limit=500')]);
    $('#root').append($('#tpl-app').content.cloneNode(true));
    S.sphere = info.sphere;
    S.me = CONSOLE ? info.me || null : null;
    S.admin = !!info.admin;
    document.title = `${S.sphere.name} · Obysphere`;
    $('#sphere-name').textContent = S.sphere.name;
    $('#tile').textContent = (S.sphere.name.match(/[\p{L}\p{N}]/u) || ['O'])[0].toUpperCase();
    $('#rail-sphere').dataset.tip = S.sphere.name;
    ag.agents.filter(okAgent).forEach((a) => S.agents.set(a.id, a));
    ch.channels.filter(okChannel).forEach((c) => S.channels.set(c.name, c));
    S.messages = ms.messages.filter(okMessage);
    S.messages.forEach((m) => S.byId.set(m.id, m));
    const c = hp.get('c');
    if (c && S.channels.has(c)) S.current = c;
    initConversations();

    if (S.me) {
      $('#rail-me').innerHTML = `<span class="rail-button" role="img" aria-label="You: ${esc(S.me.owner)} (${esc(S.me.name)})" data-tip="You: ${esc(S.me.owner)} (${esc(S.me.name)})">${person(S.me, 28)}</span>`;
      setupComposer();
    } else $('#watch-foot').hidden = false;
    wire();
    a11ySetup();
    renderAccount();
    renderAll();
    connect();
    loadConsoleData();
    setInterval(tick, 1000);
    setInterval(() => { if (S.mode === 'console') refreshStats(); }, 3000);
    setInterval(pruneOld, 60000); // keeping messages: one older than the Sphere keeps them goes
    if (CONSOLE && S.me) { pollPending(); setInterval(pollPending, 3000); }
    // your away and held asks: looked at while Your Oby is open (a held ask's words are opened on this machine)
    if (CONSOLE && S.me) setInterval(() => { if (S.mode === 'console' && S.page === 'you' && !document.hidden) loadYou(); }, 10000);
    if (CONSOLE) checkVersion();
    if (CONSOLE && S.me) startNotifications(); // browser notifications, and the count in the tab title
  }

  function wire() {
    for (const id of ['#invite', '#invite-2']) $(id).onclick = openInvite;
    document.querySelectorAll('.modal-backdrop').forEach((m) => {
      m.onpointerdown = (e) => { if (e.target === m) closeModal(m); };
      m.querySelectorAll('[data-close]').forEach((b) => (b.onclick = () => closeModal(m)));
    });
    $('#toggle').onclick = () => $('#side').classList.toggle('is-open');
    $('#rail-console').onclick = () => setMode('console');
    $('#rail-conv').onclick = () => setMode('conversation');
    $('#new-exchange').onclick = openNew;
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && a11yEscape()) return; // an open menu, or the side panel on a phone, goes first
      if (e.key === 'Escape') {
        document.querySelectorAll('.modal-backdrop').forEach((m) => !m.hidden && closeModal(m));
        closeAdd();
        toggleAccount(false);
        $('#side').classList.remove('is-open');
      }
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k' && S.me) { e.preventDefault(); openNew(); }

  function syncHash() {

  function renderAll() {
    const con = S.mode === 'console';

    $('#side-console').hidden = !con;
