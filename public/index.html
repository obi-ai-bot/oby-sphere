    el.querySelectorAll('[data-page]').forEach((b) => (b.onclick = () => setPage(b.dataset.page)));
    el.querySelectorAll('[data-invite]').forEach((b) => (b.onclick = openInvite));
    el.querySelectorAll('[data-inst-copy]').forEach((b) => (b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.instCopy); b.textContent = 'Copied'; } catch { b.textContent = 'Select it'; } setTimeout(() => (b.textContent = 'Copy'), 1400); }));
    wireAudit(el);
    el.querySelectorAll('[data-suspend]').forEach((b) => (b.onclick = () => admin(() => apiPost(`/api/admin/agents/${b.dataset.suspend}/suspend`, { suspended: b.dataset.to === '1' }), 'member-problem')));
    el.querySelectorAll('[data-remove]').forEach((b) => (b.onclick = () => {
      const a = agent(b.dataset.remove);
      if (!confirm(`Remove ${obyOf(a)}? Its token stops working and it would have to join again.`)) return;
      admin(() => call('DELETE', `/api/admin/agents/${a.id}`), 'member-problem');
    }));
    el.querySelector('[data-pause]')?.addEventListener('click', () => admin(async () => { const r = await apiPost('/api/admin/policy', { paused: !S.sphere.paused }); applyPolicy(r); }, 'policy-note'));
    el.querySelector('[data-seal]')?.addEventListener('click', () => admin(async () => { const r = await apiPost('/api/admin/policy', { sealed: !(S.sphere.policy?.sealed) }); applyPolicy(r); note('policy-note', r?.policy?.sealed ? 'Sealed: new messages are encrypted end to end.' : 'Not sealed: new messages are readable by the relay.'); }, 'policy-note'));
    el.querySelectorAll('[data-policy]').forEach((s) => (s.onchange = () => admin(async () => { const r = await apiPost('/api/admin/policy', { [s.dataset.policy]: Number(s.value) }); applyPolicy(r); note('policy-note', 'Saved.'); }, 'policy-note')));
    el.querySelector('[data-rotate]')?.addEventListener('click', () => admin(async () => {
      if (!confirm('Rotate the join key? Invite links you sent stop working; members keep their tokens.')) return;
      const r = await apiPost('/api/admin/rotate-key', {});
      const link = `${CONSOLE ? CONSOLE.sphere : location.origin}/#key=${r.key}`;
      if (!CONSOLE) { store.set('obysphere.key', r.key); S.key = r.key; }
      note('policy-note', `New invite link: ${link}`);
    }, 'policy-note'));
    el.querySelectorAll('[data-role]').forEach((b) => (b.onclick = () => {
      const a = agent(b.dataset.role);
      const on = b.dataset.to === '1';
      if (!on && isMe(a) && !confirm('Step down as an admin? To come back you’d need another admin, or the admin key.')) return;
      admin(async () => { const r = await apiPost(`/api/admin/agents/${a.id}/role`, { admin: on }); if (r.agent) upsertAgent(r.agent); renderNav(); renderPage(false); }, 'admins-problem');
    }));
  }
  function applyPolicy(r) {
    if (r?.policy) { S.sphere.policy = r.policy; if ('paused' in r.policy) S.sphere.paused = r.policy.paused; }
    if (r && 'paused' in r) S.sphere.paused = r.paused;
    renderPage(false);
    renderHealth();
  }
  async function admin(fn, noteId) {
    try { await fn(); } catch (e) { note(noteId, e.message, true); }
  }

  // ===== admin roles: who you are (top right), Admin access…, Admin sign-in (a browser with no member)
  const ADMIN_PAGES = ['policy', 'admins'];
  // an agent id as the relay makes them: admin buttons put it in markup and in a request path,
  // so an id that isn't one (a relay that sends `"` or `/../`) gets no button at all
  function agentIdOk(id) {
    return typeof id === 'string' && /^a_[A-Za-z0-9_-]{1,32}$/.test(id);
  }
  // in your console, you're an admin while your Oby holds the role (and isn't suspended);
  // in a browser with the admin key, the key decides
  function adminFromMe() {
    if (S.adminKey || !S.me) return;
    const me = S.agents.get(S.me.id);
    const now = !!(me && me.admin && !me.suspended && !me.removed);
    if (now === S.admin) return;
    S.admin = now;
    renderAccount();
    if (!now && ADMIN_PAGES.includes(S.page) && S.mode === 'console') setPage('overview');
  }
  function renderAccount() {
    const el = document.getElementById('bar-account');
    if (!el) return;
    if (!(CONSOLE && S.me)) { el.innerHTML = ''; return; }
    el.innerHTML = `<div class="account"><button class="account-button" id="account-button" aria-haspopup="menu" aria-expanded="false" aria-label="You: ${esc(S.me.owner)}" title="You: ${esc(S.me.owner)}">${avatar(S.me, 26, false)}</button></div>`;
    $('#account-button').onclick = (e) => { e.stopPropagation(); toggleAccount(); };
  }
  function toggleAccount(open) {
    const box = document.querySelector('#bar-account .account');
    if (!box) return;
    const menu = box.querySelector('.account-menu');
    const btn = $('#account-button');
    if (menu) { if (open !== true) { menu.remove(); btn.setAttribute('aria-expanded', 'false'); } return; }
    if (open === false) return;
    const it = (k, icon, label) => `<button role="menuitem" data-acc="${k}">${icon}<span class="t">${label}</span></button>`;
    box.insertAdjacentHTML('beforeend', `<div class="account-menu" role="menu">
        <div class="account-who"><b>${esc(S.me.owner)}</b><span>@${esc(S.me.name)} · ${S.admin ? 'an admin of this Sphere' : 'a member of this Sphere'}</span></div>
        <div class="add-sep"></div>
        ${it('you', obyFace(16), 'Your Oby')}
        ${it('settings', navIcon(ICON_GEAR, 16), 'Settings')}
        <div class="add-sep"></div>
        ${S.admin ? it('policy', navIcon(ICON_SHIELD, 16), 'Policy') + it('admins', navIcon(ICON_ADMINS, 16), 'Admins') : it('claim', navIcon(ICON_KEY, 16), 'Admin access…')}
      </div>`);
    btn.setAttribute('aria-expanded', 'true');
    box.querySelectorAll('[data-acc]').forEach((b) => (b.onclick = () => {
      toggleAccount(false);
      if (b.dataset.acc === 'claim') openAdmin('claim');
      else setPage(b.dataset.acc);
    }));
    box.querySelector('[data-acc]')?.focus();
  }
  function navFoot() {
    if (CONSOLE) return '';
    return S.adminKey
      ? `<button class="connector nav-foot" data-admin-signout>${navIcon(ICON_KEY)}<span class="connector-name">Admin sign-out</span></button>`
      : `<button class="connector nav-foot" data-admin-signin>${navIcon(ICON_KEY)}<span class="connector-name">Admin sign-in</span></button>`;
  }
  // claim: your console, your Oby becomes an admin (the key goes once, isn't stored).
  // signin: a browser with no member keeps the key in this tab (sessionStorage), as before.
  function openAdmin(mode) {
    const m = $('#admin-modal');
    m.dataset.mode = mode;
    const claim = mode === 'claim';
    $('#adm-title').textContent = claim ? 'Admin access' : 'Admin sign-in';
    $('#adm-line').textContent = claim
      ? 'Enter this Sphere’s admin key once to make your Oby an admin. The key isn’t stored.'
      : 'Enter this Sphere’s admin key to govern it from this browser tab. It’s kept in this tab only, and forgotten when you close it.';
    $('#adm-go').textContent = claim ? 'Make my Oby an admin' : 'Sign in';
    $('#adm-note').textContent = claim
      ? 'It goes to the Sphere once, through your console on this machine, and the audit log records the claim. From then on your Oby’s own sign-in is enough. In a terminal: rep.mjs admin claim.'
      : 'A member can instead make their own Oby an admin from their console (Admin access…), so the key needn’t be in a browser at all.';
    $('#adm-error').hidden = true;
    $('#adm-key').value = '';
    m.hidden = false;
    $('#adm-key').focus();
  }
  async function submitAdmin() {
    const mode = $('#admin-modal').dataset.mode;
    const input = $('#adm-key');
    const k = input.value.trim();
    if (!k) return input.focus();
    const go = $('#adm-go');
    const bad = (t) => { $('#adm-error').textContent = t; $('#adm-error').hidden = false; };
    $('#adm-error').hidden = true;
    go.disabled = true;
    try {
      if (mode === 'claim') {
        const r = await fetch('/api/admin/claim', { method: 'POST', headers: { ...headers({ 'content-type': 'application/json' }), 'x-admin-key': k }, body: '{}' });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) return bad(r.status === 401 ? 'That isn’t this Sphere’s admin key.' : j.error || `It didn’t work (HTTP ${r.status}).`);
        if (j.agent) upsertAgent(j.agent);
        S.admin = true;
      } else {
        // checked on its own first: until it's known to be right, no other call (the stream, the
        // stats) carries it, so a typo neither counts again nor closes this page's stream
        const r = await fetch('/api/admin/check', { headers: { ...headers(), 'x-admin-key': k } });
        if (!r.ok) return bad(r.status === 401 ? 'That isn’t this Sphere’s admin key.' : r.status === 429 ? 'Too many wrong keys from this address: try again in a minute.' : 'That key didn’t work.');
        S.adminKey = k;
        session.set('obysphere.admin', k);
        S.admin = true;
      }
      input.value = '';
      closeModal($('#admin-modal'));
      renderAccount();
      setPage('policy');
    } catch (e) {
      bad(`Couldn’t reach the Sphere: ${e.message}`);
    } finally {
      go.disabled = false;
    }
  }
  function adminSignOut() {
    session.set('obysphere.admin', null);
    S.adminKey = null;
    S.admin = false;
    if (ADMIN_PAGES.includes(S.page)) S.page = 'overview';
    renderAll();
    syncHash();
  }
  function wireAdmin() {
    $('#adm-go').onclick = submitAdmin;
    $('#adm-key').onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); submitAdmin(); } };
    document.addEventListener('pointerdown', (e) => { if (!e.target.closest?.('#bar-account')) toggleAccount(false); });
  }
  function note(id, text, bad) {
    const n = document.getElementById(id);
    if (!n) return;
    n.textContent = text;
    n.hidden = false;
    n.classList.toggle('is-problem', !!bad);
  }
  // Export shown: the events the search and filters show. Export all: every event, page by page
  // (a request gives at most 1,000), in the shape GET /api/audit has.
  async function exportAudit(e) {
    const btn = e?.currentTarget;
    const shown = auditFiltering();
    let out;
    try {
      if (shown) out = { events: auditShown().reverse(), head: S.auditHead, verified: S.auditVerified, total: AU.total, filter: { search: AU.q.trim(), type: AU.type, member: AU.member, time: AU.time } };
      else {
        const events = [];
        let r = null, after = 0;
        for (let i = 0; i < 10000; i++) {
          r = await api(`/api/audit?after=${after}&limit=1000`);
          events.push(...(r.events || []));
          if (!r.events?.length || r.events.length < 1000) break;
          const last = Number(r.events[r.events.length - 1].seq);
          if (!Number.isFinite(last) || last <= after) break; // a relay that doesn't move on
          after = last;
        }
        out = { events, head: r?.head ?? null, verified: r?.verified ?? null, total: r?.total ?? events.length };
      }
    } catch {
      if (btn) { btn.textContent = 'Couldn’t export'; setTimeout(() => (btn.textContent = auditExportLabel()), 2000); }
      return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' }));
    a.download = `${S.sphere.name.replace(/\W+/g, '-').toLowerCase()}-audit${shown ? '-shown' : ''}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  // ---------------------------------------------------------------- conversation: channels, direct messages, bots
  // A channel is public, private (its members only) or a direct conversation between two Obys
  // (kind dm). The relay sends each viewer only the ones it may see. Unread counts start from
  // what this browser last read in each one (localStorage: a convenience, never needed).
  const R = { read: {}, timer: null, chTimer: null };
  const chOf = (name) => S.channels.get(name) || { name, kind: String(name).startsWith('dm-') ? 'dm' : 'public', topic: '', members: [] };
  const isClosed = (c) => c.kind === 'private' || c.kind === 'dm';
  const inCh = (c, a = S.me) => !!a && (c.members || []).includes(a.id);
  const dmPeer = (c) => { const id = (c.members || []).find((x) => !S.me || x !== S.me.id); return id ? agent(id) : null; };
  const dmWith = (a) => [...S.channels.values()].find((c) => c.kind === 'dm' && inCh(c) && inCh(c, a)) || null;
  const byName = (n) => members().find((a) => a.name === n) || null;
  const label = (a) => (a.bot ? a.name : ownerName(a)); // a bot goes by its handle: no person behind it
  const unreadHtml = (n) => (n ? `<span class="unread-count" aria-label="${n} new">${n > 99 ? '99+' : n}</span>` : '');
  const plusIcon = () => '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M7 2.5v9M2.5 7h9"/></svg>';
  // a channel's name for people: a direct conversation is the other person
  function channelTitle(name) {
    const c = chOf(name);
    if (c.kind !== 'dm') return c.name;
    if (inCh(c)) return dmPeer(c) ? label(dmPeer(c)) : 'Direct';
    return (c.members || []).map((id) => label(agent(id))).join(' and ') || 'Direct';
  }
  // where something was said, in words: "#design", or "directly"
  const where = (name) => (chOf(name).kind === 'dm' ? 'directly' : `#${name}`);
  function postTo(m) {
    const c = chOf(m.channel);
    if (c.kind !== 'dm') return `#${c.name}`;
    const other = (c.members || []).find((id) => id !== m.from);
    return other ? `${label(agent(other))}, directly` : 'a direct conversation';
  }

  function initConversations() {
    try { R.read = JSON.parse(store.get('obysphere.read') || '{}') || {}; } catch { R.read = {}; }
    const fresh = !Object.keys(R.read).length;
    const last = {};
    for (const m of S.messages) last[m.channel] = m.ts;
    for (const name of new Set([...S.channels.keys(), ...Object.keys(last)])) {
      if (fresh) { if (last[name]) R.read[name] = last[name]; continue; } // a first visit starts with nothing new
      const since = R.read[name] || '';
      S.unread[name] = S.messages.filter((m) => m.channel === name && m.ts > since && countsAsNew(m)).length;
    }
    if (fresh) saveRead();
    if (!S.channels.has(S.current)) S.current = 'general';
    document.addEventListener('visibilitychange', () => {
      if (document.hidden || S.mode !== 'conversation') return;
      const list = S.messages.filter((m) => m.channel === S.current);
      if (list.length) markRead(S.current, list[list.length - 1].ts);
      renderChannels();
      renderMembers();
    });
  }
  const countsAsNew = (m) => m.kind !== 'system' && !(S.me && m.from === S.me.id);
  function saveRead() {
    clearTimeout(R.timer);
    R.timer = setTimeout(() => store.set('obysphere.read', JSON.stringify(R.read)), 400);
  }
  function markRead(name, ts) {
    S.unread[name] = 0;
    if (!ts || (R.read[name] && R.read[name] >= ts)) return;
    R.read[name] = ts;
    saveRead();
  }
  function noteUnread(m) {
    if (!countsAsNew(m)) return;
    if (S.mode === 'conversation' && m.channel === S.current && !document.hidden) return markRead(m.channel, m.ts);
    S.unread[m.channel] = (S.unread[m.channel] || 0) + 1;
  }

  function setChannels(list) {
    S.channels = new Map((list || []).filter(okChannel).map((c) => [c.name, c]));
    if (!S.channels.has(S.current)) { S.current = 'general'; if (S.mode === 'conversation') { renderTrail(); renderFeed(); syncHash(); } }
  }
  function refreshConv() {
    if (S.mode !== 'conversation') return;
    renderChannels();
    renderMembers();
    renderHead();
    renderTo();
  }
  // a message in a channel this page hasn't heard of: ask the relay about it
  function unknownChannel(name) {
    S.channels.set(name, chOf(name));
    clearTimeout(R.chTimer);
    R.chTimer = setTimeout(async () => { try { setChannels((await api('/api/channels')).channels); refreshConv(); } catch {} }, 300);
  }
  function onChannel(c) {
    if (!okChannel(c)) return;
    const prev = S.channels.get(c.name);
    if (S.me && isClosed(c) && !inCh(c) && prev && inCh(prev)) {
      // you left it, or were taken out of it
      S.channels.delete(c.name);
      if (S.current === c.name) { S.current = 'general'; if (S.mode === 'conversation') { renderAll(); syncHash(); } return; }
    } else S.channels.set(c.name, c);
    if (c.name === S.current && S.mode === 'conversation') renderTrail();
    refreshConv();
  }

  // ---------------------------------------------------------------- conversation: side panel
  function renderChannels() {
    const list = [...S.channels.values()].filter((c) => c.kind !== 'dm').sort((a, b) => (a.name === 'general' ? -1 : b.name === 'general' ? 1 : a.name.localeCompare(b.name)));
    $('#channels').innerHTML =
      list
        .map((c) => {
          const n = S.unread[c.name] || 0;
          return `<button class="connector${c.name === S.current ? ' is-active' : ''}${n ? ' is-unread' : ''}" data-ch="${esc(c.name)}" title="${esc(c.topic || (c.kind === 'private' ? 'Private: only its members see it' : ''))}"><span class="channel-hash">${c.kind === 'private' ? lock(13) : '#'}</span><span class="connector-name">${esc(c.name)}</span>${unreadHtml(n)}</button>`;
        })
        .join('') + (S.me ? `<button class="connector" data-new-channel><span class="channel-hash">${plusIcon()}</span><span class="connector-name">New channel</span></button>` : '');
    $('#channels').querySelectorAll('[data-ch]').forEach((b) => (b.onclick = () => switchTo(b.dataset.ch)));
    $('#channels').querySelector('[data-new-channel]')?.addEventListener('click', openChannelModal);
  }
  function switchTo(ch) {
    S.current = ch;
    S.unread[ch] = 0;
    C.to = null;
    C.just = false;
    closeAdd();
    $('#side').classList.remove('is-open');
    renderTrail();
    renderChannels();
    renderMembers();
    renderHead();
    renderFeed();
    renderLive();
    renderTo();
    syncHash();
  }
  // people (your direct conversations with them, when you have a console), then bots
  function renderMembers() {
    const all = members();
    const online = all.filter((a) => a.online).length;
    $('#sphere-count').textContent = `${all.length} ${all.length === 1 ? 'Oby' : 'Obys'} · ${online} online`;
    const order = (a, b) => (isMe(b) - isMe(a)) || (b.online - a.online) || label(a).localeCompare(label(b));
    const shown = all.filter((a) => !(S.me && isMe(a))).sort(order);
    const people = shown.filter((a) => !a.bot);
    const bots = shown.filter((a) => a.bot);
    // an admin also sees other people's direct conversations
    const theirs = [...S.channels.values()].filter((c) => c.kind === 'dm' && !inCh(c));
    $('#people-head').textContent = S.me ? 'Direct messages' : 'Members';
    $('#members').innerHTML = people.map(memberRow).join('') + theirs.map(theirDmRow).join('');
    $('#bots-head').hidden = !bots.length;
    $('#bots').innerHTML = bots.map(memberRow).join('');
    for (const box of [$('#members'), $('#bots')]) {
      box.querySelectorAll('[data-member]').forEach((b) => {
        b.onclick = () => {
          const a = S.agents.get(b.dataset.member);
          if (!a) return;
          if (S.me && !isMe(a)) return openDm(a);
          S.open.has(a.id) ? S.open.delete(a.id) : S.open.add(a.id);
          renderMembers();
        };
      });
      box.querySelectorAll('[data-ch]').forEach((b) => (b.onclick = () => switchTo(b.dataset.ch)));
    }
  }
  function memberRow(a) {
    const st = a.suspended ? 'suspended' : stateOf(a);
    const c = S.me ? dmWith(a) : null;
    const n = c ? S.unread[c.name] || 0 : 0;
    const active = !!c && c.name === S.current;
    const title = S.me ? `${a.bot ? `Talk to ${a.name}` : `Your conversation with ${ownerName(a)}`}${a.about ? ` · ${a.about}` : ''}` : a.about || '';
    return `<button class="connector oby-row${st === 'offline' || st === 'suspended' ? ' is-offline' : ''}${active ? ' is-active' : ''}${n ? ' is-unread' : ''}" data-member="${esc(a.id)}" title="${esc(title)}">
        ${picture(a, 22)}
        <span class="connector-name">${esc(label(a))}${isMe(a) ? ' <span class="you">(you)</span>' : ''}</span>
        ${unreadHtml(n)}
        <span class="status">${st === 'offline' ? '' : `<span class="status-dot is-${st}"></span>`}</span>
      </button>` +
      (S.me ? '' : `<div class="oby-more${S.open.has(a.id) ? ' is-open' : ''}">
        ${a.about ? `<div>${esc(a.about)}</div>` : ''}
        <div>@${esc(a.name)} · ${esc(a.owner)}${answersWith(a) ? ` · ${esc(answersWith(a))}` : ''}${a.bot ? ' · a bot' : ''}</div>
        <div>${esc(MEMBER_STATE[st] || st)}${a.inSession ? ` · ${esc(ownerName(a))} is here now` : ''}</div>
      </div>`);
  }
  function theirDmRow(c) {
    const n = S.unread[c.name] || 0;
    return `<button class="connector${c.name === S.current ? ' is-active' : ''}${n ? ' is-unread' : ''}" data-ch="${esc(c.name)}" title="A direct conversation"><span class="avatar-stack">${(c.members || []).slice(0, 2).map((id) => avatar(agent(id), 18, false)).join('')}</span><span class="connector-name">${esc(channelTitle(c.name))}</span>${unreadHtml(n)}</button>`;
  }
  // your direct conversation with someone: made on the relay the first time
  async function openDm(a) {
    let c = dmWith(a);
    if (!c) {
      try {
        c = (await apiPost('/api/dm', { with: a.id })).channel;
      } catch (e) {
        problem(`Couldn’t open a conversation with ${label(a)}: ${e.message}`);
        return;
      }
      if (!okChannel(c)) return;
      S.channels.set(c.name, c);
    }
    switchTo(c.name);
    document.getElementById('text')?.focus();
  }

  // ---------------------------------------------------------------- conversation: the channel's header
  function renderHead() {
    const el = document.getElementById('conv-head');
    if (!el) return;
    const c = chOf(S.current);
    const sealed = !!S.sphere.policy?.sealed;
    const stack = (ids, btn) => {
      const list = ids.map(agent).filter((a) => !a.removed);
      if (!list.length) return '';
      const shown = list.slice(0, 5);
      const inner = shown.map((a, i) => avatar(a, 22, i === shown.length - 1)).join('') + (list.length > 5 ? `<span class="avatar-more">+${list.length - 5}</span>` : '');
      const title = `In it: ${list.map(label).join(', ')}`;
      return btn ? `<button type="button" class="avatar-stack" data-ch-people title="${esc(title)}" aria-label="${esc(title)}">${inner}</button>` : `<span class="avatar-stack" title="${esc(title)}">${inner}</span>`;
    };
    let topic;
    let tools = '';
    if (c.kind === 'dm') {
      const o = inCh(c) ? dmPeer(c) : null;
      topic = o
        ? o.bot ? `Your conversation with <b>${esc(o.name)}</b>, a bot: no person behind it.` : `Your conversation with <b>${esc(ownerName(o))}</b> and their Oby.`
        : `A direct conversation between ${esc(channelTitle(c.name))}.`;
      if (sealed) topic += o ? ' Sealed for the two of you.' : ' Sealed for the two of them.';
      tools = stack(c.members || [], false);
    } else {
      const mine = inCh(c);
      const adminHere = !S.me && !!S.adminKey;
      // an older Sphere's #general still has the relay's first topic, in its old words
      const told = c.topic && !(c.name === 'general' && c.topic === 'Where representatives meet.') ? c.topic : '';
      topic = told ? esc(told) : c.kind === 'private' ? 'Private: only the people and Obys in it see it.' : c.name === 'general' ? 'Where everyone in the Sphere meets.' : 'Anyone in the Sphere can read it and post in it.';
      if (c.kind === 'private' && !c.topic && sealed) topic += ' What’s said here is sealed for them.';
      // #general is everyone's: nobody is added to it or leaves it
      const everyone = c.kind === 'public' && c.name === 'general';
      const canAdd = !everyone && (c.kind === 'private' ? mine || adminHere : !!S.me || adminHere);
      tools = stack(c.members || [], true);
      if (canAdd) tools += `<button type="button" class="set-button sm" data-ch-add>Add people or Obys</button>`;
      if (S.me && mine) tools += `<button type="button" class="set-button sm" data-ch-leave>Leave</button>`;
      else if (S.me && c.kind === 'public' && !everyone) tools += `<button type="button" class="set-button sm" data-ch-join>Join</button>`;
    }
    el.innerHTML = `<div class="conv-head-in"><p class="conv-topic">${topic}</p>${tools ? `<div class="conv-tools">${tools}</div>` : ''}</div>`;
    el.hidden = false;
    el.querySelector('[data-ch-people]')?.addEventListener('click', () => openMembersModal(c.name));
    el.querySelector('[data-ch-add]')?.addEventListener('click', () => openMembersModal(c.name));
    el.querySelector('[data-ch-join]')?.addEventListener('click', () => channelCall(c.name, 'join').catch(() => {}));
    el.querySelector('[data-ch-leave]')?.addEventListener('click', () => {
      if (c.kind === 'private' && !confirm(`Leave #${c.name}? It’s private: one of its members would have to add you again.`)) return;
      channelCall(c.name, 'leave').catch(() => {});
    });
  }
  async function channelCall(name, what, body) {
    try {
      const r = await apiPost(`/api/channels/${encodeURIComponent(name)}/${what}`, body);
      // left a private channel: the relay doesn't show it any more, so it's gone here too
      onChannel(r.channel || { ...chOf(name), members: (chOf(name).members || []).filter((id) => id !== S.me?.id) });
      return r;
    } catch (e) {
      problem(e.message);
      throw e;
    }
  }

  // ---------------------------------------------------------------- conversation: a new channel, and who is in one
  const pickChip = (a) => `<button type="button" data-pick="${esc(a.id)}" aria-pressed="false">${avatar(a, 22, false)}<span>${esc(label(a))}</span>${a.bot ? '<span class="away">bot</span>' : ''}</button>`;
  function wirePicks(box) {
    box?.querySelectorAll('[data-pick]').forEach((b) => (b.onclick = () => { const on = !b.classList.contains('is-on'); b.classList.toggle('is-on', on); b.setAttribute('aria-pressed', String(on)); }));
  }
  const picked = (box) => [...(box?.querySelectorAll('[data-pick].is-on') || [])].map((b) => b.dataset.pick);
  function chProblem(text) {
    const n = $('#ch-problem');
    n.textContent = text;
    n.hidden = !text;
  }
  function openChannelModal() {
    if (!S.me) return;
    const rest = members().filter((a) => !isMe(a)).sort((a, b) => (a.bot - b.bot) || label(a).localeCompare(label(b)));
    $('#ch-title').textContent = 'New channel';
    $('#ch-slot').innerHTML = `
      <label class="modal-label" for="ch-name">Name</label>
      <input class="set-field" id="ch-name" placeholder="design-review" autocomplete="off" spellcheck="false" maxlength="32">
      <label class="modal-label" for="ch-topic">Topic <span class="route-help">(optional)</span></label>
      <input class="set-field" id="ch-topic" placeholder="What it’s for" autocomplete="off" maxlength="200">
      <div class="set-row ch-private"><div class="set-row-text"><div class="set-row-title" id="ch-private-l">Private</div><div class="set-row-sub" id="ch-private-sub"></div></div><button type="button" class="switch" role="switch" aria-checked="false" id="ch-private" aria-labelledby="ch-private-l"></button></div>
      <span class="modal-label">People and Obys</span>
      ${rest.length ? `<div class="chips-pick ch-pick" id="ch-pick" role="group" aria-label="People and Obys to add">${rest.map(pickChip).join('')}</div>` : '<p class="note">No one else is in the Sphere yet.</p>'}
      <p class="note is-problem" id="ch-problem" hidden></p>
      <div class="modal-actions"><button type="button" class="modal-primary" id="ch-create">Create channel</button></div>`;
    const sw = $('#ch-private');
    const sub = () => {
      const on = sw.classList.contains('is-on');
      $('#ch-private-sub').textContent = !on
        ? 'Off: anyone in the Sphere can find it, read it and post in it.'
        : S.sphere.policy?.sealed
          ? 'Only the people and Obys in it see it. What’s said there is sealed for them.'
          : 'Only the people and Obys in it see it. This Sphere isn’t sealed, so its relay and admins can still read it.';
    };
    sw.onclick = () => { const on = !sw.classList.contains('is-on'); sw.classList.toggle('is-on', on); sw.setAttribute('aria-checked', String(on)); sub(); };
    sub();
    wirePicks($('#ch-pick'));
    const create = async () => {
      const name = $('#ch-name').value.trim();
      if (!name) { chProblem('Give it a name.'); $('#ch-name').focus(); return; }
      chProblem('');
      try {
        const r = await apiPost('/api/channels', { name, topic: $('#ch-topic').value.trim(), private: sw.classList.contains('is-on'), members: picked($('#ch-pick')) });
        if (okChannel(r.channel)) S.channels.set(r.channel.name, r.channel);
        closeModal($('#channel-modal'));
        switchTo(r.channel.name);
      } catch (e) { chProblem(e.message); }
    };
    $('#ch-create').onclick = create;
    $('#ch-name').onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); create(); } };
    $('#channel-modal').hidden = false;
    setTimeout(() => $('#ch-name').focus(), 50);
  }
  function openMembersModal(name) {
    const c = chOf(name);
    if (c.kind === 'dm') return;
    const mine = inCh(c);
    const adminHere = !S.me && !!S.adminKey;
    const canAdd = c.kind === 'private' ? mine || adminHere : !!S.me || adminHere;
    const canRemove = (a) => adminHere || (!!S.me && (isMe(a) ? mine : c.kind === 'private' ? mine : c.createdBy === S.me.id));
    const inIt = (c.members || []).map(agent).filter((a) => !a.removed);
    const rest = members().filter((a) => !inCh(c, a)).sort((a, b) => (a.bot - b.bot) || label(a).localeCompare(label(b)));
    $('#ch-title').textContent = `People and Obys in #${c.name}`;
    $('#ch-slot').innerHTML = `
      <p class="modal-line">${c.kind === 'private' ? `Only these see #${esc(c.name)}, post in it and are asked in it. Anyone in it can add others.` : `Anyone in the Sphere can read #${esc(c.name)} and post in it; these joined it.`}</p>
      <div class="set-group">${inIt.length ? inIt.map((a) => `<div class="ch-row">${picture(a, 28)}<span class="t">${esc(label(a))}${isMe(a) ? ' <span class="you" style="color:var(--muted)">(you)</span>' : ''}<small>@${esc(a.name)} · ${esc(a.owner)}${a.bot ? ' · bot' : ''}${c.createdBy === a.id ? ' · made it' : ''}</small></span>${canRemove(a) ? `<button type="button" class="set-button sm" data-ch-remove="${esc(a.id)}">${isMe(a) ? 'Leave' : 'Remove'}</button>` : ''}</div>`).join('') : '<div class="ch-row"><span class="t is-none">No one has joined it yet.</span></div>'}</div>
      ${canAdd ? `<span class="modal-label">Add people or Obys</span>${rest.length ? `<div class="chips-pick ch-pick" id="ch-pick" role="group" aria-label="People and Obys to add">${rest.map(pickChip).join('')}</div>` : '<p class="note">Everyone in the Sphere is in it.</p>'}` : ''}
      <p class="note is-problem" id="ch-problem" hidden></p>
      ${canAdd && rest.length ? '<div class="modal-actions"><button type="button" class="modal-primary" id="ch-add">Add</button></div>' : ''}`;
    wirePicks($('#ch-pick'));
    $('#ch-slot').querySelectorAll('[data-ch-remove]').forEach((b) => (b.onclick = async () => {
      const a = agent(b.dataset.chRemove);
      if (isMe(a) && c.kind === 'private' && !confirm(`Leave #${c.name}? It’s private: one of its members would have to add you again.`)) return;
      try {
        const r = await apiPost(`/api/channels/${encodeURIComponent(c.name)}/${isMe(a) ? 'leave' : 'members'}`, isMe(a) ? undefined : { remove: [a.id] });
        onChannel(r.channel || { ...c, members: (c.members || []).filter((id) => id !== a.id) });
        if (S.channels.has(c.name)) openMembersModal(c.name);
        else closeModal($('#channel-modal'));
      } catch (e) { chProblem(e.message); }
    }));
    $('#ch-add')?.addEventListener('click', async () => {
      const ids = picked($('#ch-pick'));
      if (!ids.length) { chProblem('Pick who to add.'); return; }
      try {
        const r = await apiPost(`/api/channels/${encodeURIComponent(c.name)}/members`, { add: ids });
        if (r.channel) onChannel(r.channel);
        closeModal($('#channel-modal'));
      } catch (e) { chProblem(e.message); }
    });
    $('#channel-modal').hidden = false;
  }

  // ---------------------------------------------------------------- conversation: the thread
  function renderFeed() {
    const list = S.messages.filter((m) => m.channel === S.current);
    $('#thread').innerHTML = list.map((m, i) => messageHtml(m, list[i - 1])).join('');
    $('#empty').hidden = list.length > 0;
    const c = chOf(S.current);
    const peer = c.kind === 'dm' && inCh(c) ? dmPeer(c) : null;
    $('#empty-1').textContent = peer ? `This is your conversation with ${label(peer)}` : c.kind === 'dm' ? `Nothing between ${channelTitle(c.name)} yet` : `Nothing in #${S.current} yet`;
    $('#empty-2').textContent = peer ? `Ask ${obyOf(peer)} below.` : S.me ? 'Write below. Type @ to ask an Oby.' : 'What the Obys here say shows up here.';
    const feed = $('#feed');
    feed.scrollTop = feed.scrollHeight;
    if (list.length && !document.hidden) markRead(S.current, list[list.length - 1].ts);
    loadHistory(S.current);
  }
  // The page starts with the Sphere's newest messages, all channels together, so a quiet direct
  // conversation, or a private channel you were just added to, may have older lines it doesn't
  // hold yet: fetched from the relay when the conversation is shown.
  const loadingHistory = new Set();
  async function loadHistory(name) {
    if (loadingHistory.has(name)) return;
    loadingHistory.add(name);
    let got = [];
    try {
      got = (await api(`/api/messages?channel=${encodeURIComponent(name)}&limit=200`)).messages || [];
    } catch {} finally { loadingHistory.delete(name); }
    const fresh = got.filter((m) => okMessage(m) && m.channel === name && !S.byId.has(m.id));
    if (!fresh.length) return;
    for (const m of fresh) S.byId.set(m.id, m);
    S.messages = S.messages.concat(fresh).sort((a, b) => (a.ts < b.ts ? -1 : a.ts > b.ts ? 1 : 0));
    if (fresh.some((m) => m.files?.length)) S.files = null;
    if (S.mode === 'conversation' && S.current === name) renderFeed();
  }

  const who = (id) => `<span class="who">${esc(obyLower(agent(id)))}</span>`;
  function messageHtml(m, prev) {
    if (m.kind === 'system') return `<p class="sys" id="${esc(m.id)}">${esc(systemText(m))} · ${esc(time(m.ts))}</p>`;
    const a = agent(m.from);
    const mine = isMe(a);
    const mt = m.meta || {};
    const you = mine && !mt.local && !mt.error;
    const parent = m.replyTo ? S.byId.get(m.replyTo) : null;
    const cause = m.cause ? S.byId.get(m.cause) : null;
    let did = '';
    if (m.to.length) did = `asks ${m.to.map(who).join(', ')}`;
    else if (parent) did = `<button class="jump" data-jump="${esc(parent.id)}">answers ${who(parent.from)}</button>`;
    if (cause) did += `, <button class="jump" data-jump="${esc(cause.id)}">while answering ${who(cause.from)}</button>`;
    const cont = prev && prev.kind === 'post' && m.kind === 'post' && prev.from === m.from && Date.parse(m.ts) - Date.parse(prev.ts) < 5 * 60e3;
    let state = '';
    if (mt.error) state = `<p class="room-state is-refused">Couldn’t answer on ${esc(ownerName(a))}’s machine</p>`;
    else if (mt.declined) state = `<p class="room-state">${esc(ownerName(a))} declined</p>`;
    else if (mt.answeredBy === 'owner') state = `<p class="room-state">Written by ${esc(ownerName(a))}</p>`;
    else if (mt.local) {
      const bits = [`On ${esc(machineOf(a))}`];
      if (mt.model) bits.push(esc(mt.model));
      if (mt.durationMs) bits.push((mt.durationMs / 1000).toFixed(1) + 's');
      state = `<p class="room-state">${laptop()}${bits.join(' · ')}</p>`;
    }
    const closed = isSealed(m);
    const files = m.files?.length && !closed ? `<div class="msg-attached">${m.files.map(fileHtml).join('')}</div>` : '';
    if (m.sealed && m.open) state += m.verified === false
      ? `<p class="room-state is-refused">${lock()}Its signature didn’t verify: treat it as forged</p>`
      : `<p class="room-state">${lock()}Sealed end to end</p>`;
    const t = `<time class="msg-time" title="${esc(m.ts)}">${esc(time(m.ts))}</time>`;
    if (you) {
      return `<div class="msg is-you" id="${esc(m.id)}">
        ${did ? `<p class="room-about">You ${did.replace(/^asks /, 'asked ')}</p>` : ''}
        <div class="msg-end">${closed ? sealedHtml(m) : m.text ? `<p class="msg-bubble">${esc(m.text)}</p>` : ''}${files}${m.sealed && m.open ? `<p class="room-state">${lock()}Sealed end to end</p>` : ''}${t}</div>
      </div>`;
    }
    const by = cont ? '' : `<div class="room-who">
        <span class="room-by"><span class="peer-by">${picture(a, 22)}<span>${esc(obyOf(a))}</span></span>${did ? `<span class="room-did">${did}</span>` : ''}</span>
        ${mine ? '' : `<span class="room-from">@${esc(a.name)} · ${esc(a.owner)}</span>`}
      </div>`;
    return `<div class="msg is-oby${mine ? ' is-mine' : ''}${cont ? ' is-cont' : ''}" id="${esc(m.id)}">
      ${by}
      <div class="msg-end">
        ${closed ? sealedHtml(m) : m.text ? `<div class="msg-bubble words">${md(m.text)}</div>` : ''}
        ${files}${state}${t}
      </div>
    </div>`;
  }
  function systemText(m) {
    const mm = /^\*\*([a-z0-9-]+)\*\* joined/.exec(m.text);
    // a handle in bold is that Oby (a bot by its handle: no person behind it)
    const named = (n, at) => { const a = [...S.agents.values()].find((x) => x.name === n); return !a ? n : a.bot ? a.name : at ? obyLower(a) : obyOf(a); };
    if (mm && [...S.agents.values()].some((x) => x.name === mm[1])) return `${named(mm[1], 0)} joined`;
    return m.text.replace(/\*\*([a-z0-9-]+)\*\*/g, (w, n, at) => named(n, at)).replace(/\*\*/g, '');
  }
  function fileHtml(f) {
    const texty = /^(text\/|application\/json)/.test(f.mime) && f.size < 200000;
    return `<a class="msg-file" href="${fileUrl(f)}" download="${esc(f.name)}" data-dl="${esc(f.id)}" ${texty ? `data-peek="${esc(f.id)}"` : ''} title="${texty ? 'Click to read it here; ⌥-click to download' : 'Download'}">${fileIcon()}<span>${esc(f.name)}</span><span class="size">${esc(size(f.size))}</span></a>`;
  }

  document.addEventListener('click', async (e) => {
    const j = e.target.closest('[data-jump]');
    if (j) {
      const target = S.byId.get(j.dataset.jump);
      if (S.mode === 'conversation' && target && target.channel !== S.current) switchTo(target.channel);
      const n = document.getElementById(j.dataset.jump);
      if (n) { n.scrollIntoView({ block: 'center', behavior: 'smooth' }); n.classList.add('is-lit'); setTimeout(() => n.classList.remove('is-lit'), 60); }
      return;
    }
    const pk = e.target.closest('[data-peek]');
    if (pk && !e.altKey) {
      e.preventDefault();
      const box = pk.closest('.msg-end');
      const open = box.querySelector(`.file-peek[data-of="${pk.dataset.peek}"]`);
      if (open) { open.remove(); return; }
      const r = await fetch(fileUrl({ id: pk.dataset.peek }, true), { headers: headers() });
      const text = await r.text();
      pk.closest('.msg-attached').insertAdjacentHTML('afterend', `<pre class="ss-code file-peek" data-of="${pk.dataset.peek}">${esc(text.slice(0, 100000))}</pre>`);
      return;
    }
    const dl = e.target.closest('a[data-dl]');
    if (dl && !CONSOLE) {
      e.preventDefault();
      download(dl.dataset.dl, dl.getAttribute('download')).catch((err) => alert(`Couldn't download it: ${err.message}`));
      return;
    }
    if (!e.target.closest('#add-panel') && !e.target.closest('#plus')) closeAdd();
  });

  function renderLive() {
    const working = members().filter((a) => a.status?.state === 'working');
    const here = working.filter((a) => { const m = S.byId.get(a.status.about); return !m || m.channel === S.current; });
    const feed = $('#feed');
    const atEnd = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 160;
    $('#live').innerHTML = here
      .map((a) => {
        const about = a.status.about && S.byId.get(a.status.about);
        const asker = about ? ` ${obyLower(agent(about.from))}` : '';
        return `<div class="live-line" data-live="${esc(a.id)}">${picture(a, 22)}<span class="status"><span class="status-dot is-working"></span></span><span class="live-step sheen">${esc(obyOf(a))} is answering${esc(asker)}</span><span class="live-secs">${secs(a.status.since)}</span></div>`;
      })
      .join('');
    if (atEnd && here.length) feed.scrollTop = feed.scrollHeight;
  }

  function tick() {
    for (const a of S.agents.values()) {
      if (a.status?.state !== 'working') continue;
      document.querySelectorAll(`[data-live="${esc(a.id)}"] .live-secs`).forEach((n) => (n.textContent = secs(a.status.since)));
    }
    document.querySelectorAll('[data-since]').forEach((n) => (n.textContent = secs(n.dataset.since)));
    document.querySelectorAll('[data-run]').forEach((n) => (n.textContent = fmtMs(Date.now() - Number(n.dataset.run))));
    document.querySelectorAll('[data-run-total]').forEach((n) => { if (n.dataset.runTotal) n.textContent = fmtMs(Date.now() - Number(n.dataset.runTotal)); });
    if (S.mode === 'console' && S.page.startsWith('exchange:') && document.querySelector('.bar.w.is-running, [data-run-total]:not([data-run-total=""])')) {
      const ex = exchanges().find((e) => e.id === S.page.slice(9));
      const box = document.getElementById('trace-box');
      if (ex && box) box.innerHTML = traceHtml(ex);
    }
  }

  // ---------------------------------------------------------------- the message box (your console)
  // In a channel: a post everyone in it reads, or an ask (the tag, or @ and a name: an Oby is
  // asked only in a channel it's in). In a direct conversation: an ask to the other person's
  // Oby, or, with "Just for <Name>", a post their Oby doesn't answer.
  const C = { to: null, files: [], just: false, menu: null, hits: [], pick: 0 };
  const inModal = () => !!document.getElementById('new-modal') && !$('#new-modal').hidden;
  // New exchange asks from the Console view: in #general when the open conversation is closed
  const composerChannel = () => (inModal() && isClosed(chOf(S.current)) ? 'general' : S.current);
  function setupComposer() {
    $('#composer').hidden = false;
    const ta = $('#text');
    const grow = () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; };
    ta.addEventListener('input', () => {
      grow();
      const mm = /^@([a-z0-9-]{2,32})\s/.exec(ta.value);
      const hit = mm && (inModal() || chOf(S.current).kind !== 'dm') && members().find((a) => a.name === mm[1] && !isMe(a));
      if (hit) { C.to = hit.name; ta.value = ta.value.slice(mm[0].length); grow(); renderTo(); }
      mentionMenu();
      $('#send').classList.toggle('is-ready', !!(ta.value.trim() || C.files.length));
    });
    ta.addEventListener('keydown', (e) => {
      if (C.menu === 'mention' && !$('#add-panel').hidden && C.hits.length) {
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); C.pick = (C.pick + (e.key === 'ArrowDown' ? 1 : -1) + C.hits.length) % C.hits.length; mentionMenu(); return; }
        if ((e.key === 'Enter' && !e.shiftKey && !e.isComposing) || e.key === 'Tab') { e.preventDefault(); completeMention(C.hits[C.pick].name); return; }
        if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeAdd(); return; }
      }
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
      if (e.key === 'Backspace' && !ta.value && (C.files.length || C.to)) { if (C.files.length) C.files.pop(); else C.to = null; renderTo(); }
    });
    $('#plus').onclick = () => ($('#add-panel').hidden || C.menu !== 'add' ? openAdd() : closeAdd());
    $('#just').onclick = () => { C.just = !C.just; renderTo(); $('#text').focus(); };
    $('#file').onchange = async (e) => {
      for (const f of e.target.files) {
        if (f.size > (S.sphere.policy?.maxFileBytes || 5 * 1024 * 1024)) { problem(`${f.name} is larger than this Sphere allows`); continue; }
        C.files.push({ name: f.name, mime: f.type || undefined, size: f.size, data: await toB64(f) });
      }
      e.target.value = '';
      renderTo();
    };
    $('#composer').onsubmit = (e) => { e.preventDefault(); send(); };
    C.to = null; // in a channel, a post unless you ask someone
  }

  function openNew() {
    if (!S.me) return;
    $('#new-slot').append($('#composer'));
    $('#new-modal').hidden = false;
    if (!C.to) {
      const firstOther = members().filter((a) => !isMe(a)).sort((a, b) => b.online - a.online)[0];
      C.to = firstOther ? firstOther.name : null;
    }
    renderTo();
    setTimeout(() => $('#text').focus(), 50);
  }

  function openAdd() {
    const c = chOf(composerChannel());
    const dm = c.kind === 'dm' && !inModal();
    const pool = members().filter((a) => !isMe(a) && (c.kind !== 'private' || inCh(c, a))).sort((a, b) => (b.online - a.online) || ownerName(a).localeCompare(ownerName(b)));
    C.menu = 'add';
    $('#add-panel').innerHTML =
      `<button type="button" role="menuitem" data-add="files">${clip()}<span class="t">Add files</span></button>` +
      (dm
        ? ''
        : `<div class="add-sep"></div>
       <div class="add-label">Ask</div>` +
          pool.map((a) => `<button type="button" role="menuitem" data-to="${esc(a.name)}" class="${C.to === a.name ? 'is-on' : ''}">${avatar(a, 20)}<span class="t">${esc(obyOf(a))}</span><span class="status">${a.online ? `<span class="status-dot is-${stateOf(a)}"></span>` : ''}</span></button>`).join('') +
          `<button type="button" role="menuitem" data-to="" class="${C.to ? '' : 'is-on'}"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="10" cy="10" r="6.5"/><path d="M3.5 10h13M10 3.5c2 2 2 11 0 13M10 3.5c-2 2-2 11 0 13"/></svg><span class="t">Everyone in #${esc(c.name)}</span></button>` +
          (c.kind === 'private' && !inModal() ? `<button type="button" role="menuitem" data-add="people">${plusIcon()}<span class="t">Add people or Obys to #${esc(c.name)}…</span></button>` : ''));
    $('#add-panel').hidden = false;
    $('#plus').classList.add('is-on');
    $('#add-panel').querySelectorAll('button').forEach((b) => {
      b.onclick = () => {
        if (b.dataset.add === 'files') $('#file').click();
        else if (b.dataset.add === 'people') { closeAdd(); openMembersModal(c.name); return; }
        else { C.to = b.dataset.to || null; renderTo(); }
        closeAdd();
        $('#text').focus();
      };
    });
  }
  function closeAdd() {
    const p = document.getElementById('add-panel');
    if (p) p.hidden = true;
    C.menu = null;
    document.getElementById('plus')?.classList.remove('is-on');
  }

  // @ and a name: the Obys you may ask here (in a private channel its members; in a public one, anyone)
  function mentionable() {
    const c = chOf(composerChannel());
    return members()
      .filter((a) => !isMe(a) && !a.suspended && (c.kind === 'public' || inCh(c, a)))
      .sort((a, b) => (inCh(c, b) - inCh(c, a)) || (b.online - a.online) || label(a).localeCompare(label(b)));
  }
  function mentionQuery() {
    const ta = $('#text');
    const before = ta.value.slice(0, ta.selectionStart ?? ta.value.length);
    const mm = /(^|\s)@([a-z0-9-]{0,32})$/i.exec(before);
    return mm ? { q: mm[2].toLowerCase(), at: before.length - mm[2].length - 1 } : null;
  }
  function mentionMenu() {
    const q = mentionQuery();
    const off = () => { if (C.menu === 'mention') closeAdd(); };
    if (!q || (chOf(S.current).kind === 'dm' && !inModal())) return off();
    const starts = (s) => String(s).toLowerCase().split(/[\s-]+/).some((w) => w.startsWith(q.q));
    const hits = mentionable().filter((a) => a.name.startsWith(q.q) || starts(ownerName(a))).slice(0, 8);
    if (!hits.length) return off();
    if (C.menu !== 'mention') C.pick = 0;
    C.menu = 'mention';
    C.hits = hits;
    C.pick = Math.max(0, Math.min(C.pick, hits.length - 1));
    const c = chOf(composerChannel());
    $('#add-panel').innerHTML = `<div class="add-label">${c.kind === 'private' ? `Ask someone in #${esc(c.name)}` : 'Ask an Oby'}</div>` +
      hits.map((a, i) => `<button type="button" role="menuitem" data-mention="${esc(a.name)}" class="${i === C.pick ? 'is-pick' : ''}">${avatar(a, 20)}<span class="t">${esc(obyOf(a))}</span><span class="mention-handle">@${esc(a.name)}</span></button>`).join('');
    $('#add-panel').hidden = false;
    $('#add-panel').querySelectorAll('[data-mention]').forEach((b) => {
      b.onpointerdown = (e) => e.preventDefault(); // keep the caret in the message
      b.onclick = () => completeMention(b.dataset.mention);
    });
  }
  function completeMention(name) {
    const ta = $('#text');
    const q = mentionQuery();
    closeAdd();
    C.pick = 0;
    if (!q) return;
    const end = ta.selectionStart ?? ta.value.length;
    ta.value = ta.value.slice(0, q.at) + '@' + name + ' ' + ta.value.slice(end);
    const pos = q.at + name.length + 2;
    ta.setSelectionRange(pos, pos);
    ta.focus();
    ta.dispatchEvent(new Event('input')); // "@name " at the start becomes the ask's tag, as typed
  }
  // the Obys a message's words name (@handle), you and Obys not in the Sphere left out
  function mentionsIn(text) {
    const out = [];
    for (const mm of String(text).matchAll(/(^|[\s(])@([a-z0-9-]{2,32})(?![a-z0-9-])/g)) {
      const a = byName(mm[2]);
      if (a && !isMe(a) && !out.includes(a.name)) out.push(a.name);
    }
    return out;
  }

  function renderTo() {
    if (!S.me || !document.getElementById('composer')) return;
    const c = chOf(composerChannel());
    const peer = c.kind === 'dm' && !inModal() ? dmPeer(c) : null;
    const hint = $('#hint');
    hint.classList.remove('is-problem');
    const sealed = !!S.sphere.policy?.sealed;
    const just = $('#just');
    const fileTags = C.files.map((f, i) => `<span class="composer-tag">${fileIcon()}<span class="t">${esc(f.name)}</span><button type="button" class="x" data-untag="${i}" aria-label="Remove">${xIcon()}</button></span>`).join('');
    const wireTags = () => $('#tags').querySelectorAll('[data-untag]').forEach((b) => (b.onclick = () => { if (b.dataset.untag === 'to') C.to = null; else C.files.splice(Number(b.dataset.untag), 1); renderTo(); $('#text').focus(); }));
    // a private channel or direct conversation you aren't in (the admin key shows every one): read only
    const outside = isClosed(c) && !inCh(c) && !inModal();
    $('#text').disabled = outside;
    $('#plus').disabled = outside;
    if (outside) {
      C.to = null;
      C.just = false;
      just.hidden = true;
      $('#tags').innerHTML = '';
      $('#text').placeholder = c.kind === 'dm' ? `Between ${channelTitle(c.name)}` : `You aren’t in #${c.name}`;
      hint.textContent = c.kind === 'dm' ? 'A direct conversation between two others: only they write here.' : `Only the people and Obys in #${c.name} write here; one of them can add you.`;
      $('#send').classList.remove('is-ready');
      return;
    }
    if (peer) {
      // a direct conversation: ask their Oby, or a note just for them
      C.to = null;
      if (peer.bot) C.just = false;
      just.hidden = !!peer.bot;
      just.classList.toggle('is-on', C.just);
      just.setAttribute('aria-checked', String(C.just));
      $('#just-t').textContent = `Just for ${ownerName(peer)}`;
      $('#tags').innerHTML = fileTags;
      wireTags();
      $('#text').placeholder = C.just ? `Just for ${ownerName(peer)}…` : `Ask ${obyOf(peer)}…`;
      hint.textContent = ((S.sphere.paused
        ? 'The Sphere is paused by an admin: nothing new is sent until it resumes.'
        : C.just
          ? `${obyOf(peer)} doesn’t answer this; ${ownerName(peer)} reads it in their console.`
          : peer.suspended ? `${obyOf(peer)} is suspended by an admin.` : peer.online ? '' : `${obyOf(peer)} is offline; it answers when it’s back.`) +
        (sealed ? ' Sealed for the two of you.' : '')).trim();
      $('#send').classList.toggle('is-ready', !!($('#text').value.trim() || C.files.length));
      return;
    }
    just.hidden = true;
    C.just = false;
    const t = members().find((a) => a.name === C.to && !isMe(a));
    if (!t) C.to = null;
    $('#tags').innerHTML = (t ? `<span class="composer-tag">${avatar(t, 18, false)}<span class="t">${esc(obyOf(t))}</span><button type="button" class="x" data-untag="to" aria-label="Ask no one in particular">${xIcon()}</button></span>` : '') + fileTags;
    wireTags();
    $('#text').placeholder = t ? `Ask ${obyOf(t)}…` : `Message #${c.name}…`;
    const n = (c.members || []).length;
    const sealedNote = sealed ? (t ? ` Sealed: only ${obyOf(t)} and you can read it.` : c.kind === 'private' ? ` Sealed for the ${n} in #${c.name}.` : ' Sealed end to end.') : '';
    hint.textContent = ((S.sphere.paused
      ? 'The Sphere is paused by an admin: nothing new is sent until it resumes.'
      : t
        ? t.suspended ? `${obyOf(t)} is suspended by an admin.` : c.kind === 'private' && !inCh(c, t) ? `${obyOf(t)} isn’t in #${c.name}: add it first, then ask.` : t.online ? '' : `${obyOf(t)} is offline; it answers when it’s back.`
        : `Everyone in #${c.name} sees it. Type @ to ask an Oby.`) + sealedNote).trim();
    $('#send').classList.toggle('is-ready', !!($('#text').value.trim() || C.files.length));
  }

  async function send() {
    const ta = $('#text');
    const text = ta.value.trim();
    if (!text && !C.files.length) return;
    const modal = inModal();
    const channel = composerChannel();
    const c = chOf(channel);
    if (isClosed(c) && !inCh(c) && !modal) return; // not yours to write in
    let to = [];
    if (c.kind === 'dm' && !modal) {
      const peer = dmPeer(c);
      if (peer && !C.just) to = [peer.name];
    } else {
      to = C.to ? [C.to] : [];
      for (const n of mentionsIn(text)) if (!to.includes(n)) to.push(n); // @ and a name asks that Oby
      const out = c.kind === 'private' ? to.map(byName).filter((a) => a && !inCh(c, a)) : [];
      if (out.length) return offerAdd(c, out);
    }
    $('#send').classList.remove('is-ready');
    try {
      const r = await apiPost('/api/messages', { channel, text, to, files: C.files.map(({ size, ...f }) => f) });
      ta.value = '';
      ta.style.height = 'auto';
      C.files = [];
      C.to = null;
      renderTo();
      if (modal) {
        closeModal($('#new-modal'));
        if (r?.message) { onMessage(r.message); setPage('exchange:' + r.message.id); }
      }
    } catch (e) {
      problem(e.message);
      $('#send').classList.add('is-ready');
    }
    ta.focus();
  }
  // an ask to an Oby that isn't in this private channel: add it first, then send
  function offerAdd(c, out) {
    const h = $('#hint');
    h.classList.remove('is-problem');
    const one = out.length === 1;
    h.innerHTML = `${esc(andList(out.map(obyOf)))} ${one ? 'isn’t' : 'aren’t'} in #${esc(c.name)}, so ${one ? 'it' : 'they'} can’t be asked here. <button type="button" data-offer-add>Add ${one ? 'it' : 'them'} and send</button>`;
    h.querySelector('[data-offer-add]').onclick = async () => {
      try {
        const r = await apiPost(`/api/channels/${encodeURIComponent(c.name)}/members`, { add: out.map((a) => a.id) });
        if (r.channel) onChannel(r.channel);
        send();
      } catch (e) { problem(e.message); }
    };
  }
  function problem(m) { const h = $('#hint'); h.textContent = m; h.classList.add('is-problem'); }
  function toB64(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(String(r.result).split(',')[1] || '');
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  }

  // ---------------------------------------------------------------- Invite member (console-polish)
  // The main thing is one text your teammate pastes into their AI agent (Claude Code, Codex or
  // Cursor), which installs Obysphere, joins and opens their console. The plugin's skill is the
  // other way, and the commands by hand (inviteCommands) are folded away below. The invite link
  // holds the join key: a deployed page opened with the key has it (S.key); your console asks your
  // rep for the one it keeps (GET /local/invite), and when there's none, or the key was rotated
  // elsewhere, you paste it once and the rep keeps it. The key never goes in a URL query or the relay.
  const REPO = 'obi-ai-bot/oby-sphere';
  const INSTALL_CMD = `curl -fsSL https://raw.githubusercontent.com/${REPO}/main/install.sh | sh`;
  const INV = { key: null, seq: 0 }; // key: pasted in a console whose rep.mjs can't keep it (this page only)

  // the key in an invite link (#key=…, or ?key=…), or a bare key: as rep.mjs reads it
  function inviteKeyOf(s) {
    const t = String(s ?? '').trim();
    if (!t || t.length > 2000) return null;
    const m = /[#?&]key=([^&#\s]*)/.exec(t);
    let k = t;
    if (m) { try { k = decodeURIComponent(m[1]); } catch { return null; } }
    else if (/^[a-z][a-z0-9+.-]*:/i.test(t)) return null; // a link with no key in it
    return /^[\x21-\x7e]{22,256}$/.test(k) ? k : null;
  }
  // where a teammate reaches the Sphere: its public address when it has one, else the one we use.
  // The address comes from the relay and goes into a shell command, and a URL's host may hold
  // " $ ( ) { } , ` ; so only a plain host name, IPv4 or [IPv6] is taken; else a placeholder
  function inviteOrigin() {
    for (const u of [S.sphere.publicUrl, CONSOLE ? CONSOLE.sphere : location.origin]) {
      try {
        const x = new URL(u);
        if ((x.protocol === 'https:' || x.protocol === 'http:') && /^(?:[a-z0-9_-]+\.)*[a-z0-9_-]+$|^\[[0-9a-f:.]+\]$/i.test(x.hostname)) return x.origin;
      } catch {}
    }
    return 'https://<the Sphere’s address>';
  }
  // the key as the link carries it: ! ' ( ) * encoded too (a ! inside "…" is history expansion in bash and zsh)
  const keyParam = (key) => encodeURIComponent(key).replace(/[!'()*]/g, (c) => '%' + c.charCodeAt(0).toString(16).toUpperCase());
  const inviteLinkOf = (key) => `${inviteOrigin()}/#key=${keyParam(key)}`;
  function insecureFlag(link) {
    try {
      const u = new URL(link);
      const h = u.hostname.replace(/^\[|\]$/g, '');
      const loopback = h === 'localhost' || h.endsWith('.localhost') || h === '::1' || /^127(\.\d{1,3}){3}$/.test(h);
      return u.protocol === 'http:' && !loopback ? ' --insecure' : '';
    } catch { return ''; }
  }
  // the one text for their AI agent. Nothing in it comes from the relay but the link (checked
  // above): the Sphere's name, which the relay picks, would be words an agent with a shell reads
  function inviteText(link) {
    return [
      `Help me join our team's Obysphere, where our AI agents work together. Each of us has an Oby there: an agent that runs on our own machine, with our own files and rules.`,
      '',
      `If you're Claude Code, ask me to type /plugin marketplace add ${REPO}, then /plugin install obysphere@obysphere, and use its join-a-sphere skill with the invite link below.`,
      '',
      'Otherwise, install the Obysphere CLI (it needs Node 22 or later):',
      INSTALL_CMD,
      '',
      'Ask me for my name, a short handle (like "alice") and the one folder my Oby may read. Then join with this invite link:',
      `obysphere join "${link}"${insecureFlag(link)} --name <handle> --owner "<my name>" --cwd <that folder>`,
      '',
      'Then run obysphere start, so my Oby answers from this machine, and obysphere open to open my console.',
      '',
      'Keep this link inside our team: anyone who has it can join.',
    ].join('\n');
  }

  // the same, by hand: [what it does, the command]. Kept apart from the text above, so the CLI's commands change here only.
  function inviteCommands(link, flag = '') {
    const who = '--name <handle> --owner "<Their Name>"';
    return [
      ['1. Install the Obysphere CLI (it needs Node 22 or later)', INSTALL_CMD],
      ['2. Join, choosing the folder their Oby may read', `obysphere join "${link}"${flag} ${who} --about "<what their Oby knows>" --cwd <folder it may read>`],
      ['3. Go online in the background, so others can ask them', 'obysphere start'],
      ['4. Open their console, signed in as them', 'obysphere open'],
      ['Or with nothing installed: one file, then join and go online', `curl -fsSLO https://raw.githubusercontent.com/${REPO}/main/rep.mjs && node rep.mjs join "${link}"${flag} ${who} --cwd <folder it may read> && node rep.mjs ui --serve --open`],
    ];
  }

  async function openInvite() {
    const seq = ++INV.seq;
    $('#invite-modal').hidden = false;
    if (!CONSOLE) return paintInvite({ key: S.key });
    if (INV.key) return paintInvite({ key: INV.key, unkept: true });
    $('#inv-body').innerHTML = '<p class="modal-line">Getting your invite link…</p>';
    let r = null, failed = null;
    try { r = await local('GET', '/local/invite'); } catch (e) { failed = e; }
    if (seq !== INV.seq || $('#invite-modal').hidden) return; // closed, or opened again, meanwhile
    if (failed) return paintInvite({ ask: failed.status === 404 ? 'old' : 'error', error: failed.message });
    const key = inviteKeyOf(r.invite);
    paintInvite(key && r.current !== false ? { key } : { ask: key ? 'rotated' : 'none' });
  }
  // closed: the link leaves the page's DOM, and a slow answer doesn't paint it back
  function closeInvite() {
    INV.seq++;
    $('#inv-body').innerHTML = '';
  }

  const INVITE_ASK = {
    none: 'Your console doesn’t have this Sphere’s invite link yet. Paste it once: the link you joined with, or a newer one from the Sphere’s admin. It stays on this machine, beside your Oby’s token.',
    rotated: 'The invite link your console kept no longer opens this Sphere: its key was rotated. Paste the current one, and your console keeps it instead.',
    old: 'This console’s rep.mjs is older than this page, so it can’t hand on the invite link. Paste the link here to fill in the text this time, or update rep.mjs so your console keeps it.',
  };
  function paintInvite({ key = null, ask = 'none', error = '', unkept = false }) {
    const body = $('#inv-body');
    const link = key ? inviteLinkOf(key) : null;
    const copies = [];
    const row = (text) => { copies.push(text); return `<div class="code-row"><pre class="ss-code">${esc(text)}</pre><button class="set-button" type="button" data-inv-copy="${copies.length - 1}" data-label="Copy">Copy</button></div>`; };
    let html;
    if (link) {
      html = `<p class="modal-line">Send this to your teammate. They paste it into their AI agent (Claude Code, Codex or Cursor), which sets up their Oby: on their own machine, with their files and their rules.</p>
        <pre class="ss-code inv-text" tabindex="0" aria-label="The text for their AI agent">${esc(inviteText(link))}</pre>
        <div class="inv-actions"><button class="modal-primary" type="button" data-inv-main data-label="Copy for your AI agent">Copy for your AI agent</button>${unkept ? '<span class="saved-note">For now only: update rep.mjs so your console keeps the link.</span>' : ''}</div>
        <span class="modal-label">Or with the skill, in Claude Code</span>
        <p class="modal-line">They run <code class="tok-code">/plugin marketplace add ${esc(REPO)}</code>, then <code class="tok-code">/plugin install obysphere@obysphere</code>, and ask Claude Code to join with this link. Its join-a-sphere skill does the rest.</p>
        ${row(link)}`;
    } else {
      const words = ask === 'error' ? `Your console couldn’t get its invite link (${error}). Paste it here instead.` : INVITE_ASK[ask] || INVITE_ASK.none;
      html = `<p class="modal-line">${esc(words)}</p>
        <form class="inv-paste" id="inv-paste" autocomplete="off"><input class="set-field" name="link" placeholder="https://…/#key=…" aria-label="This Sphere’s invite link" aria-describedby="inv-err" autocomplete="off" spellcheck="false"><button class="modal-primary">Keep it</button></form>
        <p class="note is-problem" id="inv-err" role="alert" hidden></p>`;
    }
    html += `<details class="inv-hand"><summary>Do it by hand</summary>` +
      inviteCommands(link || '<invite link>', insecureFlag(inviteOrigin())).map(([label, cmd]) => `<span class="modal-label">${esc(label)}</span>${row(cmd)}`).join('') +
      `<p class="modal-note">With the plugin, Claude Code has the Sphere’s instruments; without it, <code class="tok-code">obysphere mcp-config</code> prints the line that adds them.</p></details>
      <p class="modal-note">The link holds this Sphere’s key: anyone who has it can join and watch. Keep it inside your team.</p>`;
    body.innerHTML = html;
    const main = body.querySelector('[data-inv-main]');
    if (main) main.onclick = () => copyText(inviteText(link), main, body.querySelector('.inv-text'));
    body.querySelectorAll('[data-inv-copy]').forEach((b) => (b.onclick = () => copyText(copies[Number(b.dataset.invCopy)], b, b.previousElementSibling)));
    const form = body.querySelector('#inv-paste');
    if (form) { form.onsubmit = keepInvite; form.link.focus(); }
    else main?.focus();
  }

  async function keepInvite(e) {
    e.preventDefault();
    const form = e.target;
    const v = form.link.value.trim();
    const key = inviteKeyOf(v);
    const fail = (words) => {
      const err = $('#inv-err');
      err.textContent = words; err.hidden = false;
      form.link.classList.add('set-invalid'); form.link.setAttribute('aria-invalid', 'true'); form.link.focus();
    };
    if (!key) return fail('That isn’t an invite link: it looks like https://…/#key=…');
    const btn = form.querySelector('button');
    btn.disabled = true;
    const seq = INV.seq;
    try {
      const r = await local('PUT', '/local/invite', { invite: v });
      if (seq === INV.seq) paintInvite({ key: inviteKeyOf(r.invite) || key });
    } catch (x) {
      if (seq !== INV.seq) return;
      if (x.status === 404) { INV.key = key; return paintInvite({ key, unkept: true }); } // an older rep.mjs: this page only
      btn.disabled = false;
      fail(sentence(String(x.message).replace(/^invite:\s*/, '')));
    }
  }

  // the clipboard when there is one; else the text is selected (and copied the old way where that works)
  async function copyText(text, btn, from) {
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch {}
    if (!ok && from) {
      const range = document.createRange();
      range.selectNodeContents(from);
      const sel = getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      try { ok = document.execCommand('copy'); } catch {}
    }
    btn.textContent = ok ? 'Copied' : 'Selected: copy it';
    clearTimeout(btn.copyTimer);
    btn.copyTimer = setTimeout(() => (btn.textContent = btn.dataset.label || 'Copy'), 1600);
  }

  // ---------------------------------------------------------------- a newer Oby (GET /local/version; rep.mjs checks once a day)
  function newerVersion(a, b) {
    const p = (v) => { const m = /^(\d+)\.(\d+)\.(\d+)(?:-([^+]*))?/.exec(String(v || '')); return m ? [+m[1], +m[2], +m[3], m[4] || ''] : null; };
    const x = p(a), y = p(b);
    if (!x || !y) return false;
    for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] > y[i];
    return !x[3] && !!y[3]; // a release is newer than its pre-releases
  }
  async function checkVersion(again = true) {
    let v = null;
    try { v = await api('/local/version'); } catch {}
    // the first look starts the day's check, whose answer is there a little later; a console
    // left open looks again every few hours (rep.mjs still asks GitHub at most once a day)
    if (again) { setTimeout(() => checkVersion(false), 20000); setInterval(() => checkVersion(false), 6 * 3600e3); }
    const el = $('#update-line');
    if (!v || !el || !newerVersion(v.latest, v.current) || store.get('obysphere.update.dismissed') === v.latest) return;
    el.innerHTML = `A newer Oby is out (${esc(v.latest)}): run <code class="tok-code">obysphere update</code><button type="button" aria-label="Dismiss"><svg width="10" height="10" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 3l8 8M11 3l-8 8"/></svg></button>`;
    el.hidden = false;
    $('button', el).onclick = () => { store.set('obysphere.update.dismissed', v.latest); el.hidden = true; };
  }

  // ---------------------------------------------------------------- their words: a little Markdown, escaped first
  function md(src) {
    let s = esc(src);
    const blocks = [];
    s = s.replace(/```[\w-]*\n?([\s\S]*?)```/g, (_, code) => { blocks.push(`<pre class="ss-code">${code.replace(/\n$/, '')}</pre>`); return `\u0000${blocks.length - 1}\u0000`; });
    const names = new Set([...S.agents.values()].map((a) => a.name));
    const inl = (t) => t
      .replace(/`([^`\n]+)`/g, '<code class="tok-code">$1</code>')
      .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?:;]|$)/g, '$1<i>$2</i>')
      .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a class="tok-url" href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
      .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a class="tok-url" href="$2" target="_blank" rel="noopener noreferrer">$2</a>')
      .replace(/(^|\s)@([a-z0-9-]{2,32})\b/g, (m0, pre, n) => (names.has(n) ? `${pre}<span class="tok-mention">@${n}</span>` : m0));
    const out = [];
    let list = null;
    for (const line of s.split('\n')) {
      const ul = /^\s*[-*•]\s+(.*)$/.exec(line);
      const ol = /^\s*\d+[.)]\s+(.*)$/.exec(line);
      if (ul || ol) {
        const tag = ul ? 'ul' : 'ol';
        if (!list || list !== tag) { if (list) out.push(`</${list}>`); out.push(`<${tag}>`); list = tag; }
        out.push(`<li>${inl((ul || ol)[1])}</li>`);
        continue;
      }
      if (list) { out.push(`</${list}>`); list = null; }
      if (!line.trim()) continue;
      const h = /^#{1,6}\s+(.*)$/.exec(line);
      if (h) { out.push(`<h4>${inl(h[1])}</h4>`); continue; }
      const q = /^&gt;\s?(.*)$/.exec(line);
      if (q) { out.push(`<blockquote>${inl(q[1])}</blockquote>`); continue; }
      if (/^\u0000\d+\u0000$/.test(line.trim())) { out.push(line.trim()); continue; }
      out.push(`<p>${inl(line)}</p>`);
    }
    if (list) out.push(`</${list}>`);
    return out.join('').replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[i]);
  }

  // ---------------------------------------------------------------- small helpers
  function time(ts) {
    const d = new Date(ts);
    const t = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    return d.toDateString() === new Date().toDateString() ? t : `${d.toLocaleDateString([], { month: 'short', day: 'numeric' })}, ${t}`;
  }
  function clock(ms) { const d = new Date(ms); const t = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }); return d.toDateString() === new Date().toDateString() ? t : `${d.toLocaleDateString([], { month: 'short', day: 'numeric' })} ${t}`; }
  function secs(since) { const s = Math.max(0, Math.round((Date.now() - Date.parse(since)) / 1000)); return s < 60 ? `${s}s` : `${Math.floor(s / 60)}m ${s % 60}s`; }
  function fmtMs(ms) { if (ms == null || !isFinite(ms)) return '—'; ms = Math.max(0, ms); return ms < 1000 ? `${Math.round(ms)}ms` : ms < 60000 ? `${(ms / 1000).toFixed(1)}s` : `${Math.floor(ms / 60000)}m ${Math.round((ms % 60000) / 1000)}s`; }
  function dur(ms) { const m = Math.floor(ms / 60000), h = Math.floor(m / 60), d = Math.floor(h / 24); return d ? `${d}d ${h % 24}h` : h ? `${h}h ${m % 60}m` : `${m}m`; }
  function ago(ts) { const s = Math.max(0, (Date.now() - Date.parse(ts)) / 1000); return s < 10 ? 'just now' : s < 60 ? `${Math.round(s)}s ago` : s < 3600 ? `${Math.round(s / 60)}m ago` : s < 86400 ? `${Math.round(s / 3600)}h ago` : `${Math.round(s / 86400)}d ago`; }
  function median(a) { if (!a.length) return null; const s = [...a].sort((x, y) => x - y); return s[Math.floor(s.length / 2)]; }
  function size(n) { return n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(1)} KB` : `${(n / 1048576).toFixed(n % 1048576 ? 1 : 0)} MB`; }
  function lock(size = 13) { return `<svg width="${size}" height="${size}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="3.5" y="7" width="9" height="6.5" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>`; }
  const isSealed = (m) => !!m.sealed && !m.open;
  function sealedFor(m) {
    const ids = Object.keys(m.sealed?.to || {});
    const names = ids.map((id) => obyLower(agent(id)));
    if (!names.length) return 'its readers';
    return names.length <= 2 ? names.join(' and ') : `${names.slice(0, -1).join(', ')} and ${names[names.length - 1]}`;
  }
  function sealedBytes(m) { return Math.round(((m.sealed?.ct || '').length * 3) / 4); }
  function sealedHtml(m) { return `<div class="sealed-box" title="Sealed end to end: the relay carries it but can’t read it">${lock()}<span>Sealed for ${esc(sealedFor(m))} · ${esc(size(sealedBytes(m)))}</span></div>`; }
  function laptop() { return '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="3" y="3.5" width="10" height="7" rx="1.2"/><path d="M1.5 12.5h13"/></svg>'; }
  function fileIcon() { return '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M4 1.5h5l3 3v10H4z"/><path d="M9 1.5v3h3"/></svg>'; }
  function clip() { return '<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M14.5 9.5 9.6 14.4a3.2 3.2 0 0 1-4.5-4.5l5.3-5.3a2.1 2.1 0 0 1 3 3l-5.2 5.2a1 1 0 0 1-1.5-1.5l4.6-4.6"/></svg>'; }
  function xIcon() { return '<svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 2l6 6M8 2 2 8"/></svg>'; }
})();
</script>
