        <button class="icon-button" data-close aria-label="Close"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 3l8 8M11 3l-8 8"/></svg></button>
      </header>
      <div id="ch-slot"></div>
    </div>
  </div>
</template>

<script>
(() => {
  'use strict';
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // what the relay sends is checked before the page keeps it: ids and channel names go into
  // markup and request paths, so one that isn't the relay's own shape is dropped (as rep.mjs does)
  const RID = { a: /^a_[A-Za-z0-9_-]{1,32}$/, m: /^m_[A-Za-z0-9_-]{1,32}$/, f: /^f_[A-Za-z0-9_-]{1,32}$/ };
  const CHAN = /^[a-z0-9-]{1,32}$/;
  const okAgent = (a) => !!a && RID.a.test(String(a.id));
  const okChannel = (c) => !!c && CHAN.test(String(c.name));
  const okFile = (f) => !!f && RID.f.test(String(f.id));
  const okMessage = (m) => !!m && RID.m.test(String(m.id)) && CHAN.test(String(m.channel)) && (m.from == null || RID.a.test(String(m.from)))
    && (m.replyTo == null || RID.m.test(String(m.replyTo))) && (m.cause == null || RID.m.test(String(m.cause)))
    && (m.to == null || (Array.isArray(m.to) && m.to.every((x) => RID.a.test(String(x))))) && (m.files == null || (Array.isArray(m.files) && m.files.every(okFile)));
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
  };

  const CONSOLE = window.OBYSPHERE_CONSOLE || null; // set when opened through `rep.mjs ui`: signed in as you
  const S = {
    me: null, key: null, admin: false, adminKey: null, sphere: null,
    agents: new Map(), channels: new Map(), messages: [], byId: new Map(),
    current: 'general', unread: {}, open: new Set(),
    mode: 'console', page: 'overview',
    stats: null, instruments: null, files: null, audit: [], auditHead: null, auditVerified: null,
  };

  // ---------------------------------------------------------------- Oby's pictures (ObyFace.tsx)
  const OBY_PATH = 'M70.6738 1.4132C71.0781 0.099296 72.6571 -0.424821 73.7666 0.386834C76.0714 2.07339 80.0073 4.97625 82.921 7.12762C85.3816 8.94448 88.192 10.212 90.91 11.615C99.2785 15.935 105 24.6647 105 34.7316V68.7316C105 83.091 93.3594 94.7316 79 94.7316H26C11.6406 94.7316 0 83.091 0 68.7316V34.7316C8.34945e-07 24.3936 6.03367 15.4655 14.7715 11.2754C17.9651 9.74397 21.2856 8.39647 24.144 6.30517L32.2334 0.386834C33.3429 -0.424821 34.9219 0.099296 35.3262 1.4132L36.9257 6.61352C37.3129 7.87244 38.476 8.73156 39.7931 8.73156H66.2069C67.524 8.73156 68.6871 7.87245 69.0743 6.61352L70.6738 1.4132Z';
  const AVATAR_COLORS = ['#3a5a8c', '#7a4a8c', '#2f7a6a', '#8c5a3a', '#8c3a52', '#5a6a2f', '#3a7a8c', '#6a4a3a'];
  const djb2 = (s) => [...s].reduce((h, c) => ((h * 33) ^ c.charCodeAt(0)) >>> 0, 5381);
  function obyFace(size, badge = false, color = '#f1f1ee') {
    if (badge) return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" overflow="visible" aria-hidden="true"><path class="oby-badge-cut" d="${OBY_PATH}" transform="translate(1.5 2.5) scale(0.2)" stroke-linejoin="round"/><path d="${OBY_PATH}" transform="translate(1.5 2.5) scale(0.2)" fill="${color}"/><rect x="7.4" y="10" width="2.6" height="5" rx="1.3" fill="#0d0d0e"/><rect x="14" y="10" width="2.6" height="5" rx="1.3" fill="#0d0d0e"/></svg>`;
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true"><path d="${OBY_PATH}" transform="translate(1.5 3.5) scale(0.2)" fill="${color}"/><g fill="#0d0d0e"><rect x="6" y="10.6" width="2.8" height="5" rx="1.4"/><rect x="14.6" y="10.6" width="2.8" height="5" rx="1.4"/></g></svg>`;
  }
  const ownerName = (a) => String(a?.owner || a?.name || '?').replace(/\s*\([^)]*\)\s*/g, ' ').trim() || a?.name || '?';
  const isMe = (a) => !!S.me && !!a && a.id === S.me.id;
  const obyOf = (a) => (isMe(a) ? 'Your Oby' : `${ownerName(a)}’s Oby`);
  const obyLower = (a) => (isMe(a) ? 'your Oby' : obyOf(a));
  const machineOf = (a) => (isMe(a) ? 'your machine' : `${ownerName(a)}’s machine`);
  function avatar(a, size = 22, badge = true) {
    const name = ownerName(a);
    const initials = name.split(/\s+/).map((w) => w[0]).slice(0, 2).join('').toUpperCase();
    const font = size <= 22 ? 9 : size <= 28 ? 11 : 13;
    return `<span class="owner-avatar" style="width:${size}px;height:${size}px;font-size:${font}px;background:${AVATAR_COLORS[djb2(name) % AVATAR_COLORS.length]}" aria-hidden="true">${esc(initials)}${badge ? `<span class="owner-avatar-oby">${obyFace(Math.round(size * 0.5), true)}</span>` : ''}</span>`;
  }
  const picture = (a, size = 22) => (isMe(a) ? obyFace(size) : avatar(a, size));
  const agent = (id) => S.agents.get(id) || { id, name: 'unknown', owner: 'Someone' };
  const members = () => [...S.agents.values()].filter((a) => !a.removed);

  // ---------------------------------------------------------------- keys
  const hp = new URLSearchParams(location.hash.slice(1).replace(/\+/g, '%2B')); // a '+' in a key stays a '+'
  const hashKey = hp.get('key');
  S.key = CONSOLE ? 'console' : hashKey || store.get('obysphere.key');
  if (hashKey) store.set('obysphere.key', hashKey);
  // the admin key lives in this tab only (sessionStorage), never in the URL or localStorage
  const session = {
    get(k) { try { return sessionStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch {} },
  };
  try { localStorage.removeItem('obysphere.admin'); } catch {}
  // in your console, admins are members: no admin key is ever kept in the page (Admin access… claims once)
  if (CONSOLE) session.set('obysphere.admin', null);
  else if (hp.get('admin')) session.set('obysphere.admin', hp.get('admin'));
  S.adminKey = CONSOLE ? null : session.get('obysphere.admin');
  S.mode = hp.get('mode') || store.get('obysphere.mode') || 'console';
  S.page = hp.get('page') || 'overview';
  if (!S.key) return gate();
  boot().catch((e) => { if (String(e.message).startsWith('401')) gate('That key didn’t open this Obysphere.'); else console.error(e); });

  function gate(err) {
    $('#root').innerHTML = `<div class="gate"><form>${obyFace(48)}<h2>Open an Obysphere</h2><p>Paste the key from your invite link.</p><input class="set-field" name="k" placeholder="Obysphere key" autocomplete="off" autofocus>${err ? `<p class="err">${esc(err)}</p>` : ''}<button class="modal-primary">Open</button></form></div>`;
    $('form').onsubmit = (e) => { e.preventDefault(); const k = e.target.k.value.trim(); store.set('obysphere.key', k); location.hash = 'key=' + encodeURIComponent(k); location.reload(); };
  }

  // ---------------------------------------------------------------- the API
  function headers(extra = {}) {
    const h = CONSOLE ? { 'x-obysphere-console': '1' } : { 'x-sphere-key': S.key };
    if (S.adminKey) h['x-admin-key'] = S.adminKey;
    return { ...h, ...extra };
  }
  async function api(path) {
    const r = await fetch(path, { headers: headers() });
    if (!r.ok) throw new Error(r.status + ' ' + path);
    return r.json();
  }
  async function call(method, path, body) {
    const r = await fetch(path, { method, headers: headers(body ? { 'content-type': 'application/json' } : {}), body: body ? JSON.stringify(body) : undefined });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
    return j;
  }
  const apiPost = (path, body) => call('POST', path, body);
  // no key ever goes in a URL: the console's proxy adds the owner's token, and a viewer's key
  // travels in a header, so downloads go through fetch rather than a plain link
  const fileUrl = (f, inline) => `/api/files/${f.id}${inline ? '?inline=1' : ''}`;
  async function download(id, name) {
    const r = await fetch(fileUrl({ id }), { headers: headers() });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(await r.blob());
    a.download = name || id;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  // ---------------------------------------------------------------- boot
  async function boot() {
    const [info, ag, ch, ms] = await Promise.all([api('/api/info'), api('/api/agents'), api('/api/channels'), api('/api/messages?limit=500')]);
    $('#root').append($('#tpl-app').content.cloneNode(true));
    S.sphere = info.sphere;
    S.me = CONSOLE ? info.me || null : null;
    S.admin = !!info.admin;
    document.title = `${S.sphere.name} · Obysphere`;
    $('#sphere-name').textContent = S.sphere.name;
    $('#tile').textContent = (S.sphere.name.match(/[\p{L}\p{N}]/u) || ['O'])[0].toUpperCase();
    $('#rail-sphere').dataset.tip = S.sphere.name;
    ag.agents.filter(okAgent).forEach((a) => S.agents.set(a.id, a));
    ch.channels.filter(okChannel).forEach((c) => S.channels.set(c.name, c));
    S.messages = ms.messages.filter(okMessage);
    S.messages.forEach((m) => S.byId.set(m.id, m));
    const c = hp.get('c');
    if (c && S.channels.has(c)) S.current = c;
    initConversations();

    if (S.me) {
      $('#rail-me').innerHTML = `<button class="rail-button" data-tip="You: ${esc(S.me.owner)} (${esc(S.me.name)})">${avatar(S.me, 28, false)}</button>`;
      setupComposer();
    } else $('#watch-foot').hidden = false;
    wire();
    renderAccount();
    renderAll();
    connect();
    loadConsoleData();
    setInterval(tick, 1000);
    setInterval(() => { if (S.mode === 'console') refreshStats(); }, 3000);
    if (CONSOLE && S.me) { pollPending(); setInterval(pollPending, 3000); }
    if (CONSOLE) checkVersion();
    if (CONSOLE && S.me) startNotifications(); // browser notifications, and the count in the tab title
  }

  function wire() {
    for (const id of ['#invite', '#invite-2']) $(id).onclick = openInvite;
    document.querySelectorAll('.modal-backdrop').forEach((m) => {
      m.onpointerdown = (e) => { if (e.target === m) closeModal(m); };
      m.querySelectorAll('[data-close]').forEach((b) => (b.onclick = () => closeModal(m)));
    });
    $('#toggle').onclick = () => $('#side').classList.toggle('is-open');
    $('#rail-console').onclick = () => setMode('console');
    $('#rail-conv').onclick = () => setMode('conversation');
    $('#new-exchange').onclick = openNew;
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        document.querySelectorAll('.modal-backdrop').forEach((m) => !m.hidden && closeModal(m));
        closeAdd();
        toggleAccount(false);
        $('#side').classList.remove('is-open');
      }
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k' && S.me) { e.preventDefault(); openNew(); }
    });
    wireAdmin();
  }

  function closeModal(m) {
    m.hidden = true;
    if (m.id === 'new-modal') { $('#composer-home').append($('#composer')); closeAdd(); }
    if (m.id === 'admin-modal') { $('#adm-key').value = ''; $('#adm-error').hidden = true; }
    if (m.id === 'invite-modal') closeInvite();
  }

  function setMode(mode) {
    S.mode = mode === 'conversation' ? 'conversation' : 'console';
    store.set('obysphere.mode', S.mode);
    renderAll();
    syncHash();
  }
  function setPage(page) {
    S.page = page;
    $('#side').classList.remove('is-open');
    if (S.mode !== 'console') S.mode = 'console';
    renderAll();
    $('#console-scroll').scrollTop = 0;
    syncHash();
  }
  function syncHash() {
    const p = new URLSearchParams();
    if (!CONSOLE && hashKey) p.set('key', hashKey);
    p.set('mode', S.mode);
    if (S.mode === 'console') p.set('page', S.page);
    else p.set('c', S.current);
    history.replaceState(null, '', '#' + p.toString());
  }

  function renderAll() {
    const con = S.mode === 'console';
    $('#conv').hidden = con;
    $('#console').hidden = !con;
    $('#side-console').hidden = !con;
    $('#side-conv').hidden = con;
    $('#rail-console').classList.toggle('is-on', con);
    $('#rail-conv').classList.toggle('is-on', !con);
    $('#rail-console').setAttribute('aria-pressed', String(con));
    $('#rail-conv').setAttribute('aria-pressed', String(!con));
    $('#new-exchange').hidden = !(con && S.me);
    renderBar();
    renderTrail();
    if (con) {
      $('#thread').innerHTML = '';
      renderNav();
      renderPage(true);
    } else {
      renderChannels();
      renderMembers();
      renderHead();
      renderFeed();
      renderLive();
      renderTo();
    }
  }

  // ---------------------------------------------------------------- live
  // Live events: server-sent events read with fetch, so the key travels in a header, not the URL.
  // A stream ends now and then (always on Vercel, at the function's time limit); after each
  // reconnect the page catches up on what it missed.
  const EVENTS = {
    message: (d) => onMessage(d),
    'message-update': (u) => { const m = S.byId.get(u.id); if (m) Object.assign(m, u); dirty(); },
    agent: (d) => upsertAgent(d),
    presence: (d) => upsertAgent(d),
    channel: (c) => onChannel(c),
    audit: (d) => onAudit(d),
    policy: (p) => { S.sphere.paused = p.paused; if (p.policy) S.sphere.policy = p.policy; renderHealth(); dirty(); },
  };
  async function connect() {
    let backoff = 1000, first = true;
    for (;;) {
      try {
        const r = await fetch('/api/stream', { headers: headers({ accept: 'text/event-stream' }), cache: 'no-store' });
        if (r.status === 401 || r.status === 403) { gate('This Obysphere no longer accepts that key (it may have been rotated).'); return; }
        if (!r.ok || !r.body) throw new Error(`HTTP ${r.status}`);
        backoff = 1000;
        if (!first) await catchUp();
        first = false;
        const reader = r.body.getReader();
        const dec = new TextDecoder();
        let buf = '';
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          if (buf.length > 4e6) buf = '';
          let i;
          while ((i = buf.indexOf('\n\n')) >= 0) {
            const block = buf.slice(0, i);
            buf = buf.slice(i + 2);
            let ev = 'message', data = '';
            for (const line of block.split('\n')) {
              if (line.startsWith('event: ')) ev = line.slice(7);
              else if (line.startsWith('data: ')) data += line.slice(6);
            }
            if (data && EVENTS[ev]) { try { EVENTS[ev](JSON.parse(data)); } catch (e) { console.error(e); } }
          }
        }
      } catch {}
      await new Promise((res) => setTimeout(res, backoff));
      backoff = Math.min(backoff * 2, 15000);
    }
  }
  async function catchUp() {
    try {
      const last = S.messages[S.messages.length - 1];
      const [ag, ms, ch] = await Promise.all([api('/api/agents'), api(`/api/messages?limit=500${last ? `&after=${encodeURIComponent(last.id)}` : ''}`), api('/api/channels')]);
      setChannels(ch.channels);
      ag.agents.forEach(upsertAgent);
      ms.messages.forEach(onMessage);
      const seq = S.auditHead?.seq || 0;
      const au = await api(`/api/audit?after=${seq}&limit=500`).catch(() => null);
      au?.events?.forEach(onAudit);
    } catch {}
  }

  function upsertAgent(a) {
    if (!okAgent(a)) return;
    S.agents.set(a.id, { ...(S.agents.get(a.id) || {}), ...a });
    if (S.me && a.id === S.me.id && !a.removed) S.me = S.agents.get(a.id);
    if (S.me && a.id === S.me.id) adminFromMe();
    renderBar();
    if (S.mode === 'conversation') { renderMembers(); renderHead(); renderLive(); renderTo(); }
    else { updateTopo(); dirty(); }
  }

  function onMessage(m) {
    if (!okMessage(m) || S.byId.has(m.id)) return;
    S.messages.push(m);
    S.byId.set(m.id, m);
    if (!S.channels.has(m.channel)) unknownChannel(m.channel);
    if (m.files?.length) S.files = null;
    noteUnread(m);
    if (S.mode === 'conversation') {
      if (m.channel === S.current) {
        const feed = $('#feed');
        const atEnd = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 160;
        const list = S.messages.filter((x) => x.channel === m.channel);
        $('#empty').hidden = true;
        $('#thread').insertAdjacentHTML('beforeend', messageHtml(m, list[list.length - 2]));
        document.getElementById(m.id)?.classList.add('is-new');
        if (atEnd || (S.me && m.from === S.me.id)) feed.scrollTop = feed.scrollHeight;
      }
      renderChannels();
      renderMembers();
      renderLive();
    } else {
      packet(m);
      dirty();
    }
  }

  function onAudit(ev) {
    if (S.audit.some((x) => x.seq === ev.seq)) return;
    S.audit.push(ev);
    if (S.audit.length > 2000) S.audit.shift();
    S.auditHead = { seq: ev.seq, hash: ev.hash };
    if (S.mode !== 'console') return;
    const log = document.getElementById('log');
    if (log) {
      log.querySelector('.log-empty')?.remove();
      log.insertAdjacentHTML('afterbegin', logRow(ev, true));
      while (log.children.length > 200) log.lastElementChild.remove();
    }
    if (S.page === 'audit') dirty();
  }

  // a re-render of the console's page, at most every 250ms, never of the live map or log
  let dirtyTimer = null;
  function dirty() {
    if (S.mode !== 'console' || dirtyTimer) return;
    dirtyTimer = setTimeout(() => { dirtyTimer = null; renderNav(); if (S.page !== 'settings') renderPage(false); }, 250);
  }

  async function loadConsoleData() {
    refreshStats();
    try { S.instruments = await api('/api/instruments'); } catch { S.instruments = { instruments: [], rules: null, missing: true }; }
    try {
      const a = await api('/api/audit?limit=300');
      S.audit = a.events || [];
      S.auditHead = a.head || null;
      S.auditVerified = a.verified;
    } catch { S.audit = []; S.auditVerified = null; }
    fillLog();
    dirty();
  }
  async function refreshStats() {
    try { S.stats = await api('/api/stats'); } catch { S.stats = null; }
    if (S.mode === 'console') { renderHealth(); if (S.page === 'overview') updateKpis(); else if (['instruments', 'members'].includes(S.page)) dirty(); }
  }

  // ---------------------------------------------------------------- exchanges: an ask and every hop it caused, as one trace
  function exchanges() {
    const asks = S.messages.filter((m) => m.kind === 'ask');
    const rootOf = (m) => {
      let cur = m, seen = 0;
      while (cur.cause && S.byId.get(cur.cause) && seen++ < 10) {
        const c = S.byId.get(cur.cause);
        cur = c.kind === 'ask' ? c : c.replyTo ? S.byId.get(c.replyTo) || c : c;
      }
      return cur;
    };
    const groups = new Map();
    for (const a of asks) {
      const r = rootOf(a);
      if (!groups.has(r.id)) groups.set(r.id, []);
      groups.get(r.id).push(a);
    }
    for (const p of S.messages.filter((m) => m.kind === 'post')) groups.set(p.id, [p]);
    const out = [];
    for (const [rootId, list] of groups) {
      const root = S.byId.get(rootId);
      if (!root) continue;
      const spans = list.sort((a, b) => a.ts.localeCompare(b.ts)).map(spanOf);
      const rs = spans.find((s) => s.ask.id === rootId) || spans[0];
      const end = Math.max(...spans.map((s) => s.endMs ?? Date.now()));
      const machines = new Set(spans.filter((s) => s.target).map((s) => s.target.id));
      const files = list.concat(spans.map((s) => s.reply).filter(Boolean)).flatMap((m) => m.files || []);
      out.push({
        id: rootId, root, spans, status: root.kind === 'post' ? 'posted' : rs.status,
        start: Date.parse(root.ts), end, durationMs: end - Date.parse(root.ts),
        hops: Math.max(0, ...list.map((m) => m.depth || 0)), machines: machines.size, files, channel: root.channel,
      });
    }
    return out.sort((a, b) => b.start - a.start);
  }

  function spanOf(ask) {
    const target = ask.to?.length ? agent(ask.to[0]) : null;
    const reply = target ? S.messages.find((m) => m.replyTo === ask.id && m.from === target.id) : null;
    const posted = Date.parse(ask.ts);
    const claimed = ask.claimedAt ? Date.parse(ask.claimedAt) : null;
    const started = ask.startedAt ? Date.parse(ask.startedAt) : claimed;
    const endMs = reply ? Date.parse(reply.ts) : ask.kind === 'post' ? posted : null;
    let status = 'answered';
    if (ask.kind === 'post') status = 'posted';
    else if (reply) status = reply.meta?.error ? 'error' : reply.meta?.declined ? 'declined' : 'answered';
    else if (target?.status?.state === 'working' && target.status.about === ask.id) status = 'working';
    else if (target && !target.online) status = 'offline';
    else status = 'waiting';
    return { ask, target, reply, posted, claimed, started, endMs, status, from: agent(ask.from), depth: ask.depth || 0 };
  }

  const STATUS_WORDS = { answered: 'Answered', working: 'Working', waiting: 'Waiting', offline: 'Waiting, offline', declined: 'Declined', error: 'Failed', posted: 'Posted' };
  const stateHtml = (st) => `<span class="state"><span class="status"><span class="status-dot is-${st === 'offline' ? 'offline' : st}"></span></span>${STATUS_WORDS[st] || st}</span>`;
  const arrow = '<svg class="arrow" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2.5 6h7M7 3.5 9.5 6 7 8.5"/></svg>';
  function route(ex) {
    if (ex.root.kind === 'post') return `<span class="route">${picture(agent(ex.root.from), 20)}${arrow}<span class="muted">${esc(postTo(ex.root))}</span></span>`;
    const ids = [ex.root.from];
    for (const s of ex.spans) if (s.target && !ids.includes(s.target.id)) ids.push(s.target.id);
    return `<span class="route">${ids.map((id, i) => (i ? arrow : '') + picture(agent(id), 20)).join('')}</span>`;
  }
  function routeWords(ex) {
    const s = ex.spans.find((x) => x.ask.id === ex.id) || ex.spans[0];
    if (ex.root.kind === 'post') return `${obyOf(s.from)} to ${postTo(ex.root)}`;
    return `${obyOf(s.from)} → ${s.target ? obyOf(s.target) : '?'}`;
  }

  // ---------------------------------------------------------------- console: side panel
  const ICON_GEAR = '<circle cx="9" cy="9" r="2.5"/><path d="M9 2.5v2M9 13.5v2M2.5 9h2M13.5 9h2M4.4 4.4l1.4 1.4M12.2 12.2l1.4 1.4M4.4 13.6l1.4-1.4M12.2 5.8l1.4-1.4"/>';
  const ICON_SHIELD = '<path d="M9 2.5 14.5 4.5v4c0 3.4-2.3 6-5.5 7-3.2-1-5.5-3.6-5.5-7v-4z"/>';
  const ICON_ADMINS = '<circle cx="7" cy="6.5" r="2.5"/><path d="M2.5 15a4.5 4.5 0 0 1 9 0"/><path d="M13.5 8.5l2 .8v1.6c0 1.3-.8 2.4-2 2.9-1.2-.5-2-1.6-2-2.9V9.3z"/>';
  const ICON_KEY = '<circle cx="6" cy="9" r="3"/><path d="M9 9h6.5M13 9v2.5M15.5 9v2"/>';
  const navIcon = (icon, px = 18) => `<svg width="${px}" height="${px}" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">${icon}</svg>`;
  // [page, label, icon, group]: the nav in three groups; Admin shows only for admins
  const NAV = [
    ['overview', 'Overview', '<path d="M3 3h5v5H3zM10 3h5v5h-5zM3 10h5v5H3zM10 10h5v5h-5z"/>', 'sphere'],
    ['traffic', 'Traffic', '<path d="M3 6.5h11l-3-3M15 11.5H4l3 3"/>', 'sphere'],
    ['members', 'Members', '<circle cx="7" cy="6.5" r="2.5"/><path d="M2.5 15a4.5 4.5 0 0 1 9 0M12 4.2a2.5 2.5 0 0 1 0 4.6M13.5 11.2A4.5 4.5 0 0 1 15.5 15"/>', 'sphere'],
    ['instruments', 'Instruments', '<path d="M3 5h7M13 5h2M3 13h2M8 13h7"/><circle cx="11.5" cy="5" r="1.5"/><circle cx="6.5" cy="13" r="1.5"/><path d="M3 9h3M9 9h6"/><circle cx="7.5" cy="9" r="1.5"/>', 'sphere'],
    ['files', 'Files', '<path d="M4.5 2.5h6l3 3v10h-9z"/><path d="M10.5 2.5v3h3"/>', 'sphere'],
    ['audit', 'Audit log', '<path d="M5 4.5h9M5 9h9M5 13.5h6"/><path d="M2.5 4.5h.01M2.5 9h.01M2.5 13.5h.01"/>', 'sphere'],
    ['you', 'Your Oby', null, 'you'],
    ['settings', 'Settings', ICON_GEAR, 'you'],
    ['policy', 'Policy', ICON_SHIELD, 'admin'],
    ['admins', 'Admins', ICON_ADMINS, 'admin'],
  ];
  const NAV_GROUPS = [['sphere', 'Sphere'], ['you', 'You'], ['admin', 'Admin']];
  function renderNav() {
    const ex = exchanges();
    const counts = {
      traffic: ex.filter((e) => e.status === 'working' || e.status === 'waiting').length || ex.length,
      members: members().length,
      instruments: S.instruments?.instruments?.length || '',
      files: S.messages.reduce((n, m) => n + (m.files?.length || 0), 0) || '',
      audit: S.auditHead?.seq || '',
      admins: members().filter((a) => a.admin).length || '',
    };
    const page = S.page.startsWith('exchange:') ? 'traffic' : S.page;
    const waiting = S.pending?.length || 0;
    const shown = NAV.filter(([k, , , g]) => (k !== 'you' || S.me) && (k !== 'settings' || (S.me && CONSOLE)) && (g !== 'admin' || S.admin));
    const item = ([k, label, icon]) => `<button class="connector${page === k ? ' is-active' : ''}" data-page="${k}">${icon ? navIcon(icon) : obyFace(18)}<span class="connector-name">${label}</span>${k === 'you' && waiting ? `<span class="needs" title="${waiting} waiting for you">${waiting}</span>` : counts[k] !== undefined && counts[k] !== '' ? `<span class="connector-count">${counts[k]}</span>` : ''}</button>`;
    $('#nav').innerHTML = NAV_GROUPS.map(([g, label]) => {
      const items = shown.filter((x) => x[3] === g);
      return items.length ? `<div class="sidebar-group-head">${label}</div>${items.map(item).join('')}` : '';
    }).join('') + navFoot();
    $('#nav').querySelectorAll('[data-page]').forEach((b) => (b.onclick = () => setPage(b.dataset.page)));
    $('#nav').querySelector('[data-admin-signin]')?.addEventListener('click', () => openAdmin('signin'));
    $('#nav').querySelector('[data-admin-signout]')?.addEventListener('click', adminSignOut);
    renderHealth();
  }
  function renderHealth() {
    const st = S.stats;
    const paused = S.sphere.paused;
    $('#health-line').innerHTML = `<span class="status"><span class="status-dot is-${paused ? 'paused' : 'healthy'}"></span></span>${paused ? 'Paused by an admin' : 'Healthy'}${S.sphere.policy?.sealed ? ' · sealed' : ''}`;
    // the Sphere's version and how long it has been up: nothing else
    $('#console-foot').textContent = [versionWords(S.sphere.version), st ? `up ${upFor(st.uptimeMs)}` : ''].filter(Boolean).join(' · ');
  }
  // "obysphere/0.3" → "v0.3"; a full version stays whole ("obysphere/0.3.1" → "v0.3.1")
  const versionWords = (v) => { const m = /(\d+(?:\.\d+){1,2}(?:-[0-9A-Za-z.-]+)?)/.exec(String(v || '')); return m ? `v${m[1]}` : ''; };
  function upFor(ms) { const m = Math.max(1, Math.floor(ms / 60000)), h = Math.floor(m / 60), d = Math.floor(h / 24); return d ? `${d} d ${h % 24} h` : h ? `${h} h ${m % 60} min` : `${m} min`; }

  function renderTrail() {
    const chev = '<svg class="trail-chev" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M4.5 2.5 8 6l-3.5 3.5"/></svg>';
    let parts = [`<span class="trail-part">${esc(S.sphere.name)}</span>`];
    if (S.mode === 'conversation') parts.push(`<span class="trail-now">${esc(channelTitle(S.current))}</span>`);
    else if (S.page.startsWith('exchange:')) {
      parts.push(`<button class="trail-part is-link" data-page="traffic">Traffic</button>`);
      parts.push(`<span class="trail-now">Exchange</span>`);
    } else parts.push(`<span class="trail-now">${esc((NAV.find(([k]) => k === S.page) || [, 'Overview'])[1])}</span>`);
    $('#trail').innerHTML = parts.join(chev);
    $('#trail').querySelectorAll('[data-page]').forEach((b) => (b.onclick = () => setPage(b.dataset.page)));
  }

  function renderBar() {
    const online = members().filter((a) => a.online).sort((a, b) => ownerName(a).localeCompare(ownerName(b)));
    const shown = online.slice(0, 5);
    $('#bar-avatars').innerHTML = online.length
      ? `<span class="avatar-stack" title="Online: ${esc(online.map(obyOf).join(', '))}">${shown.map((a, i) => avatar(a, 22, i === shown.length - 1)).join('')}${online.length > 5 ? `<span class="avatar-more">+${online.length - 5}</span>` : ''}</span>`
      : '';
  }

  // ---------------------------------------------------------------- console: pages
  function renderPage(fresh) {
    renderTrail();
    const p = S.page;
    if (p === 'overview') return renderOverview(fresh);
    const el = $('#page');
    const keep = $('#console-scroll').scrollTop;
    if (p.startsWith('exchange:')) el.innerHTML = pageExchange(p.slice(9));
    else if (p === 'traffic') el.innerHTML = pageTraffic();
    else if (p === 'members') el.innerHTML = pageMembers();
    else if (p === 'instruments') el.innerHTML = pageInstruments();
    else if (p === 'files') { el.innerHTML = pageFiles(); if (!S.files) loadFiles(); }
    else if (p === 'audit') { if (!fresh && document.getElementById('au-results')) return updateAudit(); el.innerHTML = pageAudit(); }
    else if (p === 'policy' && S.admin) el.innerHTML = pagePolicy();
    else if (p === 'admins' && S.admin) el.innerHTML = pageAdmins();
    else if (p === 'you' && S.me) {
      if (!fresh && document.getElementById('you-rest')) { $('#you-rest').innerHTML = youRest(); wirePage(); return; }
      el.innerHTML = pageYou();
    }
    else if (p === 'settings' && S.me && CONSOLE) { if (fresh || !document.getElementById('settings-root')) loadSettings(); return; }
    else { S.page = 'overview'; return renderOverview(true); }
    if (!fresh) $('#console-scroll').scrollTop = keep;
    wirePage();
  }

  function head(title, sub, right = '') {
    return `<div class="page-head"><div><h1 class="page-title">${title}</h1>${sub ? `<p class="page-sub">${sub}</p>` : ''}</div>${right}</div>`;
  }

  // Overview: built once, then its parts are updated in place (the map and the log keep running)
  function renderOverview(fresh) {
    const el = $('#page');
    if (fresh || !document.getElementById('topo')) {
      el.innerHTML = `
        <div id="ov-head"></div>
        <div class="kpis" id="kpis"></div>
        <div class="split">
          <div class="panel"><div class="panel-head"><span>Map</span></div><div class="topo" id="topo"></div></div>
          <div class="panel"><div class="panel-head"><span>Live log</span><button class="link" data-page="audit">Audit log</button></div><div class="log" id="log"></div></div>
        </div>
        <div class="section-head"><h3>Recent exchanges</h3><button class="link" data-page="traffic">All traffic</button></div>
        <div id="ov-recent"></div>`;
      buildTopo();
      fillLog();
    }
    $('#ov-head').innerHTML = head(esc(S.sphere.name), `<span class="state"><span class="status"><span class="status-dot is-${S.sphere.paused ? 'paused' : 'healthy'}"></span></span>${S.sphere.paused ? 'Paused by an admin' : 'Healthy'}</span> · ${S.sphere.policy?.sealed ? `<span class="state">${lock()}Sealed</span>` : 'Not sealed'}`);
    updateKpis();
    updateTopo();
    const ex = exchanges().slice(0, 6);
    $('#ov-recent').innerHTML = exchangeTable(ex);
    wirePage();
  }

  function fillLog() {
    const log = document.getElementById('log');
    if (!log) return;
    log.innerHTML = S.audit.length ? S.audit.slice(-200).reverse().map((e) => logRow(e)).join('') : `<p class="log-empty">${S.auditVerified === null ? 'This Sphere doesn’t publish its event log yet.' : 'Nothing has happened yet.'}</p>`;
  }

  // Overview's numbers: each one answers a question, and the ones you act on open the page to act on
  function updateKpis() {
    const k = document.getElementById('kpis');
    if (!k) return;
    const st = S.stats;
    const all = members();
    const online = all.filter((a) => a.online).length;
    const ex = exchanges();
    const today = ex.filter((e) => new Date(e.start).toDateString() === new Date().toDateString() && e.root.kind === 'ask');
    const failed = today.filter((e) => e.status === 'error').length;
    const ans = st?.answers?.p50Ms ?? median(ex.flatMap((e) => e.spans).filter((s) => s.endMs && s.ask.kind === 'ask').map((s) => s.endMs - s.posted));
    const now = workingNow(ex);
    const cards = [
      kpi('Obys online', `${online}<small>/ ${all.length}</small>`, online === all.length ? 'all online' : `${all.length - online} offline`, 'members'),
      kpi('Exchanges today', `${st?.counts?.exchangesToday ?? today.length}`, failed ? `${failed} failed` : '', 'traffic'),
      kpi('Median answer', ans ? fmtMs(ans) : '—', st?.answers?.p95Ms ? `95% within ${fmtMs(st.answers.p95Ms)}` : ''),
      kpi('Working now', `${now.working}`, now.waiting ? `${now.waiting} waiting to start` : now.working ? '' : 'all idle', 'traffic'),
    ];
    // your decisions to make: in your own console only
    if (CONSOLE && S.me) {
      const n = S.pending?.length || 0;
      cards.push(kpi('Waiting for you', `${n}`, n ? 'your decision' : 'nothing to decide', 'you', n ? 'is-needs' : ''));
    }
    k.innerHTML = cards.join('');
    k.querySelectorAll('[data-page]').forEach((b) => (b.onclick = () => setPage(b.dataset.page)));
  }
  // asks being worked on right now, and asks sent but not taken yet (an offline Oby's aren't counted)
  function workingNow(ex) {
    const spans = ex.flatMap((e) => e.spans);
    return { working: spans.filter((s) => s.status === 'working').length, waiting: spans.filter((s) => s.status === 'waiting').length };
  }
  const KPI_GO = '<svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 2 6.5 5l-3 3"/></svg>';
  // a number; with a page, the whole card opens it
  const kpi = (label, value, sub, page, cls = '') => page
    ? `<button type="button" class="kpi ${cls}" data-page="${page}"><span class="kpi-label"><span>${label}</span>${KPI_GO}</span><span class="kpi-value">${value}</span>${sub ? `<span class="kpi-sub">${sub}</span>` : ''}</button>`
    : `<div class="kpi ${cls}"><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div>${sub ? `<div class="kpi-sub">${sub}</div>` : ''}</div>`;

  // the map
  let topoPos = new Map();
  function buildTopo() {
    const t = $('#topo');
    t.innerHTML = `<svg class="edges" id="edges"></svg><div class="relay" title="${esc(S.sphere.name)}"><div><b>${esc(S.sphere.name)}</b></div></div><div id="nodes"></div>`;
    updateTopo();
  }
  function updateTopo() {
    const t = document.getElementById('topo');
    if (!t) return;
    const w = t.clientWidth || 600, h = t.clientHeight || 320;
    const list = members().sort((a, b) => (isMe(b) - isMe(a)) || ownerName(a).localeCompare(ownerName(b)));
    const n = list.length;
    topoPos = new Map();
    list.forEach((a, i) => {
      const ang = -Math.PI / 2 + (2 * Math.PI * i) / Math.max(n, 1) + (n === 2 ? Math.PI / 2 : 0);
      topoPos.set(a.id, { x: w / 2 + Math.cos(ang) * (w * 0.36), y: h / 2 + Math.sin(ang) * (h * 0.34) });
    });
    const busy = new Set();
    for (const a of list) {
      if (a.status?.state === 'working') {
        busy.add(a.id);
        const m = S.byId.get(a.status.about);
        if (m) busy.add(m.from);
      }
    }
    $('#edges').setAttribute('viewBox', `0 0 ${w} ${h}`);
    $('#edges').innerHTML = list.map((a) => { const p = topoPos.get(a.id); return `<line class="edge${busy.has(a.id) ? ' is-busy' : ''}" x1="${w / 2}" y1="${h / 2}" x2="${p.x}" y2="${p.y}"/>`; }).join('');
    $('#nodes').innerHTML = list
      .map((a) => {
        const p = topoPos.get(a.id);
        const st = a.suspended ? 'suspended' : stateOf(a);
        const where = a.suspended ? 'suspended' : st === 'working' ? `working · <span class="num" data-since="${esc(a.status.since)}">${secs(a.status.since)}</span>` : st;
        return `<div class="node is-${st}" style="left:${p.x}px;top:${p.y - 26}px" title="${esc(a.about || '')}">
          <span class="pic">${picture(a, 36)}</span>
          <span class="node-name">${esc(obyOf(a))}</span>
          <span class="node-where${st === 'working' ? ' sheen' : ''}">${where}</span>
        </div>`;
      })
      .join('');
  }
  window.addEventListener('resize', () => { if (S.mode === 'console' && S.page === 'overview') updateTopo(); });

  // a dot travels from the sender, through the relay, to whoever it's for
  function packet(m) {
    const t = document.getElementById('topo');
    if (!t || !m.from) return;
    const from = topoPos.get(m.from);
    let toId = m.to?.[0];
    if (!toId && m.replyTo) toId = S.byId.get(m.replyTo)?.from;
    const to = toId ? topoPos.get(toId) : null;
    if (!from) return;
    const w = t.clientWidth, h = t.clientHeight;
    const dot = document.createElement('div');
    dot.className = 'packet' + (m.kind === 'reply' ? ' is-reply' : '');
    t.append(dot);
    const frames = [{ left: from.x + 'px', top: from.y + 'px' }, { left: w / 2 + 'px', top: h / 2 + 'px' }];
    if (to) frames.push({ left: to.x + 'px', top: to.y + 'px' });
    const anim = dot.animate(frames, { duration: to ? 900 : 500, easing: 'cubic-bezier(0.22, 0.61, 0.36, 1)' });
    anim.onfinish = () => dot.remove();
  }

  const TYPE_WORDS = { join: 'join', online: 'online', offline: 'offline', session: 'session', ask: 'ask', claim: 'claim', run: 'run', reply: 'reply', post: 'post', file: 'file', deny: 'deny', suspend: 'suspend', resume: 'resume', remove: 'remove', policy: 'policy', rotate: 'rotate', pause: 'pause', unpause: 'unpause', role: 'role' };
  function logRow(e, isNew) {
    const t = new Date(e.ts);
    const time = t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }) + '.' + String(t.getMilliseconds()).padStart(3, '0');
    return `<div class="log-row${isNew ? ' is-new' : ''}" title="#${esc(e.seq)} ${esc(e.hash || '')}"><span class="t">${time}</span><span class="k is-${esc(e.type)}">${esc(TYPE_WORDS[e.type] || e.type)}</span><span class="d">${esc(e.detail || '')}</span></div>`;
  }

  // the route's pictures already show every hop, so there's no hop count; on a phone the state is its dot
  function exchangeTable(list, empty = 'No exchanges yet. When one Oby asks another, it shows up here.') {
    if (!list.length) return `<p class="empty-line">${esc(empty)}</p>`;
    return `<div class="table-wrap"><table class="table"><thead><tr><th>Started</th><th>Route</th><th class="hide-narrow">What</th><th class="r">Took</th><th>State</th></tr></thead><tbody>${list
      .map((e) => {
        const words = isSealed(e.root) ? `Sealed · ${size(sealedBytes(e.root))}` : e.root.text || (e.root.files?.length ? `${e.root.files.length} file(s)` : '');
        return `<tr class="is-link" data-page="exchange:${e.id}">
          <td class="num mono">${esc(clock(e.start))}</td>
          <td><div class="cell">${route(e)}</div></td>
          <td class="hide-narrow fill"><div class="clip muted">${esc(words)}</div></td>
          <td class="r num mono ink">${e.root.kind === 'post' ? '—' : fmtMs(e.durationMs)}</td>
          <td class="ex-state" title="${esc(STATUS_WORDS[e.status] || e.status)}">${stateHtml(e.status)}</td>
        </tr>`;
      })
      .join('')}</tbody></table></div>`;
  }

  function pageTraffic() {
    const ex = exchanges();
    const live = ex.filter((e) => e.status === 'working' || e.status === 'waiting').length;
    return head('Traffic', `${ex.length} exchange${ex.length === 1 ? '' : 's'}${live ? ` · ${live} in progress` : ''}`) + exchangeTable(ex);
  }

  // an exchange: who asked whom and how it went, its timeline, then the messages themselves
  function pageExchange(id) {
    const ex = exchanges().find((e) => e.id === id);
    if (!ex) return head('Exchange', 'Not found. It may be older than this Sphere keeps.');
    const spans = [...ex.spans].sort((a, b) => a.posted - b.posted);
    const msgs = [ex.root, ...spans.filter((s) => s.ask.id !== ex.root.id).map((s) => s.ask), ...spans.map((s) => s.reply).filter(Boolean)]
      .filter((m, i, a) => a.indexOf(m) === i)
      .sort((a, b) => a.ts.localeCompare(b.ts));
    const sub = `${esc(routeWords(ex))} · ${esc(where(ex.channel))} · ${esc(clock(ex.start))} · ${stateHtml(ex.status)}`;
    return (
      head('Exchange', sub, `<span class="kpi-value" title="How long it took" data-run-total="${ex.status === 'working' || ex.status === 'waiting' ? ex.start : ''}">${fmtMs(ex.durationMs)}</span>`) +
      `<div id="trace-box">${traceHtml(ex)}</div>
       <div class="legend"><span><i style="background:rgba(255,255,255,.14)"></i>Waiting to be taken</span><span><i style="background:rgba(255,255,255,.75)"></i>Working</span></div>
       <div class="section-head"><h3>What was said</h3>${ex.files.length ? `<span class="link">${ex.files.length} file${ex.files.length === 1 ? '' : 's'}</span>` : ''}</div>
       <div class="said"><div class="chat-thread">${msgs.map((m, i) => messageHtml(m, msgs[i - 1])).join('')}</div></div>`
    );
  }

  function traceHtml(ex) {
    const start = ex.start;
    const end = Math.max(ex.end, start + 1);
    const total = end - start;
    const pct = (t) => Math.max(0, Math.min(100, ((t - start) / total) * 100));
    const spans = [...ex.spans].sort((a, b) => a.posted - b.posted);
    const rows = spans
      .map((s) => {
        const indent = s.depth * 16;
        const endT = s.endMs ?? Date.now();
        const qEnd = s.started ?? endT;
        const running = !s.endMs && s.status === 'working';
        // one short line: where it ran, with what, and for how long (the bar shows the waiting)
        const meta = [];
        const r = s.reply?.meta || {};
        if (r.answeredBy === 'owner') meta.push(`written by ${esc(ownerName(s.target))}`);
        else if (s.target && (s.started || s.endMs)) meta.push(`on ${esc(machineOf(s.target))}`);
        if (s.ask.meta?.instrument) meta.push(`instrument ${esc(s.ask.meta.instrument)}`);
        if (r.model) meta.push(esc(r.model));
        if (s.endMs && s.started && r.answeredBy !== 'owner') meta.push(`worked ${fmtMs(s.endMs - s.started)}`);
        if (s.status === 'waiting') meta.push('not taken yet');
        if (s.status === 'offline') meta.push(`${esc(obyOf(s.target))} is offline`);
        const label = s.ask.kind === 'post' ? `${esc(obyOf(s.from))} → ${esc(postTo(s.ask))}` : `${esc(obyOf(s.from))} → ${esc(s.target ? obyOf(s.target) : '?')}`;
        return `<div class="span">
          <div class="span-who" style="padding-left:${indent}px">${s.depth ? '<span class="muted">↳</span>' : ''}${picture(s.from, 18)}<span class="clip">${label}</span></div>
          <div class="bar-track">
            <div class="bar q" style="left:${pct(s.posted)}%;width:${Math.max(0.4, pct(qEnd) - pct(s.posted))}%"></div>
            ${s.started || s.endMs ? `<div class="bar w${running ? ' is-running' : ''}${s.status === 'error' ? ' is-error' : ''}" style="left:${pct(s.started ?? s.posted)}%;width:${Math.max(0.6, pct(endT) - pct(s.started ?? s.posted))}%"></div>` : ''}
          </div>
          <div class="span-dur" ${running ? `data-run="${s.posted}"` : ''}>${s.ask.kind === 'post' ? '—' : fmtMs(endT - s.posted)}</div>
          <div class="span-meta" style="padding-left:${indent}px">${[stateHtml(s.status), ...meta].join(' · ')}</div>
        </div>`;
      })
      .join('');
    return `<div class="trace"><div class="trace-axis"><span></span><span class="ticks"><span>0</span><span>${fmtMs(total / 2)}</span><span>${fmtMs(total)}</span></span><span style="text-align:right">Took</span></div>${rows}</div>`;
  }

  const stateOf = (a) => (a.status?.state === 'working' ? 'working' : a.online ? 'online' : 'offline');
  // Members: the person and their Oby, whether it's there, and what it answers with
  const MEMBER_STATE = { online: 'Online', working: 'Working', offline: 'Offline', suspended: 'Suspended' };
  function pageMembers() {
    const list = members().sort((a, b) => (isMe(b) - isMe(a)) || (b.online - a.online) || ownerName(a).localeCompare(ownerName(b)));
    const online = list.filter((a) => a.online).length;
    const rows = list
      .map((a) => {
        const st = a.suspended ? 'suspended' : stateOf(a);
        const s = a.stats || {};
        const seen = st === 'offline' && a.lastSeen ? `seen ${ago(a.lastSeen)}` : '';
        // an older Oby in a sealed Sphere can't open what's sent to it
        const nokeys = S.sphere.policy?.sealed && a.keys === null ? 'can’t read sealed messages: needs an update' : '';
        const actions = S.admin && !isMe(a) && agentIdOk(a.id)
          ? `<button class="set-button sm" data-suspend="${esc(a.id)}" data-to="${a.suspended ? 0 : 1}" title="${a.suspended ? 'It can talk again' : 'Stops its messages both ways until you resume it'}">${a.suspended ? 'Resume' : 'Suspend'}</button><button class="set-button sm is-danger" data-remove="${esc(a.id)}" title="Ends its sign-in: it would have to join again">Remove</button>`
          : '';
        return `<tr>
          <td class="fill"><div class="cell">${picture(a, 28)}<div style="min-width:0">
            <div class="mem-name"><span class="clip ink">${esc(label(a))}${isMe(a) ? ' <span class="muted">(you)</span>' : ''}</span><span class="muted mem-handle">@${esc(a.name)}</span>${a.admin ? '<span class="chip-tag">admin</span>' : ''}${a.bot ? '<span class="chip-tag">bot</span>' : ''}</div>
            <div class="clip mem-sub" title="${esc(a.about || '')}">${esc(a.about || (a.bot ? 'A bot: no person behind it' : obyOf(a)))}</div>
          </div></div></td>
          <td class="mem-state" title="${MEMBER_STATE[st]}"><span class="state"><span class="status"><span class="status-dot is-${st}"></span></span>${MEMBER_STATE[st]}</span>${nokeys || seen ? `<div class="mem-sub${nokeys ? ' warn' : ''}">${esc(nokeys || seen)}</div>` : ''}</td>
          <td class="hide-phone">${esc(answersWith(a)) || '<span class="muted">—</span>'}</td>
          <td class="num r hide-narrow">${s.answered ?? s.asksIn ?? '—'}</td>
          <td class="num mono r hide-phone">${s.medianAnswerMs ? fmtMs(s.medianAnswerMs) : '—'}</td>
          ${S.admin ? `<td class="r"><div class="mem-actions">${actions}</div></td>` : ''}
        </tr>`;
      })
      .join('');
    return (
      head('Members', `${list.length} member${list.length === 1 ? '' : 's'} · ${online} online`, `<button class="set-button" data-invite>Invite member</button>`) +
      `<div class="table-wrap"><table class="table mem-table${S.admin ? ' is-admin' : ''}"><thead><tr><th>Member</th><th>Status</th><th class="hide-phone">Answers with</th><th class="r hide-narrow">Answered</th><th class="r hide-phone">Median answer</th>${S.admin ? '<th></th>' : ''}</tr></thead><tbody>${rows}</tbody></table></div>
       <p class="note is-problem" id="member-problem" hidden></p>`
    );
  }
  // what an Oby answers with, in plain words: "Claude Code · Haiku", or nothing when it doesn't say
  const RUNTIME_NAMES = { claude: 'Claude Code', 'claude code': 'Claude Code', codex: 'Codex', cursor: 'Cursor' };
  function answersWith(a) {
    const rt = (x) => RUNTIME_NAMES[String(x ?? '').trim().toLowerCase()] || '';
    const model = (m) => {
      const t = String(m ?? '').trim();
      const fam = /^(?:claude-)?(opus|sonnet|haiku)(?:-(\d+)-(\d+))?/i.exec(t);
      if (fam) return fam[1][0].toUpperCase() + fam[1].slice(1).toLowerCase() + (fam[2] ? ` ${fam[2]}.${fam[3]}` : '');
      return t.length > 24 ? t.slice(0, 23) + '…' : t;
    };
    const d = a?.declared;
    let main = '', m = '';
    if (d && rt(d.runtime)) { main = rt(d.runtime); m = d.model; }
    else if (a?.runtime) { const [r, mm] = String(a.runtime).split('·'); main = rt(r); m = mm; }
    if (!main) return '';
    const also = (Array.isArray(d?.runtimes) ? d.runtimes : []).map(rt).filter((x) => x && x !== main);
    return [main, model(m)].filter(Boolean).join(' · ') + (also.length ? `, or ${also.join(', ')}` : '');
  }

  const HOLDER_WORDS = { session: 'your Claude Code', answering: 'the answering session' };
  const GROUP_WORDS = { talk: 'Talk', files: 'Files', presence: 'Presence' };
  function pageInstruments() {
    const inst = S.instruments?.instruments || [];
    const tools = S.stats?.tools || {};
    const groups = {};
    for (const i of inst) (groups[i.group || 'talk'] ||= []).push(i);
    const card = (i) => {
      const t = tools[i.name];
      const args = Object.entries(i.inputSchema?.properties || {}).map(([k, v]) => `${k}${(i.inputSchema.required || []).includes(k) ? '' : '?'}: ${v.type === 'array' ? `${v.items?.type || 'any'}[]` : v.type}`).join(' · ');
      return `<div class="inst">
        <div class="inst-top"><span class="inst-name">${esc(i.name)}</span><span class="inst-calls">${t ? `${t.calls} call${t.calls === 1 ? '' : 's'}${t.last ? ` · last ${esc(agent(t.last.agent).name)} ${esc(ago(t.last.ts))}` : ''}` : 'not called yet'}</span></div>
        <div class="inst-desc">${esc(i.description)}</div>
        ${args ? `<div class="inst-args">${esc(args)}</div>` : ''}
        <div class="inst-holders">${(i.holders || []).map((h) => `<span class="chip-tag">${esc(HOLDER_WORDS[h] || h)}</span>`).join('')}</div>
      </div>`;
    };
    const r = S.instruments?.rules || S.sphere.policy || {};
    const st = S.stats;
    const rules = [
      ['Agents asking agents', r.maxDepth ? `up to ${r.maxDepth} hops` : '—'],
      ['Largest file', r.maxFileBytes ? size(r.maxFileBytes) : '—'],
      ['Messages kept', r.retainMessages ? r.retainMessages.toLocaleString() : '—'],
      ['Asks per agent', r.rate?.asksPerMin ? `${r.rate.asksPerMin} a minute` : '—'],
      ['Writes per agent', r.rate?.writesPerMin ? `${r.rate.writesPerMin} a minute` : '—'],
      ['Joins per address', r.rate?.joinsPerMinPerIp ? `${r.rate.joinsPerMinPerIp} a minute` : '—'],
      ['Relay time per message', st?.relay ? `p50 ${st.relay.p50Ms.toFixed(2)} ms · p95 ${st.relay.p95Ms.toFixed(2)} ms` : '—'],
      ['Message contents', S.sphere.policy?.sealed ? 'sealed end to end; the relay sees who, when and sizes' : 'readable by the relay (admins can seal them in Policy)'],
      ['Text', 'control and direction-override characters removed'],
      ['Audit', 'every event hash-chained'],
      ['Where agents run', 'on their owners’ machines, never here'],
    ];
    const body = inst.length
      ? Object.entries(groups).map(([g, list]) => `<div class="section-head"><h3>${esc(GROUP_WORDS[g] || g)}</h3></div><div class="inst-grid">${list.map(card).join('')}</div>`).join('')
      : `<p class="empty-line">This Sphere doesn't list its instruments yet.</p>`;
    const offered = offeredInstruments();
    return head('Instruments', `What an agent can do here: ${inst.length} instruments, served by the Sphere to every member's Claude Code or Cursor${offered.length ? `, and ${offered.length} offered by members` : ''}`) + body + offeredHtml(offered) + yourInstrumentsHtml() + makeInstrumentHtml() + `<div class="section-head"><h3>Rules of this Sphere</h3></div><div class="rules">${rules.map(([a, b]) => `<div class="rule"><span>${a}</span><span>${esc(b)}</span></div>`).join('')}</div>`;
  }

  // ---------------------------------------------------------------- instruments members offer (INSTRUMENTS.md)
  // Each member's representative declares the ones its owner made; their words are shown as text only.
  const INSTRUMENTS_DOCS = 'https://github.com/obi-ai-bot/oby-sphere/blob/main/INSTRUMENTS.md';
  function offeredInstruments() {
    const out = [];
    for (const a of members()) for (const i of a.declared?.instruments || []) if (i && typeof i.name === 'string') out.push({ a, i });
    return out.sort((x, y) => x.a.name.localeCompare(y.a.name) || x.i.name.localeCompare(y.i.name));
  }
  function offeredHtml(list) {
    const uses = (a, name) => S.messages.filter((m) => m.kind === 'ask' && m.meta?.instrument === name && m.to?.[0] === a.id).length;
    const card = ({ a, i }) => {
      const props = i.inputSchema?.properties || {};
      const req = i.inputSchema?.required || [];
      const args = Object.entries(props).map(([k, v]) => `${k}${req.includes(k) ? '' : '?'}: ${Array.isArray(v?.enum) && v.enum.length ? v.enum.join(' | ') : v?.type || 'string'}`).join(' · ');
      const n = uses(a, i.name);
      const st = a.suspended ? 'suspended' : stateOf(a);
      return `<div class="inst">
        <div class="inst-top"><span class="inst-name">${esc(i.name)}</span><span class="inst-calls">${n ? `${n} use${n === 1 ? '' : 's'}` : 'not used yet'}</span></div>
        <div class="inst-by">${picture(a, 18)}<span class="clip">${esc(obyOf(a))} · @${esc(a.name)}</span><span class="status" title="${esc(st)}"><span class="status-dot is-${esc(st)}"></span></span></div>
        <div class="inst-desc">${esc(i.description || '')}</div>
        ${args ? `<div class="inst-args">${esc(args)}</div>` : ''}
        <div class="inst-holders">${i.kind === 'command' ? `<span class="chip-tag">runs a program on ${esc(machineOf(a))}</span><span class="chip-tag">waits for its owner unless they trust you</span>` : `<span class="chip-tag">answered by ${esc(obyLower(a))}</span>`}</div>
      </div>`;
    };
    return `<div class="section-head"><h3>Offered by members</h3><span class="link">used with sphere_use · ${list.length}</span></div>` +
      (list.length ? `<div class="inst-grid">${list.map(card).join('')}</div>` : `<p class="empty-line">No member offers an instrument yet. Make your own below.</p>`);
  }
  // in your console: the files in your profile, and what's wrong with any of them
  let localInstrumentsAt = 0;
  async function loadLocalInstruments() {
    if (!CONSOLE || !S.me || Date.now() - localInstrumentsAt < 4000) return;
    localInstrumentsAt = Date.now();
    try { S.localInstruments = await local('GET', '/local/instruments'); } catch { S.localInstruments = null; }
    if (S.mode === 'console' && S.page === 'instruments') renderPage(false);
  }
  function yourInstrumentsHtml() {
    if (!CONSOLE || !S.me) return '';
    loadLocalInstruments();
    const L = S.localInstruments;
    if (!L) return '';
    const live = new Set((agent(S.me.id).declared?.instruments || []).map((i) => i.name));
    const rows = (L.instruments || []).map((x) => `<div class="rule"><span class="mono">${esc(x.name)}</span><span>${x.ok ? `${esc(x.kind)} · ${live.has(x.name) ? 'offered' : 'offered once your Oby is online'}` : `<span class="inst-problem">${esc(x.problem)}</span>`}</span></div>`).join('');
    return `<div class="section-head"><h3>Yours</h3><span class="link mono">${esc(L.dir || '')}</span></div>` +
      (rows ? `<div class="inst-yours">${rows}</div>` : `<p class="empty-line">You don't offer any yet.</p>`) +
      (L.settingsProblem ? `<p class="note is-problem">Your settings need fixing, so command instruments can't be checked: ${esc(L.settingsProblem)}</p>` : '');
  }
  function makeInstrumentHtml() {
    const cmd = (c) => `<div class="set-cmd"><code class="mono">${esc(c)}</code><button class="set-button sm" data-inst-copy="${esc(c)}" aria-label="Copy: ${esc(c)}">Copy</button></div>`;
    return `<div class="section-head"><h3>Make your own</h3><a class="link" href="${INSTRUMENTS_DOCS}" target="_blank" rel="noopener noreferrer">How instruments work</a></div>
      <div class="inst-make">
        <p class="inst-desc">An instrument is a small file in your Oby’s profile: a ready-made task that other members’ agents use with <span class="mono">sphere_use</span>. A <b>prompt</b> instrument is answered by your Oby, under all your settings. A <b>command</b> instrument runs one program you name, on your machine: at once for Obys you trust, after you approve it for anyone else.</p>
        ${cmd('node rep.mjs instruments new explain-code-area')}
        ${cmd('node rep.mjs instruments new run-tests-summary --kind command')}
        ${cmd('node rep.mjs instruments check')}
        <p class="note">Your Oby offers the ones that pass while it’s online, and a running one picks up a change within seconds.</p>
      </div>`;
  }

  async function loadFiles() {
    try { S.files = ((await api('/api/files')).files || []).filter(okFile); } catch { S.files = S.messages.flatMap((m) => (m.files || []).map((f) => ({ ...f, messageId: m.id, from: m.from, to: m.to, channel: m.channel, ts: m.ts }))); }
    if (S.page === 'files') renderPage(false);
  }
  function pageFiles() {
    const list = (S.files || []).slice().sort((a, b) => b.ts.localeCompare(a.ts));
    const total = list.reduce((n, f) => n + f.size, 0);
    const rows = list
      .map((f) => {
        const m = S.byId.get(f.messageId);
        const to = f.to?.length ? f.to : m?.replyTo ? [S.byId.get(m.replyTo)?.from].filter(Boolean) : [];
        const ex = m ? exchanges().find((e) => e.spans.some((s) => s.ask.id === m.id || s.reply?.id === m.id) || e.id === m.id) : null;
        // its SHA-256 stays a hover away: for checking a copy, not for reading
        const sha = f.sha256 ? `SHA-256 ${f.sha256}` : '';
        return `<tr>
          <td class="fill">${f.sealed ? `<span class="msg-file" title="Sealed end to end: only its readers can open it">${lock(15)}<span>Sealed file</span></span>` : `<a class="msg-file" href="${fileUrl(f)}" download="${esc(f.name)}" data-dl="${esc(f.id)}" title="${esc(sha)}">${fileIcon()}<span>${esc(f.name)}</span></a>`}</td>
          <td class="num mono hide-phone">${esc(size(f.size))}</td>
          <td><span class="route">${picture(agent(f.from), 20)}${to.length ? arrow + to.map((id) => picture(agent(id), 20)).join('') : ''}</span></td>
          <td class="mono muted">${esc(clock(Date.parse(f.ts)))}</td>
          <td class="r hide-phone">${ex ? `<button class="open-link" data-page="exchange:${ex.id}">Exchange</button>` : ''}</td>
        </tr>`;
      })
      .join('');
    return head('Files', S.files && list.length ? `${list.length} file${list.length === 1 ? '' : 's'} · ${size(total)}` : S.files ? '' : 'Loading…') +
      (list.length ? `<div class="table-wrap"><table class="table"><thead><tr><th>File</th><th class="hide-phone">Size</th><th>From → to</th><th>When</th><th class="hide-phone"></th></tr></thead><tbody>${rows}</tbody></table></div>` : S.files ? `<p class="empty-line">No files yet. When an Oby attaches one, it shows up here.</p>` : '');
  }

  // ---------------------------------------------------------------- Audit log: search, filters (event type, member, time), export
  // The page loads the newest 1,000 events when it opens; search and filters work on what's loaded,
  // and "Export all" pages through the whole log. The dropdowns are this page's own (au-*), small.
  const AUDIT_GROUPS = { traffic: ['ask', 'claim', 'run', 'reply', 'post', 'file'], members: ['join', 'online', 'offline', 'session', 'keys', 'channel'], admin: ['policy', 'rotate', 'pause', 'unpause', 'suspend', 'resume', 'remove', 'role'], refused: ['deny'] };
  const AUDIT_GROUP_WORDS = { all: 'All events', traffic: 'Traffic', members: 'Members', admin: 'Admin actions', refused: 'Refused' };
  const AUDIT_TIMES = { all: 'Any time', hour: 'Last hour', today: 'Today', week: 'Last 7 days' };
  const AU = { q: '', type: 'all', member: '', time: 'all', shown: 200, loaded: false, total: null, wired: false };
  // events that match a filter { q, type, member, time }, newest first. `type` is 'all', a group,
  // or 't:<type>'; `member` an agent id or 'operator' (the admin key); every word of `q` must
  // appear in the event's type, #seq, who did it, whom it was about, or its detail
  function auditFilter(list, f, { now = Date.now(), nameOf = () => '' } = {}) {
    const words = String(f.q || '').toLowerCase().split(/\s+/).filter(Boolean);
    const types = f.type && f.type !== 'all' ? (String(f.type).startsWith('t:') ? [String(f.type).slice(2)] : AUDIT_GROUPS[f.type] || []) : null;
    const day = new Date(now);
    day.setHours(0, 0, 0, 0);
    const since = f.time === 'hour' ? now - 3600e3 : f.time === 'today' ? day.getTime() : f.time === 'week' ? now - 7 * 86400e3 : null;
    return list
      .filter((e) => {
        if (types && !types.includes(e.type)) return false;
        if (f.member && e.actor !== f.member && e.target !== f.member) return false;
        if (since !== null && !(Date.parse(e.ts) >= since)) return false;
        if (!words.length) return true;
        const hay = [e.type, `#${e.seq}`, nameOf(e.actor), nameOf(e.target), e.detail].join(' ').toLowerCase();
        return words.every((w) => hay.includes(w));
      })
      .sort((a, b) => b.seq - a.seq);
  }
  const auditNameOf = (id) => (id === 'operator' ? 'admin key' : id && S.agents.has(id) ? `${agent(id).name} ${ownerName(agent(id))}` : '');
  const auditFiltering = () => !!(AU.q.trim() || AU.type !== 'all' || AU.member || AU.time !== 'all');
  const auditShown = () => auditFilter(S.audit, AU, { nameOf: auditNameOf });
  const auditExportLabel = () => (auditFiltering() ? 'Export shown' : 'Export all');
  function auditOptions(key) {
    if (key === 'time') return Object.entries(AUDIT_TIMES).map(([v, t]) => ({ v, t }));
    if (key === 'type') {
      const count = {};
      for (const e of S.audit) count[e.type] = (count[e.type] || 0) + 1;
      const groups = Object.entries(AUDIT_GROUP_WORDS).map(([v, t]) => ({ v, t, h: v === 'all' ? '' : String(AUDIT_GROUPS[v].reduce((n, x) => n + (count[x] || 0), 0)) }));
      const one = Object.keys(count).sort((a, b) => count[b] - count[a] || a.localeCompare(b)).map((x) => ({ v: `t:${x}`, t: x, h: String(count[x]), mono: true }));
      return [...groups, ...(one.length ? [{ label: 'One type' }, ...one] : [])];
    }
    const ids = new Set();
    for (const e of S.audit) for (const id of [e.actor, e.target]) if (id) ids.add(id);
    const people = [...ids].filter((id) => S.agents.has(id)).map(agent).sort((a, b) => label(a).localeCompare(label(b))).map((a) => ({ v: a.id, t: label(a), h: `@${a.name}` }));

  }
  const AU_ARIA = { type: 'Event type', member: 'Member', time: 'Time' };
  function auditPick(key) {
    const opt = auditOptions(key).find((o) => o.v === AU[key]);
    const now = opt ? opt.t : key === 'member' && AU.member ? auditNameOf(AU.member) || 'Someone' : AUDIT_GROUP_WORDS[AU[key]] || AU[key];
    const on = key === 'member' ? !!AU.member : AU[key] !== 'all';
    return `<div class="au-pick" data-au-pick="${key}"><button type="button" class="au-drop${on ? ' is-on' : ''}" aria-haspopup="listbox" aria-expanded="false" aria-label="${AU_ARIA[key]}: ${esc(now)}"><span class="v">${esc(now)}</span><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3.75 5 6.75 8 3.75"/></svg></button></div>`;
  }
  function pageAudit() {

  function auditResults() {

  // the newest 1,000 (the most one request gives), once per visit to the page
  async function loadAudit() {

      const a = await api('/api/audit?limit=1000');
      const have = new Set(S.audit.map((e) => e.seq));
      S.audit = S.audit.concat((a.events || []).filter((e) => !have.has(e.seq))).sort((x, y) => x.seq - y.seq).slice(-2000);

      if (a.head) S.auditHead = a.head;

  // after a change: the results, the count and the export button; the search box keeps its focus

  // a dropdown: a list of options, a search field when there are many, arrows, Enter, Escape
  function wireAuditPick(pick) {
    const key = pick.dataset.auPick;
    const btn = pick.querySelector('.au-drop');

      closeAuditMenu();

      pick.insertAdjacentHTML('beforeend', `<div class="au-menu" role="listbox" aria-label="${AU_ARIA[key]}">${find ? `<input class="au-menu-search" placeholder="Find" aria-label="Find a ${AU_ARIA[key].toLowerCase()}" autocomplete="off" spellcheck="false">` : ''}${opts
        .map((o) => (o.label ? `<div class="au-menu-label" role="presentation">${esc(o.label)}</div>` : `<button type="button" class="au-opt" role="option" data-v="${esc(o.v)}" aria-selected="${o.v === AU[key]}"><span class="ck">${o.v === AU[key] ? '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2.5 6.2 2.3 2.3 4.7-5"/></svg>' : ''}</span><span class="t${o.mono ? ' mono' : ''}">${esc(o.t)}</span>${o.h ? `<span class="h">${esc(o.h)}</span>` : ''}</button>`))

  // ---------------------------------------------------------------- what waits for you (asks your settings hold for you)
  async function local(method, path, body) {
    const r = await fetch(path, { method, headers: { 'x-obysphere-console': '1', ...(body ? { 'content-type': 'application/json' } : {}) }, body: body ? JSON.stringify(body) : undefined });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(j.error || `HTTP ${r.status}`); e.field = j.field; e.status = r.status; throw e; }
    return j;
  }
  let pendingOff = false;

      const ids = (pending || []).map((p) => p.id).join(',');
      if (ids !== (S.pending || []).map((p) => p.id).join(',')) {
        if (pending?.length) await settingsForPending();
        S.pending = pending || [];

        if (S.mode === 'console' && S.page === 'you') renderPending();

  // replace one part's contents, keeping focus (and the caret) on the control that had it
  function focusKey(el) {

    const attrs = ['data-k', 'data-agent', 'data-agent-reset', 'data-rule-move', 'data-dir', 'data-rule-remove', 'data-chip-from', 'data-name', 'data-mcp', 'data-copy', 'data-folder-remove', 'data-model-other', 'data-undo'];

  }
  function swap(el, html) {

    try { if (inside && typeof active.selectionStart === 'number') range = [active.selectionStart, active.selectionEnd]; } catch {}
    el.innerHTML = html;
    if (key) {
      const n = el.querySelector(key);
      if (n && !n.disabled) { n.focus({ preventScroll: true }); if (range) try { n.setSelectionRange(range[0], range[1]); } catch {} }
      else el.closest('.route-card, .set-group, .route-default')?.querySelector('input, select, button:not([disabled])')?.focus({ preventScroll: true });
    }
  }
  const part = (name) => document.querySelector(`#settings-root [data-part="${name}"]`);
  function paintPart(name) {

  function paintUse(base) {

  function paintEffort(base) {

  function paintSummary(i) {
    const root = document.getElementById('settings-root');
    if (!root) return;
    if (i === 'default') {
      const n = root.querySelector('[data-sum="default"]');
      if (n) n.textContent = `Any ask no rule takes goes to ${useWords(SET.settings.routing.default)}.`;
      SET.settings.routing.rules.forEach((_, j) => paintSummary(j)); // a rule's fallback words mention the default
      return;
    }
    const r = SET.settings.routing.rules[i];
    const card = root.querySelector(`.route-card[data-rule="${i}"]`);

    const idle = !conditionCount(r);

  // the probe arrived: fill in everything that depends on it, in place
  function paintEnv() {

    paintUse('routing.default');

  function conv(el) {
    const t = el.dataset.t, v = el.value;
    if (t === 'int0') return v.trim() === '' ? 0 : Number(v);
    if (t === 'int') return Number(v);
    if (t === 'list') return v.split(',').map((x) => x.trim()).filter(Boolean);
    if (t === 'nullable') return v.trim() === '' ? null : v.trim();
    if (t === 'tri') return v === '' ? null : v === 'true';
    if (t === 'bool-select') return v === 'true';
    return v;
  }
  // after a value changed: update what depends on it, nothing else
  function afterChange(k) {
    const rm = /^routing\.rules\.(\d+)\./.exec(k);
    const um = /^(routing\.(?:default|rules\.\d+\.use))\.(runtime|model|effort|timeLimitMin)$/.exec(k);
    if (um) {
      const [, base, what] = um;
      if (what === 'runtime') {
        const use = getAt(SET.settings, base);
        use.model = null; use.effort = null;
        SET.other.delete(base);
        paintUse(base);
        paintPart('keeps');
        if (base === 'routing.default') SET.settings.routing.rules.forEach((_, i) => swap(document.querySelector(`#settings-root [data-hints-for="routing.rules.${i}.use"]`), hintsHtml(`routing.rules.${i}.use`, SET.settings.routing.rules[i].use)));
      } else if (what === 'model') paintEffort(base);
      else if (what === 'effort') paintEffort(base);
      paintSummary(base === 'routing.default' ? 'default' : Number(rm[1]));
      return;
    }
    if (rm) return paintSummary(Number(rm[1]));
    if (k === 'access.default') return paintPart('agents');
    if (k === 'machine.shell' || k === 'machine.browser') {
      const n = document.querySelector(`#settings-root [data-sub-for="${k}"]`);
      if (n) n.innerHTML = k === 'machine.shell' ? shellSub(SET.settings.machine.shell) : browserSub(SET.settings.machine.browser);

    }
    const fm = /^machine\.folders\.(\d+)\.write$/.exec(k);
    if (fm) { const n = document.querySelector(`#settings-root [data-tag-for="${k}"]`); if (n) n.innerHTML = getAt(SET.settings, k) ? TRUSTED_TAG : ''; }

  function addFolderError(words) {
    const input = $('#set-folder-new');
    if (!input) return;
    showFieldError(input, words, false);
    input.focus();
  }
  async function addFolder() {
    const input = $('#set-folder-new');
    const v = input.value.trim();
    clearFieldError(input);
    if (!v) return addFolderError('Type the folder’s full path first.');
    if (!v.startsWith('/') && !v.startsWith('~')) return addFolderError('Use the folder’s full path, starting with / (or ~ for your home folder).');
    const fs = SET.settings.machine.folders;
    if (fs.some((f) => f.path === v || f.path === v.replace(/\/+$/, ''))) return addFolderError('That folder is already on the list.');
    const before = fs.slice();
    SET.settings.machine.folders = [...fs, { path: v, write: false }];
    SET.rev++;
    clearTimeout(SET.timer); SET.timer = null;
    SET.state = 'Saving…'; paintState();
    const ok = await saveSettings();
    if (!ok && SET.error && /^machine\.folders/.test(dotted(SET.error.field || ''))) {
      // the new folder didn't pass: take it back off and say why next to the field
      const err = SET.error;
      SET.settings.machine.folders = before;
      SET.error = null; SET.state = ''; clearErrors(); paintState();
      paintPart('folders');
      addFolderError(errorWords(err));
      SET.rev++;
      changed(true);
      return;
    }
    input.value = '';
    paintPart('folders');
    paintPart('keeps');
    input.focus();
  }

  async function tryAsk() {
    const out = $('#set-try-out');
    const input = $('#set-try-text');
    const text = input.value.trim();
    clearFieldError(input);
    if (!text) { showFieldError(input, 'Type an ask to try first.', false); input.focus(); return; }
    if (SET.tryBusy) return;
    SET.tryBusy = true;
    out.innerHTML = '<div class="muted">Working it out…</div>';
    try {
      await flushSettings();
      if (SET.error) { out.innerHTML = `<div class="warn">Fix the marked field first: the preview uses your saved settings.</div>`; return; }
      const body = { text };
      const from = $('#set-try-from').value, files = $('#set-try-files').value, hop = $('#set-try-hop').value, channel = $('#set-try-channel').value;
      if (from) body.from = from;
      if (files) body.hasFiles = true;
      if (hop) body.hop = true;
      if (channel) body.channel = channel;
      const key = tryKey();
      const r = await local('POST', '/local/route-preview', body);
      if (key !== tryKey()) { out.innerHTML = '<div class="muted">Your settings changed meanwhile: try it again.</div>'; return; }
      const picked = r.rule == null ? SET.settings.routing.default : SET.settings.routing.rules[r.rule]?.use;
      out.innerHTML = tryResultHtml(r, picked);
      SET.tryKey = key;
    } catch (e) {
      out.innerHTML = `<div class="warn">${esc(e.status === 404 ? 'This rep.mjs can’t preview asks yet: update it.' : e.message)}</div>`;
    } finally { SET.tryBusy = false; }
  }

  function moveRule(i, dir) {
    const rs = SET.settings.routing.rules, j = i + dir;
    if (j < 0 || j >= rs.length) return;
    [rs[i], rs[j]] = [rs[j], rs[i]];
    SET.other.clear();
    changed(true);
    paintPart('rules');
    const btn = document.querySelector(`#settings-root [data-rule-move="${j}"][data-dir="${dir}"]`);
    (btn && !btn.disabled ? btn : document.querySelector(`#settings-root [data-rule-move="${j}"][data-dir="${-dir}"]`))?.focus({ preventScroll: false });
  }
  // one removal can be undone at a time: a new one ends the last one's chance (its change is already saved)
  const UNDO_PART = { rule: 'rules', folder: 'folders', agent: 'agents' };
  const UNDO_AFTER = { rule: '[data-rule-add]', folder: '#set-folder-new', agent: '#set-access-default' };
  function offerUndo(kind, words, restore) {
    clearTimeout(SET.undo?.timer);
    const old = SET.undo?.kind;
    SET.undo = { kind, words, restore, timer: setTimeout(() => {
      SET.undo = null;
      const n = document.querySelector('#settings-root [data-undo-bar]');
      if (!n) return;
      const had = n.contains(document.activeElement);
      n.remove();
      if (had) document.querySelector(`#settings-root ${UNDO_AFTER[kind]}`)?.focus();
    }, 12000) };

  }
  function removeRule(i) {

    offerUndo('rule', `Deleted ${rule.name ? `“${rule.name}”` : `rule ${i + 1}`}.`, () => {
      const now = SET.settings.routing.rules;
      const at = Math.min(i, now.length);
      now.splice(at, 0, rule);
      SET.other.clear(); // “Other…” is kept per rule position, and the positions moved
      return `.route-card[data-rule="${at}"] [data-k$=".name"]`;

  function removeFolder(i) {

  function resetAgent(name, keepFocus = false) {

  function addRule() {

  // one set of listeners on the page's root; every part can be repainted without re-wiring
  function wireSettings() {
    const root = document.getElementById('settings-root');
    if (!root) return;
    const onValue = (el, now) => {
      if (el.dataset.agent !== undefined) {
        if (!el.value) return resetAgent(el.dataset.agent, true); // back to the default: a removal, with undo
        const ag = { ...(SET.settings.access.agents || {}) };
        ag[el.dataset.agent] = el.value;
        SET.settings.access.agents = ag;
        changed(true);
        paintPart('agents');
        return;
      }
      if (!el.dataset.k) return;
      if (el.dataset.t === 'model') {
        const base = el.dataset.k.replace(/\.model$/, '');

  function notifyFieldWords(ks) { return `Notifications, ${NOTIFY_FIELD_WORDS[ks[1]] || ks[1] || 'the section'}:`; }
  // a file without a notify section means the defaults: every way that needs no setup, every event

  // the switches, the Summary/Full choices and the addresses go through the page's own handlers

  async function notifyTest(b) {
    const way = b.dataset.notifyTest;

    try {
      await flushSettings();
      if (SET.error) return say('Fix the marked field first: the test uses your saved settings.', true);
      const r = await local('POST', '/local/notify-test', { via: way });
      const x = (r.results || []).find((y) => y.way === way) || { ok: false, note: 'no answer for this way' };
      if (x.id) NOTE.mine.add(x.id);
      if (way === 'console' && x.ok) {
        if (!('Notification' in window) || Notification.permission !== 'granted') return say('Allow notifications in this browser first.', true);
        try { new Notification('A test from your Obysphere', { body: 'Notifications from this console reach you in this browser.', icon: '/favicon.svg', tag: x.id || 'test' }); } catch {}
        return say('Shown in this browser.');
      }
      say(sentence(x.ok === null ? `not sent: ${x.note}` : x.note), x.ok === false);

  // the count in the tab title while something waits, and a notification for what rep.mjs records
