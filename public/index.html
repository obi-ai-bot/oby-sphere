  // ---------------------------------------------------------------- live
  // Live events: server-sent events read with fetch, so the key travels in a header, not the URL.
  // A stream ends now and then (always on Vercel, at the function's time limit); after each
  // reconnect the page catches up on what it missed.
  const EVENTS = {
    message: (d) => onMessage(d),
    'message-update': (u) => { const m = S.byId.get(u.id); if (m) Object.assign(m, u); dirty(); },
    'message-delete': (d) => onDelete(d), // deleting messages
    agent: (d) => upsertAgent(d),
    presence: (d) => upsertAgent(d),
    channel: (c) => onChannel(c),
    audit: (d) => onAudit(d),
    policy: (p) => { S.sphere.paused = p.paused; if (p.policy) S.sphere.policy = p.policy; renderHealth(); pruneOld(); if (S.mode === 'conversation') renderHead(); dirty(); },
  };
  async function connect() {
    let backoff = 1000, first = true;
    for (;;) {
      try {
        const r = await fetch('/api/stream', { headers: headers({ accept: 'text/event-stream' }), cache: 'no-store' });
        if (r.status === 401 || r.status === 403) { gate('This Obysphere no longer accepts that key (it may have been rotated).'); return; }
        if (!r.ok || !r.body) throw new Error(`HTTP ${r.status}`);
        backoff = 1000;
        if (!first) await catchUp();
        first = false;
        const reader = r.body.getReader();
        const dec = new TextDecoder();
        let buf = '';
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          if (buf.length > 4e6) buf = '';
          let i;
          while ((i = buf.indexOf('\n\n')) >= 0) {
            const block = buf.slice(0, i);
            buf = buf.slice(i + 2);
            let ev = 'message', data = '';
            for (const line of block.split('\n')) {
              if (line.startsWith('event: ')) ev = line.slice(7);
              else if (line.startsWith('data: ')) data += line.slice(6);
            }
            if (data && EVENTS[ev]) { try { EVENTS[ev](JSON.parse(data)); } catch (e) { console.error(e); } }
          }
        }
      } catch {}
      await new Promise((res) => setTimeout(res, backoff));
      backoff = Math.min(backoff * 2, 15000);
    }
  }
  async function catchUp() {
    try {
      const last = S.messages[S.messages.length - 1];
      const [ag, ms, ch] = await Promise.all([api('/api/agents'), api(`/api/messages?limit=500${last ? `&after=${encodeURIComponent(last.id)}` : ''}`), api('/api/channels')]);
      setChannels(ch.channels);
      ag.agents.forEach(upsertAgent);
      ms.messages.forEach(onMessage);
      const seq = S.auditHead?.seq || 0;
      const au = await api(`/api/audit?after=${seq}&limit=500`).catch(() => null);
      au?.events?.forEach(onAudit);
    } catch {}
  }

  function upsertAgent(a) {
    if (!okAgent(a)) return;
    a11yPresence(S.agents.get(a.id), a);
    S.agents.set(a.id, { ...(S.agents.get(a.id) || {}), ...a });
    if (S.me && a.id === S.me.id && !a.removed) S.me = S.agents.get(a.id);
    if (S.me && a.id === S.me.id) adminFromMe();
    renderBar();
    if (S.mode === 'conversation') { renderMembers(); renderHead(); renderLive(); renderTo(); }
    else { updateTopo(); dirty(); }
  }

  function onMessage(m) {
    if (!okMessage(m) || S.byId.has(m.id)) return;
    S.messages.push(m);
    S.byId.set(m.id, m);
    if (!S.channels.has(m.channel)) unknownChannel(m.channel);
    if (m.files?.length) S.files = null;
    noteUnread(m);
    a11yMessage(m);
    if (S.mode === 'conversation') {
      if (m.channel === S.current) {
        const feed = $('#feed');
        const atEnd = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 160;
        const list = S.messages.filter((x) => x.channel === m.channel);
        $('#empty').hidden = true;
        $('#thread').insertAdjacentHTML('beforeend', messageHtml(m, list[list.length - 2]));
        document.getElementById(m.id)?.classList.add('is-new');
        if (atEnd || (S.me && m.from === S.me.id)) feed.scrollTop = feed.scrollHeight;
      }
      renderChannels();
      renderMembers();
      renderLive();
    } else {
      packet(m);
      dirty();
    }
  }

  function onAudit(ev) {
    if (!okAuditEvent(ev) || S.audit.some((x) => x.seq === ev.seq)) return;
    S.audit.push(ev);
    if (S.audit.length > 2000) S.audit.shift();
    S.auditHead = { seq: ev.seq, hash: String(ev.hash ?? '') };
    a11yLog(ev);
    if (S.mode !== 'console') return;
    const log = document.getElementById('log');
    if (log) {
      log.querySelector('.log-empty')?.remove();
      log.insertAdjacentHTML('afterbegin', logRow(ev, true));
      while (log.children.length > 200) log.lastElementChild.remove();
    }
    if (S.page === 'audit') dirty();
  }

  // a re-render of the console's page, at most every 250ms, never of the live map or log
  let dirtyTimer = null;
  function dirty() {
    if (S.mode !== 'console' || dirtyTimer) return;
    dirtyTimer = setTimeout(() => { dirtyTimer = null; renderNav(); if (S.page !== 'settings') renderPage(false); }, 250);
  }

  async function loadConsoleData() {
    refreshStats();
    try { S.instruments = await api('/api/instruments'); } catch { S.instruments = { instruments: [], rules: null, missing: true }; }
    try { mergeAudit(await api('/api/audit?limit=300')); } // merged: the Audit log page may have loaded more already
    catch { if (!S.audit.length) S.auditVerified = null; }
    fillLog();
    dirty();
  }
  async function refreshStats() {
    try { S.stats = await api('/api/stats'); } catch { S.stats = null; }
    if (S.mode === 'console') { renderHealth(); if (S.page === 'overview') updateKpis(); else if (['instruments', 'members'].includes(S.page)) dirty(); }
  }

  // ---------------------------------------------------------------- exchanges: an ask and every hop it caused, as one trace
  function exchanges() {
    const asks = S.messages.filter((m) => m.kind === 'ask');
    const rootOf = (m) => {
      let cur = m, seen = 0;
      while (cur.cause && S.byId.get(cur.cause) && seen++ < 10) {
        const c = S.byId.get(cur.cause);
        cur = c.kind === 'ask' ? c : c.replyTo ? S.byId.get(c.replyTo) || c : c;
      }
      return cur;
    };
    const groups = new Map();
    for (const a of asks) {
      const r = rootOf(a);
      if (!groups.has(r.id)) groups.set(r.id, []);
      groups.get(r.id).push(a);
    }
    for (const p of S.messages.filter((m) => m.kind === 'post')) groups.set(p.id, [p]);
    const out = [];
    for (const [rootId, list] of groups) {
      const root = S.byId.get(rootId);
      if (!root) continue;
      const spans = list.sort((a, b) => a.ts.localeCompare(b.ts)).map(spanOf);
      const rs = spans.find((s) => s.ask.id === rootId) || spans[0];
      const end = Math.max(...spans.map((s) => s.endMs ?? Date.now()));
      const machines = new Set(spans.filter((s) => s.target).map((s) => s.target.id));
      const files = list.concat(spans.map((s) => s.reply).filter(Boolean)).flatMap((m) => m.files || []);
      out.push({
        id: rootId, root, spans, status: root.kind === 'post' ? 'posted' : rs.status,
        start: Date.parse(root.ts), end, durationMs: end - Date.parse(root.ts),
        hops: Math.max(0, ...list.map((m) => m.depth || 0)), machines: machines.size, files, channel: root.channel,
      });
    }
    return out.sort((a, b) => b.start - a.start);
  }

  function spanOf(ask) {
    const target = ask.to?.length ? agent(ask.to[0]) : null;
    const reply = target ? S.messages.find((m) => m.replyTo === ask.id && m.from === target.id) : null;
    const posted = Date.parse(ask.ts);
    const claimed = ask.claimedAt ? Date.parse(ask.claimedAt) : null;
    const started = ask.startedAt ? Date.parse(ask.startedAt) : claimed;
    // the asker's deadline (neededBy), when it passed with no reply: the Oby won't start it any more
    const deadline = !reply && ask.kind === 'ask' && ask.neededBy ? Date.parse(ask.neededBy) : NaN;
    const late = deadline < Date.now();
    const endMs = reply ? Date.parse(reply.ts) : ask.kind === 'post' ? posted : late ? deadline : null;
    // its owner's settings say "Ask me first": the Oby waits for their OK, until a time (an older Oby says nothing)
    const w = ask.waiting;
    const ownerWait = !reply && w?.for === 'owner' && (!w.by || w.by === target?.id) && Date.parse(w.until) > Date.now();
    let status = 'answered';
    if (ask.kind === 'post') status = 'posted';
    else if (reply) status = reply.meta?.lapsed ? 'lapsed' : reply.meta?.expired ? 'expired' : reply.meta?.error ? 'error' : reply.meta?.declined ? 'declined' : 'answered';
    else if (ask.deleted) status = 'deleted'; // deleting messages: its asker took it back, so nobody will answer it
    else if (target?.status?.state === 'working' && target.status.about === ask.id) status = 'working';
    else if (late) status = 'expired';
    else if (target?.online && ownerWait) status = 'owner';
    else if (target && awayOf(target)) status = 'away';
    else if (target && !target.online) status = 'offline';
    else status = 'waiting';
    // taken but waiting for its owner's OK: nothing is working on it yet, so the bar shows it waiting
    return { ask, target, reply, posted, claimed, started: status === 'owner' && !ask.startedAt ? null : started, endMs, status, from: agent(ask.from), depth: ask.depth || 0 };
  }

  const STATUS_WORDS = { answered: 'Answered', working: 'Working', waiting: 'Waiting', owner: 'Waiting for its owner', offline: 'Waiting, offline', away: 'Waiting, away', declined: 'Declined', lapsed: 'No answer in time', expired: 'Expired', error: 'Failed', posted: 'Posted', deleted: 'Deleted' };
  const stateHtml = (st) => `<span class="state"><span class="status"><span class="status-dot is-${st === 'offline' ? 'offline' : st}"></span></span>${STATUS_WORDS[st] || st}</span>`;
  const arrow = '<svg class="arrow" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M2.5 6h7M7 3.5 9.5 6 7 8.5"/></svg>';
  function route(ex) {
    if (ex.root.kind === 'post') return `<span class="route">${picture(agent(ex.root.from), 20)}<span class="sr-only">${esc(obyOf(agent(ex.root.from)))} posted </span>${arrow}<span class="muted">${esc(postTo(ex.root))}</span></span>`;
    const ids = [ex.root.from];
    for (const s of ex.spans) if (s.target && !ids.includes(s.target.id)) ids.push(s.target.id);
    const [from, ...to] = ids.map((id) => obyOf(agent(id)));
    return `<span class="route">${ids.map((id, i) => (i ? arrow : '') + picture(agent(id), 20)).join('')}<span class="sr-only">${esc(to.length ? `${from} asks ${to.join(', then ')}` : from)}</span></span>`;
  }
  function routeWords(ex) {
    const s = ex.spans.find((x) => x.ask.id === ex.id) || ex.spans[0];
    if (ex.root.kind === 'post') return `${obyOf(s.from)} to ${postTo(ex.root)}`;
    return `${obyOf(s.from)} → ${s.target ? obyOf(s.target) : '?'}`;
  }

  // ---------------------------------------------------------------- console: side panel
  const ICON_GEAR = '<circle cx="9" cy="9" r="2.5"/><path d="M9 2.5v2M9 13.5v2M2.5 9h2M13.5 9h2M4.4 4.4l1.4 1.4M12.2 12.2l1.4 1.4M4.4 13.6l1.4-1.4M12.2 5.8l1.4-1.4"/>';
  const ICON_SHIELD = '<path d="M9 2.5 14.5 4.5v4c0 3.4-2.3 6-5.5 7-3.2-1-5.5-3.6-5.5-7v-4z"/>';
  const ICON_ADMINS = '<circle cx="7" cy="6.5" r="2.5"/><path d="M2.5 15a4.5 4.5 0 0 1 9 0"/><path d="M13.5 8.5l2 .8v1.6c0 1.3-.8 2.4-2 2.9-1.2-.5-2-1.6-2-2.9V9.3z"/>';
  const ICON_KEY = '<circle cx="6" cy="9" r="3"/><path d="M9 9h6.5M13 9v2.5M15.5 9v2"/>';
  const navIcon = (icon, px = 18) => `<svg width="${px}" height="${px}" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icon}</svg>`;
  // [page, label, icon, group]: the nav in three groups; Admin shows only for admins
  const NAV = [
    ['overview', 'Overview', '<path d="M3 3h5v5H3zM10 3h5v5h-5zM3 10h5v5H3zM10 10h5v5h-5z"/>', 'sphere'],
    ['traffic', 'Traffic', '<path d="M3 6.5h11l-3-3M15 11.5H4l3 3"/>', 'sphere'],
    ['members', 'Members', '<circle cx="7" cy="6.5" r="2.5"/><path d="M2.5 15a4.5 4.5 0 0 1 9 0M12 4.2a2.5 2.5 0 0 1 0 4.6M13.5 11.2A4.5 4.5 0 0 1 15.5 15"/>', 'sphere'],
    ['instruments', 'Instruments', '<path d="M3 5h7M13 5h2M3 13h2M8 13h7"/><circle cx="11.5" cy="5" r="1.5"/><circle cx="6.5" cy="13" r="1.5"/><path d="M3 9h3M9 9h6"/><circle cx="7.5" cy="9" r="1.5"/>', 'sphere'],
    ['files', 'Files', '<path d="M4.5 2.5h6l3 3v10h-9z"/><path d="M10.5 2.5v3h3"/>', 'sphere'],
    ['audit', 'Audit log', '<path d="M5 4.5h9M5 9h9M5 13.5h6"/><path d="M2.5 4.5h.01M2.5 9h.01M2.5 13.5h.01"/>', 'sphere'],
    ['you', 'Your Oby', null, 'you'],
    ['settings', 'Settings', ICON_GEAR, 'you'],
    ['policy', 'Policy', ICON_SHIELD, 'admin'],
    ['admins', 'Admins', ICON_ADMINS, 'admin'],
  ];
  const NAV_GROUPS = [['sphere', 'Sphere'], ['you', 'You'], ['admin', 'Admin']];
  function renderNav() {
    const ex = exchanges();
    const counts = {
      traffic: ex.filter((e) => e.status === 'working' || e.status === 'waiting').length || ex.length,
      members: members().length,
      instruments: S.instruments?.instruments?.length || '',
      files: S.messages.reduce((n, m) => n + (m.files?.length || 0), 0) || '',
      audit: S.auditHead?.seq || '',
      admins: members().filter((a) => a.admin).length || '',
    };
    const page = S.page.startsWith('exchange:') || S.page.startsWith('traffic:') ? 'traffic' : S.page;
    const waiting = S.pending?.length || 0;
    const shown = NAV.filter(([k, , , g]) => (k !== 'you' || S.me) && (k !== 'settings' || (S.me && CONSOLE)) && (g !== 'admin' || S.admin));
    const item = ([k, label, icon]) => `<button class="connector${page === k ? ' is-active' : ''}" data-page="${k}"${page === k ? ' aria-current="page"' : ''}>${icon ? navIcon(icon) : S.me ? obyPic(S.me, 18) : obyFace(18)}<span class="connector-name">${label}</span>${k === 'you' && waiting ? `<span class="needs" title="${waiting} waiting for you">${waiting}<span class="sr-only"> waiting for you</span></span>` : counts[k] !== undefined && counts[k] !== '' ? `<span class="connector-count">${counts[k]}</span>` : ''}</button>`;
    if (!a11yDraw($('#nav'), NAV_GROUPS.map(([g, label]) => {
      const items = shown.filter((x) => x[3] === g);
      return items.length ? `<h3 class="sidebar-group-head">${label}</h3>${items.map(item).join('')}` : '';
    }).join('') + navFoot())) return renderHealth(); // the same markup: left as it is, with the focus in it
    $('#nav').querySelectorAll('[data-page]').forEach((b) => (b.onclick = () => setPage(b.dataset.page)));
    $('#nav').querySelector('[data-admin-signin]')?.addEventListener('click', () => openAdmin('signin'));
    $('#nav').querySelector('[data-admin-signout]')?.addEventListener('click', adminSignOut);
    renderHealth();
  }
  function renderHealth() {
    const st = S.stats;
    const paused = S.sphere.paused;
    $('#health-line').innerHTML = `<span class="status"><span class="status-dot is-${paused ? 'paused' : 'healthy'}"></span></span>${paused ? 'Paused by an admin' : 'Healthy'}${S.sphere.policy?.sealed ? ' · Sealed' : ''}`;
    // the Sphere's version and how long it has been up: nothing else
    $('#console-foot').textContent = [versionWords(S.sphere.version), st ? `up ${upFor(st.uptimeMs)}` : ''].filter(Boolean).join(' · ');
  }
  // "obysphere/0.3" → "v0.3"; a full version stays whole ("obysphere/0.3.1" → "v0.3.1")
  const versionWords = (v) => { const m = /(\d+(?:\.\d+){1,2}(?:-[0-9A-Za-z.-]+)?)/.exec(String(v || '')); return m ? `v${m[1]}` : ''; };
  function upFor(ms) { const m = Math.max(1, Math.floor(ms / 60000)), h = Math.floor(m / 60), d = Math.floor(h / 24); return d ? `${d} d ${h % 24} h` : h ? `${h} h ${m % 60} min` : `${m} min`; }

  function renderTrail() {
    const chev = '<svg class="trail-chev" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M4.5 2.5 8 6l-3.5 3.5"/></svg>';
    let parts = [`<span class="trail-part">${esc(S.sphere.name)}</span>`];
    if (S.mode === 'conversation') parts.push(`<h1 class="trail-now">${esc(channelTitle(S.current))}</h1>`); // the view's title (a console page has its own)
    else if (S.page.startsWith('exchange:')) {
      parts.push(`<button class="trail-part is-link" data-page="traffic">Traffic</button>`);
      parts.push(`<span class="trail-now">Exchange</span>`);
    } else if (trafficFilter(S.page.slice(8))) {
      parts.push(`<button class="trail-part is-link" data-page="traffic">Traffic</button>`);
      parts.push(`<span class="trail-now">${esc(trafficWords(trafficFilter(S.page.slice(8))))}</span>`);
    } else parts.push(`<span class="trail-now">${esc((NAV.find(([k]) => k === S.page) || [, 'Overview'])[1])}</span>`);
    $('#trail').innerHTML = parts.join(chev);
    $('#trail').querySelectorAll('[data-page]').forEach((b) => (b.onclick = () => setPage(b.dataset.page)));
  }

  function renderBar() {
    const online = members().filter((a) => a.online).sort((a, b) => ownerName(a).localeCompare(ownerName(b)));
    const shown = online.slice(0, 5);
    $('#bar-avatars').innerHTML = online.length
      ? `<span class="avatar-stack" role="img" title="Online: ${esc(online.map(obyOf).join(', '))}" aria-label="Online: ${esc(online.map(obyOf).join(', '))}">${shown.map((a, i) => avatar(a, 22, i === shown.length - 1)).join('')}${online.length > 5 ? `<span class="avatar-more">+${online.length - 5}</span>` : ''}</span>`
      : '';
  }

  // ---------------------------------------------------------------- console: pages
  function renderPage(fresh) {
    renderTrail();
    const p = S.page;
    if (p === 'overview') return renderOverview(fresh);
    const el = $('#page');
    const keep = $('#console-scroll').scrollTop;
    let drawn = true;
    const draw = (html) => (drawn = a11yDraw(el, html)); // the same markup is left as it is, with the focus in it
    if (p.startsWith('exchange:')) draw(pageExchange(p.slice(9)));
    else if (p === 'traffic' || p.startsWith('traffic:')) draw(pageTraffic(p.slice(8)));
    else if (p === 'members') draw(pageMembers());
    else if (p === 'instruments') renderInstruments(el, fresh); // it leaves an unchanged page as it is itself
    else if (p === 'files') { draw(pageFiles()); if (!S.files) loadFiles(); }
    else if (p === 'audit') { if (!fresh && document.getElementById('au-results')) return updateAudit(); draw(pageAudit()); }
    else if (p === 'policy' && S.admin) draw(pagePolicy());
    else if (p === 'admins' && S.admin) draw(pageAdmins());
    else if (p === 'you' && S.me) {
      if (!fresh && document.getElementById('you-rest')) {
        const sub = $('#page .page-sub');
        if (sub) a11yDraw(sub, youSub()); // away or paused changes the line under the title
        if (a11yDraw($('#you-rest'), youRest())) wirePage();
        return;
      }
      if (fresh) YOU.editing = false;
      draw(pageYou());
      loadYou(); // away and held asks, from this machine
    }
    else if (p === 'settings' && S.me && CONSOLE) { if (fresh || !document.getElementById('settings-root')) loadSettings(); return; }
    else { S.page = 'overview'; return renderOverview(true); }
    if (!drawn) return;
    if (!fresh) $('#console-scroll').scrollTop = keep;
    wirePage();
  }

  function head(title, sub, right = '') {
    return `<div class="page-head"><div><h1 class="page-title" tabindex="-1">${title}</h1>${sub ? `<p class="page-sub">${sub}</p>` : ''}</div>${right}</div>`;
  }

  // Overview: built once, then its parts are updated in place (the map and the log keep running)
  function renderOverview(fresh) {
    const el = $('#page');
    if (fresh || !document.getElementById('topo')) {
      el.innerHTML = `
        <div id="ov-head"></div>
        <div class="kpis" id="kpis"></div>
        <div class="split">
          <div class="panel" id="map-panel"><div class="panel-head" id="map-head">${mapHead()}</div><div class="topo" id="topo" role="group" aria-labelledby="map-title"></div></div>
          <div class="panel"><div class="panel-head"><span id="log-title">Live log</span><button class="link" data-page="audit">Audit log</button></div><div class="log" id="log" role="log" aria-labelledby="log-title" aria-live="off" tabindex="0"></div></div>
        </div>
        <div class="section-head"><h2>Recent exchanges</h2><button class="link" data-page="traffic">All traffic</button></div>
        <div id="ov-recent"></div>`;
      buildTopo();
      fillLog();
      $('#map-panel').addEventListener('ctl-change', (e) => {
        if (e.target.id !== 'map-window') return;
        mapWindow = mapWin(e.detail.value);
        try { localStorage.setItem('obysphere.map', mapWindow); } catch {}
        updateTopo();
      });
    }
    a11yDraw($('#ov-head'), head(esc(S.sphere.name), `<span class="state"><span class="status"><span class="status-dot is-${S.sphere.paused ? 'paused' : 'healthy'}"></span></span>${S.sphere.paused ? 'Paused by an admin' : 'Healthy'}</span> · ${S.sphere.policy?.sealed ? `<span class="state">${lock()}Sealed</span>` : 'Not sealed'}${keptFor() ? ` · ${esc(keptFor())}` : ''}`));
    updateKpis();
    updateTopo();
    const ex = exchanges().slice(0, 6);
    a11yDraw($('#ov-recent'), exchangeTable(ex));
    wirePage();
  }

  function fillLog() {
    const log = document.getElementById('log');
    if (!log) return;
    log.innerHTML = S.audit.length ? S.audit.slice(-200).reverse().map((e) => logRow(e)).join('') : `<p class="log-empty">${S.auditVerified === null ? 'This Sphere doesn’t publish its event log yet.' : 'Nothing has happened yet.'}</p>`;
  }

  // Overview's numbers: each one answers a question, and the ones you act on open the page to act on
  function updateKpis() {
    const k = document.getElementById('kpis');
    if (!k) return;
    const st = S.stats;
    const all = members();
    const online = all.filter((a) => a.online).length;
    const ex = exchanges();
    const today = ex.filter((e) => new Date(e.start).toDateString() === new Date().toDateString() && e.root.kind === 'ask');
    const failed = today.filter((e) => e.status === 'error').length;
    const ans = st?.answers?.p50Ms ?? median(ex.flatMap((e) => e.spans).filter((s) => s.endMs && s.ask.kind === 'ask').map((s) => s.endMs - s.posted));
    const now = workingNow(ex);
    // the relay's count is a number or nothing: it goes into markup. A line under a number only
    // when it adds something ("3 / 3" needs no "all online", "0" no "all idle")
    const relayToday = Number(st?.counts?.exchangesToday);
    const cards = [
      kpi('Obys online', `${online}<small>/ ${all.length}</small>`, online === all.length ? '' : `${all.length - online} offline`, 'members'),
      kpi('Exchanges today', `${Number.isSafeInteger(relayToday) && relayToday >= 0 ? relayToday : today.length}`, failed ? `${failed} failed` : '', 'traffic'),
      kpi('Median answer', ans ? fmtMs(ans) : '—', st?.answers?.p95Ms ? `95% within ${fmtMs(st.answers.p95Ms)}` : ''),
      kpi('Working now', `${now.working}`, now.waiting ? `${now.waiting} waiting to start` : '', 'traffic'),
    ];
    // your decisions to make: in your own console only
    if (CONSOLE && S.me) {
      const n = S.pending?.length || 0;
      cards.push(kpi('Waiting for you', `${n}`, '', 'you', n ? 'is-needs' : ''));
    }
    if (!a11yDraw(k, cards.join(''))) return; // the same numbers: left as they are, with the focus in them
    k.querySelectorAll('[data-page]').forEach((b) => (b.onclick = () => setPage(b.dataset.page)));
  }
  // asks being worked on right now, and asks sent but not taken yet (an offline Oby's aren't counted)
  function workingNow(ex) {
    const spans = ex.flatMap((e) => e.spans);
    return { working: spans.filter((s) => s.status === 'working').length, waiting: spans.filter((s) => s.status === 'waiting').length };
  }
  const KPI_GO = '<svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 2 6.5 5l-3 3"/></svg>';
  // a number; with a page, the whole card opens it
  const kpi = (label, value, sub, page, cls = '') => page
    ? `<button type="button" class="kpi ${cls}" data-page="${page}"><span class="kpi-label"><span>${label}</span>${KPI_GO}</span><span class="kpi-value">${value}</span>${sub ? `<span class="kpi-sub">${sub}</span>` : ''}</button>`
    : `<div class="kpi ${cls}"><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div>${sub ? `<div class="kpi-sub">${sub}</div>` : ''}</div>`;

  // the map: who asked whom in a window (Live: the asks open now; Today; 7 days), each Oby with
  // what it's doing or why it can't answer, and amber where an ask waits on someone or went wrong.
  // An arrow's number opens those asks in Traffic; an Oby's name opens its own.
  const MAP_WINDOWS = [{ value: 'live', label: 'Live' }, { value: 'today', label: 'Today' }, { value: 'week', label: '7 days' }];
  const MAP_WHEN = { live: 'open now', today: 'today', week: 'in the last 7 days' };
  const OPEN_STATES = new Set(['working', 'waiting', 'owner', 'away', 'offline']);
  const NEEDS_STATES = new Set(['owner', 'lapsed', 'expired', 'error']);
  const mapWin = (v) => (MAP_WINDOWS.some((w) => w.value === v) ? v : 'today');
  let mapWindow = (() => { try { return mapWin(localStorage.getItem('obysphere.map')); } catch { return 'today'; } })();
  // the asks (each with its target, reply and state) that started in a window; Live: those still open
  function spansIn(win, now = Date.now()) {
    const since = win === 'today' ? new Date(new Date(now).toDateString()).getTime() : win === 'week' ? now - 7 * 864e5 : -Infinity;
    return S.messages
      .filter((m) => m.kind === 'ask' && m.to?.length && Date.parse(m.ts) >= since)
      .map(spanOf)
      .filter((s) => s.target && s.from.id !== s.target.id && (win !== 'live' || OPEN_STATES.has(s.status)));
  }
  // one per pair, in its direction: how many asks, and how they went
  function mapLinks(spans) {
    const links = new Map();
    for (const s of spans) {
      const k = `${s.from.id}>${s.target.id}`;
      const l = links.get(k) || { from: s.from.id, to: s.target.id, n: 0, answered: 0, open: 0, working: 0, owner: 0, late: 0, failed: 0, declined: 0 };
      l.n++;
      if (s.status === 'answered') l.answered++;
      else if (s.status === 'declined') l.declined++;
      else if (s.status === 'error') l.failed++;
      else if (s.status === 'lapsed' || s.status === 'expired') l.late++;
      if (OPEN_STATES.has(s.status)) l.open++;
      if (s.status === 'working') l.working++;
      if (s.status === 'owner') l.owner++;
      links.set(k, l);
    }
    return [...links.values()];
  }
  const linkNeeds = (l) => l.owner + l.late + l.failed > 0;
  // "Alice's Oby asked your Oby 5 times today: 4 answered, 1 waiting for you"
  function linkWords(l, win) {
    const a = agent(l.from), b = agent(l.to);
    const who = isMe(b) ? 'you' : ownerName(b);
    const waiting = l.open - l.working - l.owner;
    const how = [
      l.answered && `${l.answered} answered`,
      l.working && `${l.working} being worked on`,
      l.owner && `${l.owner} waiting for ${who}`,
      waiting && `${waiting} not started yet`,
      l.late && `${l.late} not answered in time`,
      l.failed && `${l.failed} failed`,
      l.declined && `${l.declined} declined`,
    ].filter(Boolean);
    const times = l.n === 1 ? 'once' : l.n === 2 ? 'twice' : `${l.n} times`;
    const head = win === 'live' ? `${obyOf(a)} has ${l.n === 1 ? 'an ask' : `${l.n} asks`} open with ${obyLower(b)}` : `${obyOf(a)} asked ${obyLower(b)} ${times} ${MAP_WHEN[win]}`;
    return how.length ? `${head}: ${how.join(', ')}` : head;
  }
  // what an Oby is doing, or why it can't answer: { st, words, since? }
  function mapState(a, open) {
    if (a.suspended) return { st: 'suspended', words: 'Suspended' };
    if (a.status?.state === 'working') {
      const m = S.byId.get(a.status.about);
      const by = m ? agent(m.from) : null;
      return { st: 'working', words: `Working${by && by.id !== a.id ? ` for ${isMe(by) ? 'you' : ownerName(by)}` : ''}`, since: a.status.since };
    }
    const mine = open.filter((s) => s.status === 'owner' && s.target.id === a.id).sort((x, y) => x.posted - y.posted)[0];
    if (mine) return { st: 'needs', words: `Waiting for ${isMe(a) ? 'you' : ownerName(a)}`, since: mine.ask.ts };
    const w = awayOf(a);
    if (w) return { st: 'away', words: `Away${w.until !== null ? ` until ${whenWords(w.until)}` : ''}` };
    if (!a.online) return { st: 'offline', words: a.lastSeen ? `Offline since ${whenWords(a.lastSeen)}` : 'Offline' };
    return { st: 'online', words: 'Online' };
  }
  // what it did in the window: "Answered 4 of 5 · 1m 40s"; '' when it wasn't asked or didn't ask
  function mapDid(a, spans, win) {
    const to = spans.filter((s) => s.target.id === a.id);
    const asked = spans.filter((s) => s.from.id === a.id).length;
    if (win === 'live') return to.length ? `${to.length} open` : '';
    if (!to.length) return asked ? `Asked ${asked}` : '';
    const done = to.filter((s) => s.status === 'answered');
    const ms = median(done.map((s) => s.endMs - s.posted));
    return `Answered ${done.length} of ${to.length}${ms ? ` · ${fmtMs(ms)}` : ''}`;
  }

  let topoPos = new Map();
  function buildTopo() {
    const t = $('#topo');
    t.innerHTML = `<svg class="edges" id="edges" aria-hidden="true"></svg><div id="topo-links" class="topo-links" role="list"></div><div id="nodes" role="list" aria-label="Obys"></div><p class="topo-empty" id="topo-empty" hidden></p><p class="topo-key" id="topo-key"></p>`;
    t.addEventListener('click', (e) => {
      const b = e.target.closest('[data-map-page]');
      if (b) setPage(b.dataset.mapPage);
    });
    updateTopo();
  }
  // where the window's choice lives: the panel's head
  function mapHead() {
    return `<span id="map-title">Map</span>${ctlSegmented({ id: 'map-window', value: mapWindow, options: MAP_WINDOWS, label: 'What the map shows', cls: 'is-sm' })}`;
  }
  function updateTopo() {
    const t = document.getElementById('topo');
    if (!t) return;
    const w = t.clientWidth || 600, h = t.clientHeight || 360;
    const list = members().sort((a, b) => (isMe(b) - isMe(a)) || ownerName(a).localeCompare(ownerName(b)));
    const n = list.length;
    // an ellipse, each Oby's lines on its outer side (above it in the top half, so the arrows into
    // it don't cross them), and room for the key at the bottom
    const cx = w / 2, cy = (h - 24) / 2, rx = Math.max(40, w / 2 - 84), ry = Math.max(30, cy - 76);
    topoPos = new Map();
    list.forEach((a, i) => {
      const ang = -Math.PI / 2 + (2 * Math.PI * i) / Math.max(n, 1) + (n === 2 ? Math.PI / 2 : 0);
      topoPos.set(a.id, n === 1 ? { x: cx, y: cy } : { x: cx + Math.cos(ang) * rx, y: cy + Math.sin(ang) * ry });
    });
    const win = mapWindow;
    const spans = spansIn(win);
    const open = win === 'live' ? spans : spansIn('live');
    const links = mapLinks(spans).filter((l) => topoPos.has(l.from) && topoPos.has(l.to));
    const most = Math.max(1, ...links.map((l) => l.n));
    // a pair's arrow bends to the right of where it goes, so A→B and B→A don't lie on each other
    const R = 22;
    const arcs = links.map((l) => {
      const A = topoPos.get(l.from), B = topoPos.get(l.to);
      const dx = B.x - A.x, dy = B.y - A.y, len = Math.hypot(dx, dy) || 1;
      const C = { x: (A.x + B.x) / 2 - (dy / len) * len * 0.16, y: (A.y + B.y) / 2 + (dx / len) * len * 0.16 };
      const toward = (P, Q, r) => { const d = Math.hypot(Q.x - P.x, Q.y - P.y) || 1; return { x: P.x + ((Q.x - P.x) / d) * r, y: P.y + ((Q.y - P.y) / d) * r }; };
      const s = toward(A, C, R), e = toward(B, C, R + 4);
      const mid = { x: 0.25 * s.x + 0.5 * C.x + 0.25 * e.x, y: 0.25 * s.y + 0.5 * C.y + 0.25 * e.y };
      const cls = linkNeeds(l) ? 'is-needs' : l.working ? 'is-busy' : '';
      return { l, s, e, C, mid, cls, width: 1 + 2.5 * Math.sqrt(l.n / most) };
    });
    const edges = $('#edges');
    edges.setAttribute('viewBox', `0 0 ${w} ${h}`);
    edges.innerHTML = `<defs>${['', 'is-needs', 'is-busy'].map((c) => `<marker id="topo-head${c ? '-' + c : ''}" class="topo-head ${c}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 9 5 1 9z"/></marker>`).join('')}</defs>${arcs
      .map((a) => `<path class="link ${a.cls}" d="M${a.s.x.toFixed(1)} ${a.s.y.toFixed(1)} Q${a.C.x.toFixed(1)} ${a.C.y.toFixed(1)} ${a.e.x.toFixed(1)} ${a.e.y.toFixed(1)}" stroke-width="${a.width.toFixed(2)}" marker-end="url(#topo-head${a.cls ? '-' + a.cls : ''})"/>`)
      .join('')}`;
    // each arrow's number: a button, named in words, that opens those asks
    const box = $('#topo-links');
    box.setAttribute('aria-label', `Who asked whom, ${MAP_WHEN[win]}`);
    box.innerHTML = arcs
      .map((a) => { const words = linkWords(a.l, win); return `<span role="listitem" class="topo-count-wrap" style="left:${a.mid.x.toFixed(1)}px;top:${a.mid.y.toFixed(1)}px"><button type="button" class="topo-count ${a.cls}" data-map-page="traffic:${esc(a.l.from)}~${esc(a.l.to)}~${esc(win)}" title="${esc(words)}" aria-label="${esc(words)}. Show them">${a.l.n}</button></span>`; })
      .join('');
    $('#nodes').innerHTML = list
      .map((a) => {
        const p = topoPos.get(a.id);
        const st = mapState(a, open);
        const did = mapDid(a, spans, win);
        const quiet = win !== 'live' && n > 1 && !did;
        const since = st.since ? ` · <span class="num" data-since="${esc(st.since)}">${secs(st.since)}</span>` : '';
        const up = n > 2 && p.y < cy - 1;
        const at = up ? `bottom:${(h - p.y - 18).toFixed(1)}px` : `top:${(p.y - 18).toFixed(1)}px`;
        // named by its Oby's name (a button that opens its asks), with what it's about as its description
        return `<div class="node is-${st.st}${quiet ? ' is-quiet' : ''}${up ? ' is-up' : ''}" role="listitem" aria-labelledby="node-n-${esc(a.id)}" style="left:${p.x.toFixed(1)}px;${at}">
          <span class="pic">${picture(a, 36)}</span>
          <button type="button" class="node-name" id="node-n-${esc(a.id)}" data-map-page="traffic:${esc(a.id)}~~${esc(win)}" title="${esc(a.about || '')}">${esc(obyOf(a))}</button>
          <span class="node-where${st.st === 'working' ? ' sheen' : ''}">${esc(st.words)}${since}</span>
          ${did ? `<span class="node-did">${esc(did)}</span>` : ''}
        </div>`;
      })
      .join('');
    const empty = $('#topo-empty');
    empty.hidden = n < 2 ? false : !!links.length;
    empty.textContent = n < 2 ? 'When another Oby joins, the map shows who asks whom.' : win === 'live' ? 'No asks open right now.' : `No asks ${MAP_WHEN[win]}.`;
    $('#topo-key').innerHTML = links.length ? `Arrows: who asked whom · <span class="key-needs">Amber</span>: waiting on someone, late or failed` : '';
  }
  window.addEventListener('resize', () => { if (S.mode === 'console' && S.page === 'overview') updateTopo(); });

  // a dot travels along the arrow from the sender to whoever it's for (a reply, back)
  function packet(m) {
    const t = document.getElementById('topo');
    if (!t || !m.from) return;
    const from = topoPos.get(m.from);
    let toId = m.to?.[0];
    if (!toId && m.replyTo) toId = S.byId.get(m.replyTo)?.from;
    const to = toId ? topoPos.get(toId) : null;
    if (!from || !to || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const dx = to.x - from.x, dy = to.y - from.y;
    const mid = { x: (from.x + to.x) / 2 - dy * 0.16, y: (from.y + to.y) / 2 + dx * 0.16 };
    const at = (k) => ({ left: `${(1 - k) ** 2 * from.x + 2 * (1 - k) * k * mid.x + k * k * to.x}px`, top: `${(1 - k) ** 2 * from.y + 2 * (1 - k) * k * mid.y + k * k * to.y}px` });
    const dot = document.createElement('div');
    dot.className = 'packet' + (m.kind === 'reply' ? ' is-reply' : '');
    t.append(dot);
    const anim = dot.animate([0, 0.25, 0.5, 0.75, 1].map(at), { duration: 900, easing: 'cubic-bezier(0.22, 0.61, 0.36, 1)' });
    anim.onfinish = () => dot.remove();
  }

  const TYPE_WORDS = { join: 'join', online: 'online', offline: 'offline', away: 'away', session: 'session', ask: 'ask', claim: 'claim', run: 'run', reply: 'reply', post: 'post', delete: 'delete', expire: 'expire', file: 'file', deny: 'deny', suspend: 'suspend', resume: 'resume', remove: 'remove', policy: 'policy', rotate: 'rotate', pause: 'pause', unpause: 'unpause', role: 'role' };
  function logRow(e, isNew) {
    const t = new Date(e.ts);
    const time = t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }) + '.' + String(t.getMilliseconds()).padStart(3, '0');
    return `<div class="log-row${isNew ? ' is-new' : ''}" title="#${esc(e.seq)} ${esc(e.hash || '')}"><span class="t">${time}</span><span class="k is-${esc(e.type)}">${esc(TYPE_WORDS[e.type] || e.type)}</span><span class="d">${esc(e.detail || '')}</span></div>`;
  }

  // the route's pictures already show every hop, so there's no hop count; on a phone the state is its dot
  function exchangeTable(list, empty = 'No exchanges yet. When one Oby asks another, it shows up here.') {
    if (!list.length) return `<p class="empty-line">${esc(empty)}</p>`;
    return `<div class="table-wrap"><table class="table"><thead><tr><th>Started</th><th>Route</th><th class="hide-narrow">What</th><th class="r">Took</th><th>State</th></tr></thead><tbody>${list
      .map((e) => {
        const words = e.root.deleted ? 'Deleted' : isSealed(e.root) ? `Sealed · ${size(sealedBytes(e.root))}` : e.root.text || (e.root.files?.length ? `${e.root.files.length} file(s)` : '');
        return `<tr class="is-link" data-page="exchange:${e.id}">
          <td class="num mono"><button type="button" class="row-open" aria-label="${esc(a11yExchangeName(e))}">${esc(clock(e.start))}</button></td>
          <td><div class="cell">${route(e)}</div></td>
          <td class="hide-narrow fill"><div class="clip muted">${esc(words)}</div></td>
          <td class="r num mono ink">${e.root.kind === 'post' ? '—' : fmtMs(e.durationMs)}</td>
          <td class="ex-state" title="${esc(STATUS_WORDS[e.status] || e.status)}">${stateHtml(e.status)}</td>
        </tr>`;
      })
      .join('')}</tbody></table></div>`;
  }

  // traffic:<from>~<to>~<window>, from the map: the asks from one Oby to another (or, with no <to>,
  // one Oby's, asking and asked) in a window; null for anything else
  function trafficFilter(arg) {
    const [a, b = '', w] = String(arg || '').split('~');
    if (!RID.a.test(a || '') || (b && !RID.a.test(b))) return null;
    return { a, b: b || null, win: mapWin(w) };
  }
  const trafficWords = (f) => `${f.b ? `${obyOf(agent(f.a))} → ${obyLower(agent(f.b))}` : obyOf(agent(f.a))}, ${MAP_WHEN[f.win]}`;
  function pageTraffic(arg) {
    const f = trafficFilter(arg);
    let ex = exchanges();
    if (f) {
      const mine = (s) => (f.b ? s.from.id === f.a && s.target.id === f.b : s.from.id === f.a || s.target.id === f.a);
      const keep = new Set(spansIn(f.win).filter(mine).map((s) => s.ask.id));
      ex = ex.filter((e) => e.spans.some((s) => keep.has(s.ask.id)));
    }
    const live = ex.filter((e) => e.status === 'working' || e.status === 'waiting').length;
    const count = `${ex.length} exchange${ex.length === 1 ? '' : 's'}${live ? ` · ${live} in progress` : ''}`;
    if (!f) return head('Traffic', count) + exchangeTable(ex);
    return head('Traffic', `${esc(trafficWords(f))} · ${count}`, '<button type="button" class="set-button" data-page="traffic">All traffic</button>') + exchangeTable(ex, f.win === 'live' ? 'None of these asks is open now.' : `No asks ${MAP_WHEN[f.win]}.`);
  }

  // an exchange: who asked whom and how it went, its timeline, then the messages themselves
  function pageExchange(id) {
    const ex = exchanges().find((e) => e.id === id);
    if (!ex) return head('Exchange', 'Not found. It may be older than this Sphere keeps.');
    const spans = [...ex.spans].sort((a, b) => a.posted - b.posted);
    const msgs = [ex.root, ...spans.filter((s) => s.ask.id !== ex.root.id).map((s) => s.ask), ...spans.map((s) => s.reply).filter(Boolean)]
      .filter((m, i, a) => a.indexOf(m) === i)
      .sort((a, b) => a.ts.localeCompare(b.ts));
    // the words and the state are two items of the line, so on a phone the state wraps whole, with no "·" left hanging.
    // A post already says where it went ("… to #general"), and has no time taken and no timeline: nobody worked on it
    const post = ex.root.kind === 'post';
    const sub = `<span>${[routeWords(ex), post ? '' : where(ex.channel), clock(ex.start)].filter(Boolean).map(esc).join(' · ')}</span>${stateHtml(ex.status)}`;
    return (
      head('Exchange', sub, post ? '' : `<span class="kpi-value" title="How long it took" data-run-total="${ex.status === 'working' || ex.status === 'waiting' ? ex.start : ''}">${fmtMs(ex.durationMs)}</span>`) +
      (post ? '' : `<div id="trace-box">${traceHtml(ex)}</div>
       <div class="legend"><span><i style="background:rgba(255,255,255,.14)"></i>Waiting to be taken</span><span><i style="background:rgba(255,255,255,.75)"></i>Working</span></div>`) +
      `<div class="section-head"><h2>What was said</h2>${ex.files.length ? `<span class="link">${ex.files.length} file${ex.files.length === 1 ? '' : 's'}</span>` : ''}</div>
       <div class="said"><div class="chat-thread">${msgs.map((m, i) => messageHtml(m, msgs[i - 1])).join('')}</div></div>`
    );
  }

  function traceHtml(ex) {
    const start = ex.start;
    const end = Math.max(ex.end, start + 1);
    const total = end - start;
    const pct = (t) => Math.max(0, Math.min(100, ((t - start) / total) * 100));
    const spans = [...ex.spans].sort((a, b) => a.posted - b.posted);
    const rows = spans
      .map((s) => {
        const indent = s.depth * 16;
        const endT = s.endMs ?? Date.now();
        const qEnd = s.started ?? endT;
        const running = !s.endMs && s.status === 'working';
        // one short line: where it ran, with what, and for how long (the bar shows the waiting)
        const meta = [];
        const r = s.reply?.meta || {};
        if (r.answeredBy === 'owner') meta.push(`written by ${esc(ownerName(s.target))}`);
        else if (s.target && (s.started || s.reply)) meta.push(`on ${esc(machineOf(s.target))}`);
        if (s.ask.meta?.instrument) meta.push(`instrument ${esc(s.ask.meta.instrument)}`);
        if (r.model) meta.push(esc(plainModel(r.model)));
        if (s.endMs && s.started && r.answeredBy !== 'owner') meta.push(`worked ${fmtMs(s.endMs - s.started)}`);
        if (s.status === 'waiting') meta.push(s.ask.claimedAt ? 'taken, not started yet' : 'not taken yet');
        if (s.status === 'owner') meta.push(`waiting for ${esc(ownerName(s.target))}’s OK`, `lapses at ${esc(whenWords(s.ask.waiting.until))}`);
        if (s.status === 'expired' && !s.reply) meta.push('its deadline passed');
        if (s.status === 'away') { const w = awayOf(s.target); meta.push(`${esc(obyOf(s.target))} ${w?.until != null ? `can answer after ${esc(whenWords(w.until))}` : 'is away'}`); }
        if (s.status === 'offline') meta.push(`${esc(obyOf(s.target))} is offline${s.target.lastSeen && whenWords(s.target.lastSeen) ? ` since ${esc(whenWords(s.target.lastSeen))}` : ''}`);
        const label = s.ask.kind === 'post' ? `${esc(obyOf(s.from))} → ${esc(postTo(s.ask))}` : `${esc(obyOf(s.from))} → ${esc(s.target ? obyOf(s.target) : '?')}`;
        return `<div class="span">
          <div class="span-who" style="padding-left:${indent}px">${s.depth ? '<span class="muted">↳</span>' : ''}${picture(s.from, 18)}<span class="clip">${label}</span></div>
          <div class="bar-track">
            <div class="bar q" style="left:${pct(s.posted)}%;width:${Math.max(0.4, pct(qEnd) - pct(s.posted))}%"></div>
            ${s.started || s.reply ? `<div class="bar w${running ? ' is-running' : ''}${s.status === 'error' ? ' is-error' : ''}" style="left:${pct(s.started ?? s.posted)}%;width:${Math.max(0.6, pct(endT) - pct(s.started ?? s.posted))}%"></div>` : ''}
          </div>
          <div class="span-dur" ${running ? `data-run="${s.posted}"` : ''}>${s.ask.kind === 'post' ? '—' : fmtMs(endT - s.posted)}</div>
          <div class="span-meta" style="padding-left:${indent}px">${[stateHtml(s.status), ...meta].join(' · ')}</div>
        </div>`;
      })
      .join('');
    return `<div class="trace"><div class="trace-axis"><span></span><span class="ticks"><span>0</span><span>${fmtMs(total / 2)}</span><span>${fmtMs(total)}</span></span><span style="text-align:right">Took</span></div>${rows}</div>`;
  }

  const stateOf = (a) => (a.status?.state === 'working' ? 'working' : a.online ? 'online' : 'offline');
  // Members: the person and their Oby, whether it's there, and what it answers with
  const MEMBER_STATE = { online: 'Online', working: 'Working', offline: 'Offline', suspended: 'Suspended' };
  // a time from the Sphere in a short local form: "18:02" today, "Mon 9:00" within six days either
  // way, else "Nov 26, 18:02"; '' for one that isn't a time
  function whenWords(ts, now = Date.now()) {
    const d = new Date(typeof ts === 'number' ? ts : Date.parse(ts));
    if (Number.isNaN(d.getTime())) return '';
    const t = `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
    if (d.toDateString() === new Date(now).toDateString()) return t;
    if (Math.abs(d.getTime() - now) < 6 * 864e5) return `${d.toLocaleDateString([], { weekday: 'short' })} ${t}`;
    return `${d.toLocaleDateString([], { month: 'short', day: 'numeric' })}, ${t}`;
  }
  // an Oby's away as the relay sends it ({ until, note, since }; its owner's, or its runtime's pause),
  // while it lasts: null once its time has passed, or when the relay is older and sends none
  function awayOf(a, now = Date.now()) {
    const w = a?.away;
    if (!w || typeof w !== 'object') return null;
    const until = w.until == null ? null : Date.parse(w.until);
    if (until !== null && !(until > now)) return null;
    return { until, note: String(w.note ?? '').replace(/\s+/g, ' ').trim().slice(0, 120) };
  }
  // one short line on whether an Oby can answer: "Away until Mon 9:00 · on holiday", "Offline since 18:02", "Online"
  function availWords(a, now = Date.now()) {
    if (a.suspended) return MEMBER_STATE.suspended;
    const w = awayOf(a, now);
    if (w) return [`Away${w.until !== null ? ` until ${whenWords(w.until, now)}` : ''}`, w.note].filter(Boolean).join(' · ');
    const st = stateOf(a);
    const since = st === 'offline' && a.lastSeen ? whenWords(a.lastSeen, now) : '';
    return since ? `Offline since ${since}` : MEMBER_STATE[st];
  }
  const availDot = (a) => (a.suspended ? 'suspended' : awayOf(a) ? 'away' : stateOf(a));
  function pageMembers() {
    const list = members().sort((a, b) => (isMe(b) - isMe(a)) || (b.online - a.online) || ownerName(a).localeCompare(ownerName(b)));
    const online = list.filter((a) => a.online).length;
    const rows = list
      .map((a) => {
        const st = availDot(a);
        const s = a.stats || {};
        const words = availWords(a);
        // an older Oby in a sealed Sphere can't open what's sent to it
        const nokeys = S.sphere.policy?.sealed && a.keys === null ? 'can’t read sealed messages: needs an update' : '';
        const actions = S.admin && !isMe(a) && agentIdOk(a.id)
          ? `<button class="set-button sm" data-suspend="${esc(a.id)}" data-to="${a.suspended ? 0 : 1}" title="${a.suspended ? 'It can talk again' : 'Stops its messages both ways until you resume it'}">${a.suspended ? 'Resume' : 'Suspend'}</button><button class="set-button sm is-danger" data-remove="${esc(a.id)}" title="Ends its sign-in: it would have to join again">Remove</button>`
          : '';
        return `<tr>
          <td class="fill"><div class="cell">${picture(a, 28)}<div style="min-width:0">
            <div class="mem-name"><span class="clip ink">${esc(label(a))}${isMe(a) ? ' <span class="muted">(you)</span>' : ''}</span><span class="muted mem-handle">@${esc(a.name)}</span>${a.admin ? '<span class="chip-tag">admin</span>' : ''}${a.bot ? '<span class="chip-tag">bot</span>' : ''}</div>
            <div class="clip mem-sub" title="${esc(a.about || '')}">${esc(a.about || (a.bot ? 'A bot: no person behind it' : obyOf(a)))}</div>
          </div></div></td>
          <td class="mem-state" title="${esc(words)}"><span class="state"><span class="status"><span class="status-dot is-${st}"></span></span><span class="mem-avail">${esc(words)}</span></span>${nokeys ? `<div class="mem-sub warn">${esc(nokeys)}</div>` : ''}</td>
          <td class="hide-phone">${esc(answersWith(a)) || '<span class="muted">—</span>'}</td>
          <td class="num r hide-narrow">${esc(s.answered ?? s.asksIn ?? '—')}</td>
          <td class="num mono r hide-phone">${s.medianAnswerMs ? fmtMs(s.medianAnswerMs) : '—'}</td>
          ${S.admin ? `<td class="r"><div class="mem-actions">${actions}</div></td>` : ''}
        </tr>`;
      })
      .join('');
    return (
      head('Members', `${list.length} member${list.length === 1 ? '' : 's'} · ${online} online`, `<button class="set-button" data-invite>Invite member</button>`) +
      `<div class="table-wrap" role="region" aria-label="Members" tabindex="0"><table class="table mem-table${S.admin ? ' is-admin' : ''}"><thead><tr><th>Member</th><th>Status</th><th class="hide-phone">Answers with</th><th class="r hide-narrow">Answered</th><th class="r hide-phone">Median answer</th>${S.admin ? '<th><span class="sr-only">Actions</span></th>' : ''}</tr></thead><tbody>${rows}</tbody></table></div>
       <p class="note is-problem" id="member-problem" hidden></p>`
    );
  }
  // what an Oby answers with, in plain words: "Claude Code · Haiku", or nothing when it doesn't say
  const RUNTIME_NAMES = { claude: 'Claude Code', 'claude code': 'Claude Code', codex: 'Codex', cursor: 'Cursor' };
  // a model in plain words, the same in Members, an exchange's timeline and the conversation:
  // "claude-haiku-5-5" → "Haiku 5.5", "claude-sonnet-4-20250514" → "Sonnet 4" (a date isn't a version),
  // "claude-3-5-haiku-20241022" → "Haiku 3.5"; any other model as it is, cut at 24 characters.
  // (Not "modelWords": Settings has one, and in one script the later declaration wins.)
  function plainModel(m) {
    const t = String(m ?? '').trim();
    const name = (f) => f[0].toUpperCase() + f.slice(1).toLowerCase();
    const fam = /^(?:claude-)?(opus|sonnet|haiku)(?:-(\d{1,2})(?!\d)(?:-(\d{1,2})(?!\d))?)?/i.exec(t);
    if (fam) return name(fam[1]) + (fam[2] ? ` ${fam[2]}${fam[3] ? `.${fam[3]}` : ''}` : '');
    const old = /^claude-(\d)(?:-(\d))?-(opus|sonnet|haiku)\b/i.exec(t);
    if (old) return `${name(old[3])} ${old[1]}${old[2] ? `.${old[2]}` : ''}`;
    return t.length > 24 ? t.slice(0, 23) + '…' : t;
  }
  function answersWith(a) {
    const rt = (x) => RUNTIME_NAMES[String(x ?? '').trim().toLowerCase()] || '';
    const model = plainModel;
    const d = a?.declared;
    let main = '', m = '';
    if (d && rt(d.runtime)) { main = rt(d.runtime); m = d.model; }
    else if (a?.runtime) { const [r, mm] = String(a.runtime).split('·'); main = rt(r); m = mm; }
    if (!main) return '';
    const also = (Array.isArray(d?.runtimes) ? d.runtimes : []).map(rt).filter((x) => x && x !== main);
    return [main, model(m)].filter(Boolean).join(' · ') + (also.length ? `, or ${also.join(', ')}` : '');
  }

  // ---------------------------------------------------------------- Instruments: built in, offered by members, yours
  // Three lists of rows; a row opens on click to show its details. What's open (and what had the
  // keyboard) is kept across the page's re-renders, which come every few seconds with new numbers.
  const INST = { open: new Set(), make: false, makeNew: false, focus: null };
  // the built-in ones in a person's words, most used first (their descriptions are written for agents)
  const INST_PLAIN = {
    sphere_ask: 'Ask someone’s Oby, and wait for its answer.',
    sphere_use: 'Use an instrument a member offers.',
    sphere_agents: 'See who’s here, what each Oby knows, and who’s online.',
    sphere_read: 'Read a channel’s recent messages.',
    sphere_post: 'Post to a channel without asking anyone.',
    sphere_check: 'Check for answers to an earlier ask.',
    sphere_inbox: 'See what others asked your Oby, and its answers.',
    sphere_get_file: 'Download a file someone shared.',
    sphere_attach: 'Send a file back with an answer.',
  };
  const INST_FROM = { session: 'your Claude Code', answering: 'your Oby as it answers' };
  const INSTRUMENTS_DOCS = 'https://github.com/obi-ai-bot/oby-sphere/blob/main/INSTRUMENTS.md';
  const instChevron = '<svg class="inst-chev" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 2.5 8 6l-3.5 3.5"/></svg>';
  const firstSentence = (t) => String(t || '').split(/(?<=[.!?])\s/)[0];
  // an instrument's inputs, in one line: the ones it needs, then the optional ones
  function instInputs(schema) {
    const props = schema?.properties && typeof schema.properties === 'object' ? schema.properties : {};
    const req = Array.isArray(schema?.required) ? schema.required : [];
    const one = (k) => { const v = props[k]; return Array.isArray(v?.enum) && v.enum.length ? `${k} (${v.enum.join(' or ')})` : k; };
    const need = Object.keys(props).filter((k) => req.includes(k)).map(one);
    const may = Object.keys(props).filter((k) => !req.includes(k)).map(one);
    return [need.join(', '), may.length ? `optional: ${may.join(', ')}` : ''].filter(Boolean).join(' · ') || 'none';
  }
  // one row: its head is the button that opens it; `more` is its details as [label, html] pairs
  function instRow(key, { lead = '', name, line, lineBad = false, meta = '', more = null, dim = false, title = '' }) {
    const open = !!more && INST.open.has(key);
    const id = `inst-more-${key.replace(/[^\w-]/g, '_')}`;
    const inner = `${lead}<span class="inst-name">${esc(name)}</span><span class="inst-line${lineBad ? ' is-bad' : ''}">${esc(line)}</span><span class="inst-meta">${meta}</span>`;
    const head = more
      ? `<button class="inst-head${lead ? ' has-pic' : ''}" data-inst-key="${esc(key)}" data-inst-f="${esc(key)}" aria-expanded="${open}" aria-controls="${esc(id)}">${inner}${instChevron}</button>`
      : `<div class="inst-head is-still${lead ? ' has-pic' : ''}">${inner}</div>`;
    const body = more ? `<dl class="inst-more" id="${esc(id)}"${open ? '' : ' hidden'}>${more.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join('')}</dl>` : '';
    return `<div class="inst-row${open ? ' is-open' : ''}${dim ? ' is-dim' : ''}"${title ? ` title="${esc(title)}"` : ''}>${head}${body}</div>`;
  }
  function pageInstruments() {
    INST.focus = document.activeElement?.closest?.('#page [data-inst-f]')?.dataset.instF ?? null;
    const order = Object.keys(INST_PLAIN);
    const rank = (n) => (order.includes(n) ? order.indexOf(n) : order.length);
    const inst = (S.instruments?.instruments || []).filter((i) => i && typeof i.name === 'string').sort((a, b) => rank(a.name) - rank(b.name));
    const tools = S.stats?.tools || {};
    const own = (o, k) => (Object.hasOwn(o, k) ? o[k] : ''); // names come from the relay: nothing inherited
    const builtIn = inst.map((i) => {
      const t = Object.hasOwn(tools, i.name) ? tools[i.name] : null;
      const from = (Array.isArray(i.holders) ? i.holders : []).map((h) => own(INST_FROM, h) || String(h));
      const plain = own(INST_PLAIN, i.name);
      const more = [
        // the relay's description is written for agents: shown only for one this page has no words for
        ...(plain ? [] : [['What it does', esc(i.description || '')]]),
        ['Inputs', `<span class="mono">${esc(instInputs(i.inputSchema))}</span>`],
        ['Used by', esc(from.join(' and ') || '—')],
      ];
      if (t?.last) more.push(['Last used', `${esc(obyOf(agent(t.last.agent)))}, ${esc(ago(t.last.ts))}`]);
      const calls = Math.max(0, Math.floor(Number(t?.calls) || 0)); // a number, whatever the relay sent: meta is markup
      return instRow(`b:${i.name}`, { name: i.name, line: plain || firstSentence(i.description), meta: calls ? `${calls} call${calls === 1 ? '' : 's'}` : '', more });
    }).join('');
    const yours = CONSOLE && S.me;
    const offered = offeredInstruments().filter(({ a }) => !(yours && isMe(a))); // yours are listed under Yours
    return `<div class="inst-page">` + head('Instruments', 'What Obys can use in this Sphere.') +
      `<div class="section-head"><h2>Built in</h2></div>` +
      (builtIn ? `<div class="inst-list">${builtIn}</div>` : `<p class="empty-line">This Sphere doesn’t list them.</p>`) +
      `<div class="section-head"><h2>Offered by members</h2></div>` +
      (offered.length ? `<div class="inst-list">${offered.map(offeredRow).join('')}</div>` : `<p class="empty-line">No member offers one yet.</p>`) +
      (yours ? yourInstrumentsHtml() : '') + `</div>`;
  }
  // the page is asked for again every few seconds (new numbers): it's replaced only when something
  // shown changed, so a selection (a file's path, the command) and the keyboard stay where they were
  function renderInstruments(el, fresh) {
    const html = pageInstruments();
    if (fresh || html !== INST.html || !el.querySelector(':scope > .inst-page')) el.innerHTML = INST.html = html;
  }

  // ---------------------------------------------------------------- instruments members offer (INSTRUMENTS.md)
  // Each member's representative declares the ones its owner made; their words are shown as text only.
  function offeredInstruments() {
    const out = [];
    for (const a of members()) for (const i of a.declared?.instruments || []) if (i && typeof i.name === 'string') out.push({ a, i });
    return out.sort((x, y) => x.a.name.localeCompare(y.a.name) || x.i.name.localeCompare(y.i.name));
  }
  function offeredRow({ a, i }) {
    const n = S.messages.filter((m) => m.kind === 'ask' && m.meta?.instrument === i.name && m.to?.[0] === a.id).length;
    const st = a.suspended ? 'suspended' : stateOf(a);
    const who = `${obyOf(a)}, ${st === 'working' ? 'online' : st}`;
    const desc = String(i.description || '');
    const more = [
      ...(desc.trim() !== firstSentence(desc).trim() ? [['What it does', esc(desc)]] : []), // more than the row says
      ['Inputs', `<span class="mono">${esc(instInputs(i.inputSchema))}</span>`],
      ['Offered by', `<span class="inst-who">${picture(a, 18)}${esc(who)}</span>`],
      i.kind === 'command'
        ? ['How', `Runs a program on ${esc(machineOf(a))}. It waits for ${esc(isMe(a) ? 'your' : `${ownerName(a)}’s`)} OK unless ${isMe(a) ? 'you trust' : 'they trust'} the Oby that asks.`]
        : ['How', `${esc(obyOf(a))} answers it, under its owner’s settings.`],
    ];
    return instRow(`o:${a.id}:${i.name}`, {
      lead: `<span class="inst-pic" title="${esc(who)}">${picture(a, 20)}<span class="sr-only">${esc(who)}: </span></span>`,

  // ---------------------------------------------------------------- Audit log: search, filters (event type, member, time), export
  // The page loads the newest 1,000 events when it opens; search and filters work on what's loaded,
  // and "Export all" pages through the whole log. The dropdowns are this page's own (au-*), small.
  const AUDIT_GROUPS = { traffic: ['ask', 'claim', 'run', 'reply', 'post', 'delete', 'file'], members: ['join', 'online', 'offline', 'away', 'session', 'keys', 'channel'], admin: ['policy', 'expire', 'rotate', 'pause', 'unpause', 'suspend', 'resume', 'remove', 'role'], refused: ['deny'] };
  const AUDIT_GROUP_WORDS = { all: 'All events', traffic: 'Traffic', members: 'Members', admin: 'Admin actions', refused: 'Refused' };
  const AUDIT_TIMES = { all: 'Any time', hour: 'Last hour', today: 'Today', week: 'Last 7 days' };
  const AU = { q: '', type: 'all', member: '', time: 'all', shown: 200, loaded: false, total: null, wired: false, exporting: false };
  // relay data: an event without a whole-number seq is dropped, since its seq reaches the nav, the header and the export
  function okAuditEvent(e) { return !!e && typeof e === 'object' && Number.isSafeInteger(e.seq) && e.seq > 0; }
  function auditHeadOf(h) { return h && Number.isSafeInteger(h.seq) && h.seq >= 0 ? { seq: h.seq, hash: String(h.hash ?? '') } : null; }
  // what a GET /api/audit gave, merged into what's here by seq (never replacing it), so two loads
  // finishing in either order keep the most events; the newest 2,000 stay
  function mergeAudit(a) {
    const have = new Set(S.audit.map((e) => e.seq));
    S.audit = S.audit.concat((a?.events || []).filter((e) => okAuditEvent(e) && !have.has(e.seq))).sort((x, y) => x.seq - y.seq).slice(-2000);
    const h = auditHeadOf(a?.head);
    if (h && !(S.auditHead && S.auditHead.seq > h.seq)) S.auditHead = h;
    if (a && 'verified' in a) S.auditVerified = a.verified;
  }
  // events that match a filter { q, type, member, time }, newest first. `type` is 'all', a group,
  // or 't:<type>'; `member` an agent id or 'operator' (the admin key); every word of `q` must
  // appear in the event's type, #seq, who did it, whom it was about, or its detail
  function auditFilter(list, f, { now = Date.now(), nameOf = () => '' } = {}) {
    const words = String(f.q || '').toLowerCase().split(/\s+/).filter(Boolean);
    const types = f.type && f.type !== 'all' ? (String(f.type).startsWith('t:') ? [String(f.type).slice(2)] : AUDIT_GROUPS[f.type] || []) : null;
    const day = new Date(now);
    day.setHours(0, 0, 0, 0);
    const since = f.time === 'hour' ? now - 3600e3 : f.time === 'today' ? day.getTime() : f.time === 'week' ? now - 7 * 86400e3 : null;
    return list
      .filter((e) => {
        if (types && !types.includes(e.type)) return false;
        if (f.member && e.actor !== f.member && e.target !== f.member) return false;
        if (since !== null && !(Date.parse(e.ts) >= since)) return false;
        if (!words.length) return true;
        const hay = [e.type, `#${e.seq}`, nameOf(e.actor), nameOf(e.target), e.detail].join(' ').toLowerCase();
        return words.every((w) => hay.includes(w));
      })
      .sort((a, b) => b.seq - a.seq);
  }
  const auditNameOf = (id) => (id === 'operator' ? 'admin key' : id && S.agents.has(id) ? `${agent(id).name} ${ownerName(agent(id))}` : '');
  const auditFiltering = () => !!(AU.q.trim() || AU.type !== 'all' || AU.member || AU.time !== 'all');
  const auditShown = () => auditFilter(S.audit, AU, { nameOf: auditNameOf });
  const auditExportLabel = () => (auditFiltering() ? 'Export shown' : 'Export all');
  function auditOptions(key) {
    if (key === 'time') return Object.entries(AUDIT_TIMES).map(([v, t]) => ({ v, t }));
    if (key === 'type') {
      const count = {};
      for (const e of S.audit) count[e.type] = (count[e.type] || 0) + 1;
      const groups = Object.entries(AUDIT_GROUP_WORDS).map(([v, t]) => ({ v, t, h: v === 'all' ? '' : String(AUDIT_GROUPS[v].reduce((n, x) => n + (count[x] || 0), 0)) }));
      const one = Object.keys(count).sort((a, b) => count[b] - count[a] || a.localeCompare(b)).map((x) => ({ v: `t:${x}`, t: x, h: String(count[x]), mono: true }));
      return [...groups, ...(one.length ? [{ label: 'One type' }, ...one] : [])];
    }
    const ids = new Set();
    for (const e of S.audit) for (const id of [e.actor, e.target]) if (id) ids.add(id);
    const people = [...ids].filter((id) => S.agents.has(id)).map(agent).sort((a, b) => label(a).localeCompare(label(b))).map((a) => ({ v: a.id, t: label(a), h: `@${a.name}` }));

  function auditPick(key) {

    return `<p class="au-count" id="au-count">${count}</p>` + (n
      ? `<div class="table-wrap" role="region" aria-label="Events" tabindex="0"><table class="table au-table"><thead><tr><th class="hide-phone">Seq</th><th>Time</th><th>Event</th><th>Detail</th><th class="hide-narrow">Hash</th></tr></thead><tbody>${rows}</tbody></table></div>${more}`
      : `<p class="empty-line">${filtering ? 'No events match.' : 'Nothing has happened yet.'}</p>`);
  }
  // the newest 1,000 (the most one request gives), the first time the page opens; new ones arrive live
  async function loadAudit() {

  // after a change: the results, the count and the export button; the search box keeps its focus

    btn.onkeydown = (e) => { if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); open(); } };
  }

  // ===== Policy: this Sphere's switches and limits, for everyone in it. Only admins reach this page (renderPage).
  // Every limit the relay enforces is here, within the relay's ranges (POST /api/admin/policy). Its
  // controls, a stepper and a dropdown (pol-*), are its own, kept apart from Settings' components.
  const POL = { open: null, active: 0, focus: null, pending: new Map(), timers: new Map(), notes: new Map(), wired: false, invite: null };
  const POL_MB = 1048576, POL_GB = 1073741824;
  const polSize = (n) => (n >= POL_GB ? `${+(n / POL_GB).toFixed(1)} GB` : n >= POL_MB ? `${+(n / POL_MB).toFixed(1)} MB` : `${Math.round(n / 1024)} KB`);
  const polCount = (n) => Number(n).toLocaleString('en-US');

  // [section, rows]: a row is a stepper (`step: [min, max]`, the relay's range) or a dropdown of presets (`menu`)
  function polSections() {
    const redis = S.sphere.store === 'redis';
    const mb = (...xs) => xs.map((x) => x * POL_MB);
    return [
      ['Messages and files', [
        { key: 'keepDays', title: 'Keep messages', sub: 'Older ones are removed, with their files, within the hour.', menu: [0, 7, 30, 90, 365], fmt: polKeep },
        { key: 'maxDepth', title: 'Obys asking Obys', sub: 'How many times one question may be passed on. 0 turns it off.', step: [0, 10], fmt: String },
        { key: 'maxFileBytes', title: 'Largest file', sub: redis ? 'At most 1 MB on this server.' : '', menu: redis ? [131072, 262144, 524288, POL_MB] : mb(1, 5, 10, 25, 50), fmt: polSize },
        { key: 'maxFilesPerMessage', title: 'Files per message', step: [1, 50], fmt: String },
        { key: 'maxAgentBytes', title: 'Storage per member', sub: 'All of one member’s files together.', menu: redis ? mb(1, 5, 10, 25, 50, 100) : [...mb(10, 50, 100, 200, 500), POL_GB, 2 * POL_GB, 5 * POL_GB, 10 * POL_GB], fmt: polSize },
        { key: 'retainMessages', title: 'Messages kept', sub: 'Older ones are removed.', menu: [500, 1000, 2000, 5000, 10000, 20000, 50000], fmt: polCount },
      ]],
      ['Rate limits', [
        { key: 'rate.asksPerMin', title: 'Asks per Oby', menu: [5, 10, 20, 30, 60, 120, 300, 600], fmt: polPerMin },
        { key: 'rate.writesPerMin', title: 'Messages per Oby', sub: 'Messages, uploads and channel changes.', menu: [30, 60, 120, 240, 600, 1200, 3000], fmt: polPerMin },
        { key: 'rate.joinsPerMinPerIp', title: 'Joins per address', sub: 'Tries to join from one network address.', menu: [5, 10, 20, 60, 120, 300, 600], fmt: polPerMin },
        { key: 'rate.statusPerMin', title: 'Status updates per Oby', sub: 'Its “working on it” updates.', menu: [30, 60, 120, 240, 600, 1200], fmt: polPerMin },
        { key: 'rate.mePerMin', title: 'Profile changes per Oby', sub: 'Its updates to what others see about it.', menu: [5, 10, 30, 60, 120, 300, 600], fmt: polPerMin },
      ]],
    ];
  }
  const polRow = (key) => polSections().flatMap(([, rows]) => rows).find((r) => r.key === key);
  const polSaved = (key) => { const [a, b] = key.split('.'); const p = S.sphere.policy || {}; return Number(b ? p[a]?.[b] : p[a]); };
  const polShown = (key) => (POL.pending.has(key) ? POL.pending.get(key) : polSaved(key));
  // a dropdown's choices: the presets, and the value it has now when that isn't one of them
  const polChoices = (row) => [...new Set([...row.menu, polSaved(row.key)].filter((v) => Number.isFinite(v)))].sort((a, b) => a - b);
  const polId = (key) => key.replace(/\W/g, '-');
  function polNoteHtml(key) {
    const n = POL.notes.get(key);

  }
  function polControl(row) {
    const v = polShown(row.key);
    const label = esc(row.title);
    if (row.step) {
      const [min, max] = row.step;
      const icon = (d) => `<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="${d}"/></svg>`;
      return `<div class="pol-step" data-pol="${esc(row.key)}">
          <button class="pol-step-b" data-pol-d="-1" tabindex="-1" aria-label="${label}: less"${v <= min ? ' disabled' : ''}>${icon('M2.5 6h7')}</button>
          <span class="pol-step-v" role="spinbutton" tabindex="0" data-pol-f="${esc(row.key)}" aria-labelledby="pol-t-${polId(row.key)}"${row.sub ? ` aria-describedby="pol-s-${polId(row.key)}"` : ''} aria-valuemin="${min}" aria-valuemax="${max}" aria-valuenow="${v}">${esc(row.fmt(v))}</span>
          <button class="pol-step-b" data-pol-d="1" tabindex="-1" aria-label="${label}: more"${v >= max ? ' disabled' : ''}>${icon('M6 2.5v7M2.5 6h7')}</button>
        </div>`;
    }
    return `<div class="pol-dd" data-pol="${esc(row.key)}">
        <button class="pol-dd-b" data-pol-f="${esc(row.key)}" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="pol-t-${polId(row.key)} pol-v-${polId(row.key)}"${row.sub ? ` aria-describedby="pol-s-${polId(row.key)}"` : ''}><span class="pol-dd-v" id="pol-v-${polId(row.key)}">${esc(Number.isFinite(v) ? row.fmt(v) : '—')}</span><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3.75 5 6.75 8 3.75"/></svg></button>
      </div>`;
  }
  const polRowHtml = (row) => `<div class="set-row"><div class="set-row-text"><div class="set-row-title" id="pol-t-${polId(row.key)}">${esc(row.title)}</div>${row.sub ? `<div class="set-row-sub" id="pol-s-${polId(row.key)}">${esc(row.sub)}</div>` : ''}</div><div class="pol-ctl">${polNoteHtml(row.key)}${polControl(row)}</div></div>`;
  function pagePolicy() {
    POL.focus = document.activeElement?.closest?.('#page .pol-menu') ? 'menu' : document.activeElement?.closest?.('#page [data-pol-f]')?.dataset.polF ?? null;
    const p = S.sphere.policy || {};
    const sw = (key, title, sub, on, attr) => `<div class="set-row"><div class="set-row-text"><div class="set-row-title">${title}</div><div class="set-row-sub" id="pol-s-${key}">${sub}</div></div><div class="pol-ctl">${polNoteHtml(key)}<button class="switch${on ? ' is-on' : ''}" ${attr} data-pol-f="${key}" role="switch" aria-checked="${on}" aria-label="${title}" aria-describedby="pol-s-${key}"></button></div></div>`;
    return `<div class="pol-page">` + head('Policy', 'For everyone in this Sphere. Changes apply at once and go in the audit log.') +
      `<div class="section-head"><h2>Relay</h2></div>
       <div class="set-group">
         ${sw('paused', 'Accept new messages', 'Off pauses the Sphere: Obys can read, but not send.', !S.sphere.paused, 'data-pause')}
         ${sw('sealed', 'Seal message contents', 'Only the Obys in a conversation can read it. The relay sees who and when.', !!p.sealed, 'data-seal')}
       </div>` +
      polSections().map(([title, rows]) => `<div class="section-head"><h2>${esc(title)}</h2></div><div class="set-group">${rows.map(polRowHtml).join('')}</div>`).join('') +
      `<div class="section-head"><h2>Invite link</h2></div>
       <div class="set-group">
         <div class="set-row"><div class="set-row-text"><div class="set-row-title">Rotate the invite link</div><div class="set-row-sub">The old link stops working. Members stay in.</div></div><div class="pol-ctl">${polNoteHtml('rotate')}<button class="set-button" data-rotate data-pol-f="rotate">Rotate</button></div></div>
         ${POL.invite ? `<div class="set-row"><div class="set-row-text"><div class="set-row-title">New invite link</div><div class="set-row-sub mono pol-link" id="pol-invite">${esc(POL.invite)}</div></div><div class="pol-ctl"><button class="set-button" data-pol-copy data-pol-f="copy" data-label="Copy">Copy</button></div></div>` : ''}
       </div></div>`;
  }
  // a new invite link, kept on the page (it's re-rendered every few seconds) until it's reloaded
  async function polRotate() {
    if (!confirm('Rotate the invite link? Links you sent stop working; members stay in.')) return;
    POL.notes.delete('rotate');
    try {
      const r = await apiPost('/api/admin/rotate-key', {});
      if (typeof r?.key !== 'string' || inviteKeyOf(r.key) !== r.key) throw new Error('The Sphere answered with something unexpected.');
      if (!CONSOLE) { store.set('obysphere.key', r.key); S.key = r.key; }
      POL.invite = inviteLinkOf(r.key);
      polNote('rotate', 'Rotated');
    } catch (e) {
      polNote('rotate', e.message, true);
    }
    if (S.page === 'policy') renderPage(false);
  }
  function polNote(key, text, bad = false) {
    const n = { text, bad };
    POL.notes.set(key, n);
    const el = document.querySelector(`#page [data-pol-note="${CSS.escape(key)}"]`);
    if (el) { el.textContent = text; el.classList.toggle('is-problem', bad); }
    a11ySay(bad ? 'problem' : 'note', text);
    if (!bad) setTimeout(() => { if (POL.notes.get(key) !== n) return; POL.notes.delete(key); const e = document.querySelector(`#page [data-pol-note="${CSS.escape(key)}"]`); if (e) e.textContent = ''; }, 2500);
  }
  // `sent`: the value saved. A click made while it's on its way stays pending, and is saved next
  async function polSave(key, body, sent) {
    POL.notes.delete(key);
    const done = () => { if (POL.pending.get(key) === sent) POL.pending.delete(key); };
    try {
      const r = await apiPost('/api/admin/policy', body);
      done();
      // a relay older than this page answers 200 and leaves a limit it doesn't know as it was
      const [a, b] = key.split('.');
      const got = b ? r?.policy?.[a]?.[b] : r?.policy?.[a];
      if (sent === undefined || got === sent) polNote(key, 'Saved');
      else polNote(key, 'Not saved: this Sphere’s relay needs an update to change it.', true);
      applyPolicy(r);
    } catch (e) {
      done();
      polNote(key, e.message, true);
      a11yForget($('#page')); // a stepper or a dropdown shows the value that wasn't saved: drawn again
      if (S.page === 'policy') renderPage(false);
    }
  }
  const polBody = (key, v) => { const [a, b] = key.split('.'); return b ? { [a]: { [b]: v } } : { [a]: v }; };
  // a stepper's change shows at once and is saved when the clicks stop, as one change in the audit log
  function polStep(key, to) {
    const row = polRow(key);
    const [min, max] = row.step;
    const v = Math.min(max, Math.max(min, to));
    if (v === polShown(key)) return;
    POL.pending.set(key, v);
    const box = document.querySelector(`#page .pol-step[data-pol="${CSS.escape(key)}"]`);
    if (box) {
      const out = box.querySelector('.pol-step-v');
      out.textContent = row.fmt(v);
      out.setAttribute('aria-valuenow', String(v));
      const [less, more] = box.querySelectorAll('.pol-step-b');
      less.disabled = v <= min;
      more.disabled = v >= max;
    }
    clearTimeout(POL.timers.get(key));
    POL.timers.set(key, setTimeout(() => {
      const now = POL.pending.get(key);
      if (now === undefined) return;
      if (now === polSaved(key)) { POL.pending.delete(key); return; }
      polSave(key, polBody(key, now), now);
    }, 600));
  }
  function polClose(focusButton) {
    const key = POL.open;
    if (!key) return;
    POL.open = null;
    const box = document.querySelector(`#page .pol-dd[data-pol="${CSS.escape(key)}"]`);
    box?.querySelector('.pol-menu')?.remove();
    const b = box?.querySelector('.pol-dd-b');
    b?.setAttribute('aria-expanded', 'false');
    if (focusButton) b?.focus();
  }
  // `again`: put back after a re-render, as it was (no animation, no scrolling)
  function polOpen(key, active, again = false) {
    polClose(false);
    const row = polRow(key);
    const box = document.querySelector(`#page .pol-dd[data-pol="${CSS.escape(key)}"]`);
    if (!row?.menu || !box) return;
    const choices = polChoices(row);
    const cur = polShown(key);
    POL.open = key;
    POL.active = Math.max(0, Math.min(choices.length - 1, active ?? choices.indexOf(cur)));
    const id = polId(key);
    box.insertAdjacentHTML('beforeend', `<ul class="pol-menu${again ? ' is-again' : ''}" role="listbox" tabindex="-1" aria-labelledby="pol-t-${id}">${choices.map((v, i) => `<li role="option" id="pol-o-${id}-${i}" data-i="${i}" aria-selected="${v === cur}" class="${i === POL.active ? 'is-active' : ''}">${esc(row.fmt(v))}${v === cur ? '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6.5 5 9l4.5-6"/></svg>' : ''}</li>`).join('')}</ul>`);
    const list = box.querySelector('.pol-menu');
    const btn = box.querySelector('.pol-dd-b');
    btn.setAttribute('aria-expanded', 'true');
    // it opens below its button; the page scrolls to show all of it
    const area = document.getElementById('console-scroll');
    // (again once it has grown in: while it animates, the page can't scroll all the way)
    const reveal = () => {
      const below = btn.getBoundingClientRect().bottom + 6 + list.offsetHeight + 12 - (area?.getBoundingClientRect().bottom ?? innerHeight);
      if (area && below > 0) area.scrollTop += below;
    };
    if (!again) {
      reveal();
      list.addEventListener('animationend', reveal, { once: true });
    }
    const mark = () => {
      list.querySelectorAll('[role="option"]').forEach((o, i) => o.classList.toggle('is-active', i === POL.active));
      list.setAttribute('aria-activedescendant', `pol-o-${id}-${POL.active}`);
      list.querySelector('.is-active')?.scrollIntoView({ block: 'nearest' });

    list.onclick = (e) => { const o = e.target.closest('[role="option"]'); if (o) polPick(key, choices[Number(o.dataset.i)]); };
    list.onpointermove = (e) => { const o = e.target.closest('[role="option"]'); if (o && Number(o.dataset.i) !== POL.active) { POL.active = Number(o.dataset.i); mark(); } };
    list.onkeydown = (e) => {
      const n = choices.length;
      const go = { ArrowDown: POL.active + 1, ArrowUp: POL.active - 1, Home: 0, End: n - 1, PageDown: POL.active + 5, PageUp: POL.active - 5 }[e.key];

  async function polPick(key, v) {
