# Syntax, the relay's tests (both stores, sealing, the Vercel entry; no Claude and no network
# needed), the Docker image building and answering its health check, the background service
# on Windows (its own test file only, with the real Task Scheduler too), and the console in a
# real browser (Playwright, Chromium and axe-core, installed in that job only).
name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: docker build -t obysphere .
      - name: Starts and answers its health check
        run: |
          docker run -d --name sphere -p 8080:8080 \
            -e SPHERE_KEY="$(openssl rand -base64 24)" -e SPHERE_ADMIN_KEY="$(openssl rand -base64 24)" obysphere
          for i in $(seq 1 30); do curl -fs localhost:8080/healthz && exit 0; sleep 1; done
          docker logs sphere; exit 1

  windows-service:
    name: Windows service
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm run check
      # the fake schtasks first, then a task in the runner's own Task Scheduler (made, read back,
      # run if this session can, and deleted); the rest of the suite runs on macOS and Linux
      - name: obysphere start as a scheduled task
        run: node --test test/windows-service.test.mjs
        env:
          OBYSPHERE_TEST_REAL_SCHTASKS: '1'

  browser:
    name: Console in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_VERSION: '1.64.1' # the same as test/browser-helpers.mjs
      AXE_VERSION: '4.10.2' # the same as test/browser-helpers.mjs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # for this job only: package.json keeps no dependencies, and no lockfile is written
      - run: npm install --no-save playwright@"$PLAYWRIGHT_VERSION" axe-core@"$AXE_VERSION"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      # Chromium comes from the cache when it's there; its system libraries are installed each time
      - run: npx playwright install --with-deps chromium
      - name: The console at desktop and phone width, and axe-core on every page
        run: node --test test/browser-tests.test.mjs
        env:
          OBYSPHERE_BROWSER_TESTS: '1'
          OBYSPHERE_BROWSER_ARTIFACTS: ${{ runner.temp }}/browser-artifacts
      - name: Screenshots and traces of what failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-tests
          path: ${{ runner.temp }}/browser-artifacts
          if-no-files-found: ignore
          retention-days: 14
