# A release, when someone pushes a v* tag (git tag v0.3.0 && git push origin v0.3.0):
# the tests, then obysphere-<version>.tar.gz (the tracked files, from git archive) and
# its SHA256SUMS, attached to a GitHub release. install.sh and `obysphere update` take
# the latest release and check it against SHA256SUMS. Nothing runs on other pushes.
name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The tag matches package.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$version" ]; then
            echo "The tag is $GITHUB_REF_NAME but package.json says $pkg: bump package.json first." >&2
            exit 1
          fi
      - run: npm run check
      - run: npm test
      - name: Build the tarball and SHA256SUMS
        run: |
          version="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="obysphere-$version/" -o "obysphere-$version.tar.gz" "$GITHUB_SHA"
          sha256sum "obysphere-$version.tar.gz" > SHA256SUMS
          cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "obysphere-$version.tar.gz" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
