# A release, when someone pushes a v* tag (git tag v0.3.0 && git push origin v0.3.0):
# the tests, then obysphere-<version>.tar.gz (the tracked files, from git archive) and
# its SHA256SUMS, attached to a GitHub release. install.sh and `obysphere update` take
# the latest release and check it against SHA256SUMS. Then the Docker image,
# ghcr.io/obi-ai-bot/oby-sphere:<version> (and :latest, unless it's a pre-release like
# v0.4.0-rc.1), for linux/amd64 and linux/arm64. Nothing runs on other pushes or on
# pull requests: CI only builds the image and checks it starts.
name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: The tag matches package.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$version" ]; then
            echo "The tag is $GITHUB_REF_NAME but package.json says $pkg: bump package.json first." >&2
            exit 1
          fi
      - run: npm run check
      - run: npm test
      - name: Build the tarball and SHA256SUMS
        run: |
          version="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="obysphere-$version/" -o "obysphere-$version.tar.gz" "$GITHUB_SHA"
          sha256sum "obysphere-$version.tar.gz" > SHA256SUMS
          cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # a pre-release (0.4.0-rc.1) is marked so: install.sh, obysphere update and the image's
          # :latest all stay on the last release
          pre=()
          case "$version" in *-*) pre=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" "obysphere-$version.tar.gz" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag "${pre[@]}"

  # ===== docker-image: the published image, after the tests and the release above
  image:
    name: Docker image ${{ github.ref_name }}
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # only this job may write packages; it reads the code and nothing else
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: The image's name, tags and version
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            ''|*[!0-9A-Za-z._-]*)
              echo "The tag $GITHUB_REF_NAME can't be a Docker tag: letters, digits, . _ and - only." >&2
              exit 1 ;;
          esac
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          tags="$image:$version"
          # a pre-release (0.4.0-rc.1) gets its own tag only: latest stays on the last release
          case "$version" in
            *-*) ;;
            *) tags="$tags,$image:latest" ;;
          esac
          {
            echo "version=$version"
            echo "image=$image"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"
          echo "Tags: $tags"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build it for this runner
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: obysphere:check
      - name: It starts and answers its health check
        run: |
          umask 077
          printf 'SPHERE_KEY=%s\nSPHERE_ADMIN_KEY=%s\n' "$(openssl rand -hex 24)" "$(openssl rand -hex 24)" > "$RUNNER_TEMP/sphere.env"
          docker run -d --name sphere -p 8080:8080 --env-file "$RUNNER_TEMP/sphere.env" obysphere:check
          for _ in $(seq 1 30); do curl -fs localhost:8080/healthz && exit 0; sleep 1; done
          docker logs sphere; exit 1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push, linux/amd64 and linux/arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # the OCI labels link the package to this repository, on each image and on the index
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.title=Obysphere
            org.opencontainers.image.description=A Sphere: the relay where people's AI agents meet. Every answer is worked out on its owner's machine.
          annotations: |
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            index:org.opencontainers.image.revision=${{ github.sha }}
            index:org.opencontainers.image.licenses=Apache-2.0
            index:org.opencontainers.image.description=A Sphere: the relay where people's AI agents meet. Every answer is worked out on its owner's machine.
          # how it was built (the workflow, the commit) and what it holds, attached to the image
          provenance: mode=max
          sbom: true
