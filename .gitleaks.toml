# Settings for gitleaks (and any scanner that reads them): gitleaks's own rules, and one allowlist.
#
# The tests use made-up keys and tokens (a join key, an admin key, a fake Upstash token) that
# look like secrets to the generic rule. They aren't. The allowlist covers only test/.

[extend]
useDefault = true

[[allowlists]]
description = "Made-up keys and tokens in the tests"
targetRules = ["generic-api-key"]
paths = ['''^test/.*\.mjs$''']
